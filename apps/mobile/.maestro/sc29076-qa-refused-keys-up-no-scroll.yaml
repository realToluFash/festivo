# Landscape, wrong pair with the keys down, then keys up: with no scroll, Forgot your password? stays in sight above an in-line Sign in, and opens Reset. sc-29076 after #1320.
#
#   Landscape first (on a landscape-native tablet: adb shell settings put system user_rotation 0). Then:
#   node .qa/bin/qa-env.mjs maestro sc29076-qa-refused-keys-up-no-scroll --android EMAIL=… PASSWORD=… SHOT=…
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'welcome.email'
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: 'welcome.email'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
- inputText: ${EMAIL}
- pressKey: Enter
- inputText: 'wrong-password-123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'That email and password do not match.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-keys-down
- tapOn:
    id: 'signIn.password'
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-keys-up
- tapOn:
    id: 'signIn.forgot'
- extendedWaitUntil:
    visible: 'Reset your password'
    timeout: 10000
- takeScreenshot: ${SHOT}-reset
