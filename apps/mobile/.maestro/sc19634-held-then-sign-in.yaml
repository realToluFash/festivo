# Signed out: a sign-up for A held on Check your email, then back to Sign in and a sign-in
# as B with Email and Password, ending on whatever WAIT_TEXT names. sc-19634.
#
#   node .qa/bin/qa-env.mjs maestro sc19634-held-then-sign-in --android A_NAME=… A_EMAIL=… A_PASSWORD=… \
#     EMAIL=… PASSWORD=… WAIT_TEXT='Signed in as.*' SHOT=…
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- runFlow: sign-in-screen-english.yaml
- runFlow: sc19634-register.yaml
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- inputText: ${PASSWORD}
- tapOn:
    id: 'signIn.submit'
- scrollUntilVisible:
    element:
      text: ${WAIT_TEXT}
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${SHOT}-after-sign-in
