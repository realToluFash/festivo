# Signs out from Settings and ends on welcome. Shared, as open-settings.yaml is.
# batch/sign-out.yaml is the batch's: it also passes when nobody is signed in.
appId: host.exp.Exponent
---
- runFlow: return-home.yaml
- tapOn:
    id: 'home.openSettings'
- runFlow: settings-sign-out-tap.yaml
- extendedWaitUntil:
    visible:
      id: 'welcome.email'
    timeout: 30000
- takeScreenshot: mobile-signed-out
