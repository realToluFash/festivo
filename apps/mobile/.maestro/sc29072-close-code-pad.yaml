# sc-29072: closes Enter your code's number pad: a tap on the title on iOS, where hideKeyboard cannot close the iPhone's pad (sc-19584), and hideKeyboard on Android.
appId: host.exp.Exponent
---
- runFlow:
    when: { platform: iOS }
    commands:
      - tapOn: '{{t:twoFactor.title}}'
- runFlow:
    when: { platform: Android }
    commands:
      - hideKeyboard
