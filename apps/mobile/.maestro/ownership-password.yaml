# Transfer ownership with the password field reached by scrolling, then leave. sc-7715.
appId: host.exp.Exponent
---
- runFlow: sign-in-only.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: 'Not Now'
    optional: true
- openLink: ${METRO_URL}/--/settings/organisation
- tapOn:
    text: 'Not Now'
    optional: true
- scrollUntilVisible:
    element:
      id: 'ownership.transfer'
    timeout: 60000
- tapOn:
    id: 'ownership.transfer'
- scrollUntilVisible:
    element:
      id: 'ownership.owner.${MEMBER}'
    timeout: 15000
- tapOn:
    id: 'ownership.owner.${MEMBER}'
- scrollUntilVisible:
    element:
      id: 'ownership.password'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'ownership.password'
- waitForAnimationToEnd
- inputText: 'wrong-password-123'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-typed
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'ownership.transfer.send'
- tapOn:
    id: 'ownership.transfer.send'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-transfer-wrong
- scrollUntilVisible:
    element:
      id: 'ownership.password'
    centerElement: true
- tapOn:
    id: 'ownership.password'
- eraseText: 60
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'ownership.transfer.send'
- tapOn:
    id: 'ownership.transfer.send'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: ${SHOT}-transferred
- scrollUntilVisible:
    element:
      id: 'ownership.leave'
- tapOn:
    id: 'ownership.leave'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-leave
