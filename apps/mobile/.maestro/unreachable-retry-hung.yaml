# Presses Try again while the API hangs, and screenshots the busy button. sc-13256. Pass SHOT.
appId: host.exp.Exponent
---
- tapOn:
    id: 'unreachable.retry'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: 'unreachable.retry'
      enabled: false
    timeout: 5000
- takeScreenshot: ${SHOT}
