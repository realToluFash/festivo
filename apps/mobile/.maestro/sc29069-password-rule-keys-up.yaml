# sc-29069: Register's password rule, keys up and keys down. Run signed out.
#   node .qa/bin/qa-env.mjs maestro sc29069-password-rule-keys-up --android
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- openLink: ${METRO_URL}/--/register
- extendedWaitUntil:
    visible:
      id: 'register.password'
    timeout: 60000
- tapOn:
    id: 'register.password'
- inputText: 'short'
- waitForAnimationToEnd
- takeScreenshot: rule-keys-up
- hideKeyboard
- takeScreenshot: rule-keys-down
