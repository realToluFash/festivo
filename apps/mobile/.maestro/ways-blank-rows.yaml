# Signs in, opens Security, and shows Ways to sign in down to Apple, for rows linked with a blank address. sc-13266.
appId: host.exp.Exponent
---
- runFlow: sign-in.yaml
- extendedWaitUntil:
    notVisible:
      id: 'signIn.submit'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- openLink: ${METRO_URL}/--/settings/security
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'ways.apple.unlink'
    timeout: 30000
    centerElement: true
- takeScreenshot: mobile-13266-ways-linked-blank
