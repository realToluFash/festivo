# A new account's four steps, one job a screen (sc-29069): blank fields refused, a wrong
# email code refused, the right one goes on, the organisation saved, and Skip on the mobile step.
# Starts signed in or signed out. EMAIL must be fresh.
#
#   node .qa/bin/qa-env.mjs maestro sc29069-new-account-walk --android NAME=… EMAIL=… PASSWORD=…
appId: host.exp.Exponent
---
- runFlow: batch/sign-out.yaml
- runFlow: sign-in-screen-english.yaml
- openLink: ${METRO_URL}/--/register
- extendedWaitUntil:
    visible:
      id: 'register.name'
    timeout: 60000
- takeScreenshot: sc29069-register
- tapOn:
    id: 'register.submit'
- waitForAnimationToEnd
- takeScreenshot: sc29069-register-blank
- tapOn:
    id: 'register.name'
- eraseText: 120
- inputText: ${NAME}
- tapOn:
    id: 'register.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'register.password'
- eraseText: 120
- inputText: 'short'
- takeScreenshot: sc29069-register-rule-unmet
- eraseText: 20
- inputText: ${PASSWORD}
- takeScreenshot: sc29069-register-rule-met
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'verifyEmail.code'
    timeout: 30000
- takeScreenshot: sc29069-verify-email
- tapOn:
    id: 'verifyEmail.code'
- inputText: '000000'
- takeScreenshot: sc29069-verify-email-wrong-0
- waitForAnimationToEnd
- takeScreenshot: sc29069-verify-email-wrong
- runScript: scripts/latest-code.js
- tapOn:
    id: 'verifyEmail.code'
- inputText: ${output.code}
- takeScreenshot: sc29069-verify-email-right
- extendedWaitUntil:
    visible: 'Your organisation'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: sc29069-organisation
- tapOn:
    id: 'completeProfile.save'
- waitForAnimationToEnd
- takeScreenshot: sc29069-organisation-blank
- tapOn:
    id: 'completeProfile.organisation'
- inputText: 'QA Walk Ltd'
# An emulator region the list lacks (en-DG) leaves Country blank, as before this story.
- tapOn:
    id: 'completeProfile.country'
- tapOn:
    id: 'completeProfile.country.search'
- inputText: 'United King'
- tapOn:
    id: 'completeProfile.country.GB'
- takeScreenshot: sc29069-organisation-filled
- tapOn:
    id: 'completeProfile.save'
- extendedWaitUntil:
    visible:
      id: 'phone.number'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: sc29069-mobile
- tapOn:
    id: 'phone.right'
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'phone.number'
    timeout: 15000
- takeScreenshot: sc29069-after-skip
