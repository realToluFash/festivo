# A tap on SAVE that sends nothing shows TEXT and leaves CANCEL live. sc-12545.
#
#   node .qa/bin/qa-env.mjs maestro cancel-blank SAVE=… CANCEL=… TEXT=… NAME=…
appId: host.exp.Exponent
---
- runFlow:
    when:
      notVisible:
        id: ${SAVE}
    commands:
      - scrollUntilVisible:
          element:
            id: ${SAVE}
          direction: UP
          timeout: 15000
          optional: true
- scrollUntilVisible:
    element:
      id: ${SAVE}
    centerElement: true
- tapOn:
    id: ${SAVE}
- extendedWaitUntil:
    visible: ${TEXT}
    timeout: 5000
- takeScreenshot: ${NAME}-blank
- scrollUntilVisible:
    element:
      id: ${CANCEL}
    centerElement: true
- assertVisible:
    id: ${CANCEL}
    enabled: true
- takeScreenshot: ${NAME}-blank-cancel
