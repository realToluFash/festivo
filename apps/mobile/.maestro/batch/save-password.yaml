# iOS offers to save the password, in the device's language, and on an iPad it can arrive
# well after the screen behind it, most of all in a cold batch. So it is waited for rather
# than checked once, and only on iOS, which is the only platform that asks.
appId: host.exp.Exponent
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Not Now|Ahora no|Pas maintenant|Agora não'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: 'Not Now|Ahora no|Pas maintenant|Agora não'
          commands:
            - tapOn: 'Not Now|Ahora no|Pas maintenant|Agora não'
