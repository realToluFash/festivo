# Leaves ${EMAIL} signed in, signing in only when Expo Go is not already. sc-12596.
#
# Another account is signed out first. Home or Settings says whose session it is, in any of
# the four languages, since the last batch may have left the account in any of them. The card's
# heading is waited for rather than the Signed in as line, which a long organisation name
# or a large text size puts below the fold. sc-18454.
appId: host.exp.Exponent
---
# A tablet in landscape shows no Signed in as line in Settings, so the session is read upright.
- setOrientation: PORTRAIT
- runScript:
    file: helper.js
    env:
      ASK: /portrait
- openLink: ${METRO_URL}/--/
- runFlow:
    file: developer-menu.yaml
    env:
      SETTLED: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:status.title}}|{{t:any:signIn.title}}|{{t:any:welcome.withEmail}}|{{t:any:signInRules.overdueTitle}}'
- extendedWaitUntil:
    visible: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:status.title}}|{{t:any:signIn.title}}|{{t:any:welcome.withEmail}}|{{t:any:signInRules.overdueTitle}}'
    timeout: 60000
    optional: true
# The two-factor overdue screen names no account, so the batch signs out there and back in. sc-28435.
- runFlow:
    when:
      visible: '{{t:any:signInRules.overdueTitle}}'
    file: sign-out.yaml
# The reload before this can crash an Expo Go that has only just opened.
- runFlow:
    when:
      notVisible: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:status.title}}|{{t:any:signIn.title}}|{{t:any:welcome.withEmail}}|{{t:any:signInRules.overdueTitle}}'
    file: reopen.yaml
# Today names no account, so whose session it is is read in Settings. sc-30091.
- runFlow:
    when:
      visible: '{{t:any:todayScreen.tab.today}}'
    file: to-settings.yaml
- runFlow:
    when:
      visible: '{{t:any:home.signedInTo}}|{{t:any:settings.title}}|{{t:any:noOrganisation.title}}'
    commands:
      - scrollUntilVisible:
          element:
            text: '{{t:any:settings.signedInAs}}|{{t:any:noOrganisation.signedInAs}}'
          direction: DOWN
          timeout: 30000
- runFlow:
    when:
      visible: '{{t:any:settings.signedInAs}}|{{t:any:noOrganisation.signedInAs}}'
      notVisible: '{{t:any:settings.signedInAs|email}}|{{t:any:noOrganisation.signedInAs|email}}'
    file: sign-out.yaml
- runFlow:
    when:
      notVisible: '{{t:any:settings.signedInAs|email}}|{{t:any:noOrganisation.signedInAs|email}}'
    file: sign-in-form.yaml
