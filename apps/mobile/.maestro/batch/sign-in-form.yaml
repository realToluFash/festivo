# The sign-in form, without the relaunch sign-in.yaml makes: a batch launches Expo Go once.
# With two-factor on, the code comes from sign-in-two-factor.yaml.
appId: host.exp.Exponent
---
- runFlow: sign-in-typed.yaml
- runFlow:
    when:
      visible:
        id: 'twoFactor.code'
    file: ../sign-in-two-factor.yaml
# Signing in lands on Today, which names no account: Settings does. sc-30091.
- extendedWaitUntil:
    visible: '{{t:any:todayScreen.tab.today}}|{{t:any:home.signedInTo}}|{{t:any:noOrganisation.title}}|{{t:any:eventNav.more}}|{{t:any:eventNav.overview}}|{{t:any:steps.organisationTitle}}|{{t:any:steps.invitedTitle}}|{{t:any:signInRules.overdueTitle}}|{{t:any:accessPaused.badge}}'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: '{{t:any:todayScreen.tab.today}}'
    file: to-settings.yaml
# An account in no organisation that holds an event from outside lands inside it, which names
# no account: Settings does. sc-68438.
- runFlow:
    when:
      visible:
        id: 'event\.nav\..*'
    file: to-settings.yaml
# The two-factor overdue screen names no account, and counts as signed in. sc-28435.
# An account in no organisation with an invitation lands on You're invited, named on its invitation. sc-32120.
# An account that signed up but has no profile yet lands on its organisation step, which names no account. sc-44356.
# A member paused in their only organisation lands on the paused page, which names no account and has no Settings. sc-85162.
- scrollUntilVisible:
    element:
      text: '{{t:any:settings.signedInAs|email}}|{{t:any:settings.personLabel|email}}|{{t:any:settings.personLabelWithRole|email}}|{{t:any:noOrganisation.signedInAs|email}}|{{t:any:steps.invitationFor|email}}|{{t:any:signInRules.overdueTitle}}|{{t:any:steps.organisationTitle}}|{{t:any:accessPaused.badge}}'
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
