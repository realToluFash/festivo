# The save-password sheet that arrived after save-password.yaml stopped waiting for it, most
# of all on an iPad in a cold batch. Checked once, without a wait, before the next screen.
appId: host.exp.Exponent
---
- runFlow:
    when:
      platform: iOS
      visible: 'Not Now|Ahora no|Pas maintenant|Agora não'
    commands:
      - tapOn: 'Not Now|Ahora no|Pas maintenant|Agora não'
