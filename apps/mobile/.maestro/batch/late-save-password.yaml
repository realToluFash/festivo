# The save-password sheet that arrived after save-password.yaml stopped waiting for it, most
# of all on an iPad in a cold batch. Checked once, without a wait, before the next screen.
# Keyed on the sheet's title, which the app never shows: its Not Now is the app's notNow and
# gateLater, and its Save password button is the app's setSave.
appId: host.exp.Exponent
---
- runFlow:
    when:
      platform: iOS
      visible: '¿?(Save Password|Guardar contraseña|Enregistrer le mot de passe|Guardar palavra-passe|Salvar senha).?\?'
    commands:
      - tapOn: 'Not Now|Ahora no|Pas maintenant|Agora não'
