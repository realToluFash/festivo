# A check finds its screen as a person opening it would. `openLink` reaches a route
# without remounting it, so the bundle is reloaded instead: every screen remounts, the
# session is kept, and Expo Go is not relaunched.
appId: host.exp.Exponent
---
# A check that turned the iPad and failed before turning it back leaves it turned.
- setOrientation: PORTRAIT
# A check that went offline and failed before coming back leaves the phone offline.
- setAirplaneMode: disabled
# Android's PORTRAIT is rotation 0, landscape on a landscape-native tablet: the harness turns it.
- runScript:
    file: helper.js
    env:
      ASK: /portrait
- runScript:
    file: helper.js
    env:
      ASK: /reload
# On Android a reload the app never took leaves the last check's screen mounted.
- runFlow:
    when:
      true: ${!output.helper.reloaded}
    file: reopen.yaml
# Home, whatever link Expo Go reopens the experience at. Four sign-in rule notices push the
# card below the fold and the two-factor overdue screen replaces it, so either settles. sc-23252.
# For an organisation that has events Home is Today, which loads them first. sc-30091.
- openLink: ${METRO_URL}/--/
# Gone first, or the screen from before the reload passes the wait below.
- extendedWaitUntil:
    notVisible: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:signInRules.dueSetUp}}|{{t:any:signInRules.unlinkedLink}}|{{t:any:signInRules.gateTitle}}|{{t:any:signInRules.changedSee}}|{{t:any:signInRules.overdueTitle}}'
    timeout: 10000
    optional: true
- runFlow:
    file: developer-menu.yaml
    env:
      SETTLED: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:signInRules.dueSetUp}}|{{t:any:signInRules.unlinkedLink}}|{{t:any:signInRules.gateTitle}}|{{t:any:signInRules.changedSee}}|{{t:any:signInRules.overdueTitle}}'
# The first reload after signing in can close Expo Go rather than reload it. Asked of the
# harness, since a notVisible condition waits out seven seconds from the last command.
- runScript:
    file: helper.js
    env:
      ASK: /running
- runFlow:
    when:
      true: ${!output.helper.running}
    file: reopen.yaml
- extendedWaitUntil:
    visible: '{{t:any:home.signedInTo}}|{{t:any:todayScreen.tab.today}}|{{t:any:noOrganisation.title}}|{{t:any:signInRules.dueSetUp}}|{{t:any:signInRules.unlinkedLink}}|{{t:any:signInRules.gateTitle}}|{{t:any:signInRules.changedSee}}|{{t:any:signInRules.overdueTitle}}'
    timeout: 30000
