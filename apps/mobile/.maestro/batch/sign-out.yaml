# Signs whoever is signed in out, from Settings. Nobody signed in, it does nothing.
#
# openLink does not remount a Home that session.yaml has scrolled down to its Signed in as
# line, so that line counts as signed in as well as the card's heading. sc-18454.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- runFlow: developer-menu.yaml
- extendedWaitUntil:
    visible: '{{t:any:home.signedInTo}}|{{t:any:noOrganisation.title}}|{{t:any:settings.signedInAs}}|{{t:any:noOrganisation.signedInAs}}|{{t:any:status.title}}|{{t:any:signIn.title}}'
    timeout: 60000
- runFlow:
    when:
      visible: '{{t:any:home.signedInTo}}|{{t:any:noOrganisation.title}}|{{t:any:settings.signedInAs}}|{{t:any:noOrganisation.signedInAs}}'
    commands:
      - openLink: ${METRO_URL}/--/settings
      - scrollUntilVisible:
          element:
            id: 'settings.signOut'
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: 'settings.signOut'
      - extendedWaitUntil:
          notVisible:
            id: 'settings.signOut'
          timeout: 30000
