# Change your password open, Current password left empty, a valid New password typed, keys up. sc-13408.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible:
      id: 'security.password'
    timeout: 30000
- tapOn:
    id: 'security.password'
- tapOn:
    id: 'security.change.new'
- inputText: 'brand-new-password-123'
- takeScreenshot: mobile-13408-password-new-only
