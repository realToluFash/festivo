# A sign-up on Register, in English, that stops on Check your email for EMAIL. sc-18534.
# The first step of the verify-email flows. EMAIL must be fresh: a taken address is sent no code.
#
#   node .qa/bin/qa-env.mjs maestro register-check-email NAME=… EMAIL=… PASSWORD=…
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- openLink: ${METRO_URL}/--/register
- extendedWaitUntil:
    visible:
      id: 'register.name'
    timeout: 60000
- tapOn:
    id: 'register.name'
- eraseText: 120
- inputText: ${NAME}
- tapOn:
    id: 'register.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'register.password'
- eraseText: 120
- inputText: ${PASSWORD}
- scrollUntilVisible:
    element:
      id: 'register.submit'
- takeScreenshot: mobile-register-filled
- tapOn:
    id: 'register.submit'
# The dialog can arrive seconds after the next screen has rendered, so wait for it.
- extendedWaitUntil:
    visible: 'Save Password?'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible:
      id: 'verifyEmail.code'
    timeout: 30000
- assertVisible: 'We sent a code to .*'
