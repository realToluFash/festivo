# Landscape, wrong pair with the keys down, then keys up: a scroll from above the keys brings Forgot your password? above the docked Sign in, and it opens Reset. sc-29076.
#
#   Landscape first (on a landscape-native tablet: adb shell settings put system user_rotation 0). Then:
#   node .qa/bin/qa-env.mjs maestro sc29076-qa-refused-keys-up-landscape --android EMAIL=… PASSWORD=… SHOT=…
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'welcome.email'
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: 'welcome.email'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
- inputText: ${EMAIL}
- pressKey: Enter
- inputText: 'wrong-password-123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'That email and password do not match.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-keys-down
- tapOn:
    id: 'signIn.password'
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-keys-up
# From above the keys: in landscape the screen's centre is on the keyboard.
- swipe:
    start: 50%, 35%
    end: 50%, 10%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-forgot-in-sight
- tapOn:
    id: 'signIn.forgot'
- extendedWaitUntil:
    visible: 'Reset your password'
    timeout: 10000
- takeScreenshot: ${SHOT}-reset
