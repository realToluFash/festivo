# Sign in with an email and no password: Password is refused with "Enter your password.". Leaves the refused form on screen, for a screen-reader pass. sc-31323. Waits by testID and matches the refusal in all four languages, so it holds in any language.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'welcome\.email|signIn\.email'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'welcome.email'
    commands:
      - tapOn:
          id: 'welcome.email'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 60000
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- hideKeyboard
- tapOn:
    id: 'signIn.submit'
- waitForAnimationToEnd
- assertVisible:
    id: 'signIn.password'
- assertVisible: 'Enter your password\.|Introduzca su contraseña\.|Saisissez votre mot de passe\.|Introduza a sua palavra-passe\.'
- takeScreenshot: password-empty-refused
