# Sign in with an email and no password: Password is refused with "Enter your password.". Leaves the refused form on screen, for a screen-reader pass. sc-31323. Asserts by testID, so it holds in any language.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible: 'Email|Sign in with email'
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: 'welcome.email'
    commands:
      - tapOn:
          id: 'welcome.email'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 60000
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- hideKeyboard
- tapOn:
    id: 'signIn.submit'
- waitForAnimationToEnd
- assertVisible:
    id: 'signIn.password'
- takeScreenshot: password-empty-refused
