# Types NEW_PASSWORD at Choose a password and presses Save password; leaves the answer on screen. sc-13138.
#
#   node .qa/bin/qa-env.mjs maestro set-password-save --android NEW_PASSWORD=…
appId: host.exp.Exponent
---
- tapOn:
    id: 'password.setNew'
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'password.setSave'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: set-password-save
