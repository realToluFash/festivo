# Types NEW_PASSWORD at Choose a password and sends it; leaves the answer on screen. sc-13138.
#
#   node .qa/bin/qa-env.mjs maestro set-password-save --android NEW_PASSWORD=…
appId: host.exp.Exponent
---
- tapOn:
    id: 'password.setNew'
- inputText: ${NEW_PASSWORD}
# On iOS Return, which sends the form: hideKeyboard fails on an iPhone (sc-19584). On
# Android Enter can type into the field instead (sc-18648), so it taps. No retry.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: 'password.setSave'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: set-password-save
