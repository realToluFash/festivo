# sc-34901: the design demo's Notification settings at saving, the same parts the app draws.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/notifications?state=saving
- waitForAnimationToEnd:
    timeout: 8000
- runFlow: ../developer-menu-close.yaml
- extendedWaitUntil:
    visible:
      text: '.*'
    timeout: 20000
- takeScreenshot: demo-saving
