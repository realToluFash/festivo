# sc-36468: acc screen, blank error, then the code goes to a text by textfail; the error follows (or keeps its words).
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/sc36468-fresh-phone.js
    env:
      MODE: alt
      FAIL: '1'
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.step'
    timeout: 30000
- tapOn:
    id: 'account.step'
- extendedWaitUntil:
    visible: '{{t:verifyPhone.introWhatsApp}}'
    timeout: 30000
- tapOn:
    id: 'account.verify.code'
- tapOn:
    id: 'account.verify.submit'
- extendedWaitUntil:
    visible: '{{t:verifyPhone.codeBlankWhatsApp}}'
    timeout: 10000
- takeScreenshot: before
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'account.verify.text'
    timeout: 10000
- tapOn:
    id: 'account.verify.text'
- extendedWaitUntil:
    visible: '{{t:verifyPhone.textInsteadFailed}}'
    timeout: 15000
- waitForAnimationToEnd
- assertVisible: '{{t:verifyPhone.codeBlankWhatsApp}}'
- takeScreenshot: after
