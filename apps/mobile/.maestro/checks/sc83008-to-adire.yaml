# sc-83008: makes Adire Studio the organisation on screen, on Today.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 30000
- tapOn:
    id: 'home.switchOrganisation'
- tapOn:
    text: '.*Adire Studio.*'
    index: 0
- waitForAnimationToEnd
