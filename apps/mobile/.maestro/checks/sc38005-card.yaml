# sc-38005: Members' summary card with requests to get back in and to join waiting, then the list. Needs ${METRO_URL}; two waiting recovery requests and one request to join.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: card
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222221.approve'
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: list
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222222.turnDown'
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: list2
