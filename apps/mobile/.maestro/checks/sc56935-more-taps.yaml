# sc-56935, phone: each More row, tapped, opens its area, and the sheet then shows it chosen; then the four bar tabs open theirs. Pass EVENT_ID, an event the signed-in host owns; English is enough.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil: { visible: { id: 'event.nav.more' }, timeout: 30000 }
- runFlow: ../developer-menu-close.yaml
- tapOn: { id: 'event.nav.more' }
- extendedWaitUntil: { visible: { id: 'event.nav.more.seating' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { id: 'event.nav.more.seating' }
- extendedWaitUntil: { notVisible: { id: 'event.nav.moreSheet.close' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: opened-seating
- tapOn: { id: 'event.nav.more' }
- extendedWaitUntil: { visible: { id: 'event.nav.more.seating', selected: true }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: chosen-seating
- tapOn: { id: 'event.nav.moreSheet.close' }
