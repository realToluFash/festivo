# sc-83008: an event opened from the Calendar on a later day: ‹ Calendar, back to the Calendar on that day.
# Needs: Adire Studio holding Ibadan Supper on the 23rd of the month the Calendar opens on.
appId: host.exp.Exponent
---
- runFlow: sc83008-to-adire.yaml
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'tab-calendar'
    timeout: 30000
- tapOn:
    id: 'tab-calendar'
- waitForAnimationToEnd
- takeScreenshot: calendar-before
- tapOn: '.*Mon 23.*|.*23.*'
- waitForAnimationToEnd
- takeScreenshot: calendar-day
- scrollUntilVisible:
    element: '.*Ibadan Supper.*'
    timeout: 20000
- tapOn: '.*Ibadan Supper.*'
- extendedWaitUntil:
    visible:
      id: 'frame.back'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: event
- assertVisible:
    id: 'frame.back'
    text: '.*Calendar.*|.*Calendario.*'
- tapOn:
    id: 'frame.back'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'events.page'
- assertVisible:
    id: 'calendar.month'
- assertVisible: '.*Ibadan Supper.*'
- takeScreenshot: back
