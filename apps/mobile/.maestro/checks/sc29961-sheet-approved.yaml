# sc-29961: an answer (approved) arriving while Cancel your request? is open closes the sheet and shows it. The answer is made from the shell (.qa/sc29961/answer.py).
# The run-out and answer helpers are not in the repository: their recipe is qa's comment #67586 on sc-29961. Without them this check fails after its wait, with nothing saying why.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- runFlow: ../sc29961-to-waiting.yaml
- tapOn: { id: 'lostTwoFactor.cancel' }
- extendedWaitUntil: { visible: '{{t:lostTwoFactor.cancelTitle}}', timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: sheet-open
- extendedWaitUntil: { visible: '{{t:lostTwoFactor.approvedTitle}}', timeout: 90000 }
- waitForAnimationToEnd
- assertNotVisible: '{{t:lostTwoFactor.cancelTitle}}'
- takeScreenshot: answered
