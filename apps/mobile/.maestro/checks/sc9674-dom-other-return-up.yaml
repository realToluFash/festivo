# Add a domain: example.org sent by the return key with the keys up, held, return pressed again, then refused. Keys stay up, the value is edited at once and sent again by return. sc-9674.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.domain.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- tapOn:
    id: organisation.domain.add
- extendedWaitUntil:
    visible:
      id: organisation.domain.field
    timeout: 10000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: organisation.domain.field
      - eraseText: 80
- inputText: 'example.org'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: at-return
- assertVisible: '(?i)(shift|delete)'
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: while-held
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '(?:Add a domain your own address is at|Añada el dominio de su propia dirección|Ajoutez le domaine de votre propre adresse|Adicione o domínio do seu próprio endereço).*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertVisible: '(?i)(shift|delete)'
- inputText: x
- assertVisible:
    id: organisation.domain.field
    text: 'example.orgx'
- pressKey: Enter
- extendedWaitUntil:
    visible: '(?:Add a domain your own address is at|Añada el dominio de su propia dirección|Ajoutez le domaine de votre propre adresse|Adicione o domínio do seu próprio endereço).*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: sent-again
- assertVisible: '(?i)(shift|delete)'
