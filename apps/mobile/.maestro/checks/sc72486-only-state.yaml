# sc-72486: Email domains with the domain's Only our organisation row in view, in whatever state the stack holds. Pass METRO_URL and DOMAIN.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.card
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc72486-only-state-top
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.onlyRow
    direction: DOWN
    timeout: 15000
- takeScreenshot: sc72486-only-state-row
