# An event's Delete sheet, on an event with one on its guest list: the guest-list line, read in the account's language.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ONE}
- scrollUntilVisible:
    element:
      id: 'events.delete'
    timeout: 30000
- tapOn:
    id: 'events.delete'
- extendedWaitUntil:
    visible:
      id: 'event.delete.guests'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: delete-event-guests-one
