# Organisation: Contact address focused, keys up, API stopped, Save changes tapped above the keys. The whole notice ends in view, keys up. sc-24496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.contact
    centerElement: true
- tapOn:
    id: organisation.contact
- waitForAnimationToEnd
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: organisation.save
    centerElement: true
- tapOn:
    id: organisation.save
- extendedWaitUntil:
    visible: '.*{{t:orgGeneral.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertVisible: '(?i)(shift|delete)'
