# sc-3780 retest of #2416: ${EVENT_ID}'s Next up and Coming up after Reply by saves, without the screen opening again.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: hero-before
- scrollUntilVisible:
    element:
      text: 'Reply by.*'
- tapOn:
    text: 'Reply by.*'
- tapOn:
    id: 'event.edit.replyBy.date'
- tapOn: '20'
- tapOn: 'OK'
- tapOn: 'Save'
- tapOn:
    id: 'event.edit.replyBy.close'
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    direction: UP
    element:
      text: 'Next up.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: hero-after-sooner
- scrollUntilVisible:
    element:
      text: 'Reply by.*'
- tapOn:
    text: 'Reply by.*'
- tapOn:
    id: 'event.edit.replyBy.date'
- tapOn: '10'
- tapOn: 'OK'
- tapOn: 'Save'
- tapOn:
    id: 'event.edit.replyBy.close'
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    direction: UP
    element:
      text: 'Next up.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: hero-after-now
