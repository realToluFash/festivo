# sc-83008: leaves an event opened from Notifications on screen, for its ‹ at a text size.
# Needs: a notification in Adire Studio's bell for the event "Ada and Tunde wedding", whose place is /app/events/<id>.
appId: host.exp.Exponent
---
- runFlow: sc83008-to-adire.yaml
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible: 'Notifica.*'
    timeout: 60000
- tapOn: 'Notifica.*'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: '.*Ada and Tunde wedding.*'
    timeout: 20000
- tapOn: '.*Ada and Tunde wedding.*'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: held
