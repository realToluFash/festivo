# Find your time zone open, "Atlantis" typed, nothing picked, keys still up on the field. sc-18587.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'timeZone.change'
    timeout: 30000
- tapOn:
    id: 'timeZone.change'
- tapOn:
    id: 'timeZone.search'
- inputText: 'Atlantis'
- takeScreenshot: time-zone-atlantis-typed
