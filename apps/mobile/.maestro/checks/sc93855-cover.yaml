# sc-93855: on the phone, Today's live cover at the top, then scrolled to Open the event. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 7000, optional: true }
- runFlow: ../developer-menu-close.yaml
- tapOn: { text: 'Today|Aujourd.hui', index: 0, optional: true }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- swipe: { start: '50%, 30%', end: '50%, 85%', duration: 600 }
- waitForAnimationToEnd
- takeScreenshot: top
- scrollUntilVisible:
    {
      element: { text: 'Ouvrir l.événement|Open the event' },
      direction: DOWN,
      timeout: 15000,
      optional: true,
    }
- waitForAnimationToEnd
- takeScreenshot: open
