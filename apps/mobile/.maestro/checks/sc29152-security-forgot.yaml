# sc-29152: the design demo's Settings in B Confetti, /security?state=forgot. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/security?state=forgot
- extendedWaitUntil:
    visible: '.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: security-forgot
- scroll
- waitForAnimationToEnd
- takeScreenshot: security-forgot-scrolled
