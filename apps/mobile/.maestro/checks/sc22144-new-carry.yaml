# sc-22144 on Android: New event; before an end is chosen the end date follows the start date; with an end set a day after the start, moving the start a day later moves the end a day later too; back asks Leave without saving?
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.new'
    timeout: 30000
- tapOn:
    id: 'events.new'
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'eventForm.start.date'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'eventForm.start.date'
- waitForAnimationToEnd
- swipe:
    start: 23%, 47%
    end: 23%, 39%
    duration: 1500
- waitForAnimationToEnd
- tapOn: 'OK'
- tapOn:
    id: 'eventForm.start.time'
- tapOn: 'OK'
- waitForAnimationToEnd
- takeScreenshot: start-only
- tapOn:
    id: 'eventForm.end.date'
- waitForAnimationToEnd
- swipe:
    start: 23%, 47%
    end: 23%, 39%
    duration: 1500
- waitForAnimationToEnd
- tapOn: 'OK'
- tapOn:
    id: 'eventForm.end.time'
- tapOn: 'OK'
- waitForAnimationToEnd
- takeScreenshot: end-set
- tapOn:
    id: 'eventForm.start.date'
- waitForAnimationToEnd
- swipe:
    start: 23%, 47%
    end: 23%, 39%
    duration: 1500
- waitForAnimationToEnd
- tapOn: 'OK'
- waitForAnimationToEnd
- takeScreenshot: start-moved
- back
- waitForAnimationToEnd
- assertVisible:
    id: 'eventForm.leave.keep'
- takeScreenshot: leave-asked
