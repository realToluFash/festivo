# sc-13023: the member page named by ${DOMAIN_ID} carries membersScreen.beyondGrant, and no Restore beside it.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible: '{{t:membersScreen.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: members.row.${DOMAIN_ID}
    timeout: 20000
- tapOn:
    id: members.row.${DOMAIN_ID}
- scrollUntilVisible:
    element: '{{t:membersScreen.beyondGrant}}'
    timeout: 20000
- assertNotVisible:
    id: members.restore
- takeScreenshot: member-beyond-grant-domain
