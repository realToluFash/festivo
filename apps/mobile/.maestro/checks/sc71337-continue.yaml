# sc-71337: the last event from outside revoked, its not-found offers Continue.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runScript: { file: sc71337-owner.js, env: { MODE: grant } }
- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil: { visible: { id: never.there }, timeout: 6000, optional: true }
- runScript: { file: sc71337-owner.js, env: { MODE: revoke } }
- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil: { visible: { id: outside.notFound }, timeout: 15000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: continue
