# sc-39471: the Calendar's Subscribe panel, for subscribeLoading and subscribeUnreadable beside the demo.
appId: host.exp.Exponent
---
- stopApp
- openLink: ${METRO_URL}/--/calendar
- waitForAnimationToEnd:
    timeout: 15000
- runFlow: ../developer-menu-close.yaml
- openLink: ${METRO_URL}/--/calendar
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: calendarFeed.open
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${TAG}-subscribe-early
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${TAG}-subscribe
