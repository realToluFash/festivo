# sc-68438: a member, inside an outside event, opens a Your events row revoked while More is open: not available, Back to Events.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil: { visible: { id: never.there }, timeout: 6000, optional: true }
- waitForAnimationToEnd
- tapOn: { id: event.nav.more }
- extendedWaitUntil: { visible: { id: never.there }, timeout: 6000, optional: true }
- waitForAnimationToEnd
- runScript: sc68438-revoke.js
- repeat:
    while: { notVisible: { id: 'event.nav.more.events.${TO}' } }
    times: 4
    commands:
      - swipe: { start: '50%, 85%', end: '50%, 35%', duration: 600 }
- takeScreenshot: more-scrolled
- tapOn: { id: 'event.nav.more.events.${TO}' }
- extendedWaitUntil: { visible: { id: never.there }, timeout: 6000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: gone
- tapOn: { text: '(Back to|Continue).*' }
- extendedWaitUntil: { visible: { id: never.there }, timeout: 6000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: back
