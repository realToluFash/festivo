# sc-27213: Name: Change, tap Full name, then Cancel at once: the step closes. Five times in a row. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- scrollUntilVisible:
    element:
      id: 'nameCard.change'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'nameCard.change'
      - extendedWaitUntil:
          visible:
            id: 'nameCard.field'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: 'nameCard.field'
          waitToSettleTimeoutMs: 0
          retryTapIfNoChange: false
      - tapOn:
          id: 'nameCard.cancel'
          waitToSettleTimeoutMs: 0
      - takeScreenshot: after-cancel
      - extendedWaitUntil:
          visible:
            id: 'nameCard.change'
          timeout: 5000
      - assertNotVisible:
          id: 'nameCard.save'
- takeScreenshot: closed
