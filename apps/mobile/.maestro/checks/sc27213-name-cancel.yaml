# sc-27213: Name: the Name row, tap Full name, then Cancel at once: Name closes back to Your account. Five times in a row. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- scrollUntilVisible:
    element:
      id: 'account.name'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'account.name'
      - extendedWaitUntil:
          visible:
            id: 'account.name.field'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: 'account.name.field'
          waitToSettleTimeoutMs: 0
          retryTapIfNoChange: false
      - tapOn:
          id: 'account.name.cancel'
          waitToSettleTimeoutMs: 0
      - takeScreenshot: after-cancel
      - extendedWaitUntil:
          visible:
            id: 'account.name'
          timeout: 5000
      - assertNotVisible:
          id: 'account.name.save'
      - assertNotVisible:
          id: 'account.name.screen'
- takeScreenshot: closed
