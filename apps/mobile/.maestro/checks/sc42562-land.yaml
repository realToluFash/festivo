# sc-42562: on a tablet at ${ORIENT}, Set a new password lands with Password changed showing; screenshots at landing, keys down, then after 10 seconds. Pass METRO_URL, ORIENT and TOKEN: a reset token for an account owing a step lands on the step; one for an account owing nothing lands on Home.
appId: host.exp.Exponent
---
- runFlow: ../batch/sign-out.yaml
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN}
- extendedWaitUntil: { visible: { id: 'recovery.password' }, timeout: 30000 }
- tapOn: { id: 'recovery.password' }
- inputText: 'a-brand-new-password-42562'
- hideKeyboard
- tapOn: { id: 'recovery.save' }
- extendedWaitUntil: { visible: '{{t:any:recovery.changed}}', timeout: 30000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: land-01-landed
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 4000, optional: true }
- assertVisible: '{{t:any:recovery.changed}}'
- takeScreenshot: land-02-still-there
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 8000, optional: true }
- assertNotVisible: '{{t:any:recovery.changed}}'
- takeScreenshot: land-03-after-10s
