# sc-34925: Settings' account card is read as "Your account. name, email[, role of organisation]" in the shown language.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- assertVisible:
    id: 'settings.account'
    text: '(Your account|Su cuenta|Votre compte|A sua conta)\. QA Tester, qa-[0-9]+@soirely\.test${TAIL}'
- takeScreenshot: account-label
