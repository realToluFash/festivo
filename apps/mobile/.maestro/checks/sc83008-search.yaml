# sc-83008: an event row opened from Search: ‹ Search, back to Search with the term still typed.
# Needs: Adire Studio holding Ibadan Supper.
appId: host.exp.Exponent
---
- runFlow: sc83008-to-adire.yaml
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'today.search'
    timeout: 30000
- tapOn:
    id: 'today.search'
- waitForAnimationToEnd
- inputText: 'Ibadan'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: '.*Ibadan Supper.*'
    timeout: 15000
- takeScreenshot: search
- tapOn: '.*Ibadan Supper.*'
- extendedWaitUntil:
    visible:
      id: 'frame.back'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: event
- assertVisible:
    id: 'frame.back'
    text: '.*Search.*|.*Buscar.*'
- tapOn:
    id: 'frame.back'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'events.page'
- assertVisible: '.*Ibadan.*'
- takeScreenshot: back
