# sc-48600: /events/${EVENT_ID}/edit?at=name, a change saved, closes onto the event's page showing the new name and that it was saved. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=name
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.field'
    timeout: 30000
- tapOn:
    id: 'event.edit.name.field'
- inputText: ' Linked'
- hideKeyboard
- takeScreenshot: at-name-changed
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 3000, optional: true }
- takeScreenshot: at-name-after-save
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 15000
