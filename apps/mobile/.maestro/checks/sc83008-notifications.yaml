# sc-83008: an event opened from a notification in the bell: ‹ Notifications, back to Notifications.
# Needs: a notification in Adire Studio's bell for the event "Ada and Tunde wedding", whose place is /app/events/<id>.
appId: host.exp.Exponent
---
- runFlow: sc83008-to-adire.yaml
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible: 'Notifica.*'
    timeout: 30000
- tapOn: 'Notifica.*'
- waitForAnimationToEnd
- takeScreenshot: bell
- tapOn: '.*Ada and Tunde wedding.*'
- extendedWaitUntil:
    visible:
      id: 'frame.back'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: event
- assertVisible:
    id: 'frame.back'
    text: '.*Notifications.*|.*Notificaciones.*'
- tapOn:
    id: 'frame.back'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'events.page'
- takeScreenshot: back
