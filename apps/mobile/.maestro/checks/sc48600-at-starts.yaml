# sc-48600: /events/${EVENT_ID}/edit?at=starts opens the event's page with the dates edit open, never the ShellContext Render Error. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=starts
- extendedWaitUntil:
    visible:
      id: 'event.edit.dates.save'
    timeout: 30000
- assertNotVisible: '.*ShellContext.*'
- takeScreenshot: at-starts
- tapOn:
    id: 'event.edit.dates.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: at-starts-closed
