# sc-28122: Change password, tap new password, keys up: Save new password and Cancel above the keys; Cancel with keys up closes to Security with Password showing, past the ask that discards what was typed, five in five. Show tapped on both first, as iOS hides a secure field's keys from screenshots. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'security.password'
      - waitForAnimationToEnd:
          timeout: 3000
      - scrollUntilVisible:
          element:
            id: 'security.change.new'
          direction: UP
          timeout: 10000
      - tapOn:
          id: 'security.change.current.reveal'
      - tapOn:
          id: 'security.change.new.reveal'
      - waitForAnimationToEnd:
          timeout: 1000
      - tapOn:
          id: 'security.change.new'
      - inputText: 'shown'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: pw-new-keys-up
      - tapOn:
          id: 'security.change.cancel'
          waitToSettleTimeoutMs: 0
          retryTapIfNoChange: false
      # Typed text makes Cancel ask before it discards it; the ask showing is the tap landing.
      - extendedWaitUntil:
          visible:
            id: 'security.change.discard.discard'
          timeout: 5000
      - tapOn:
          id: 'security.change.discard.discard'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: pw-new-after-cancel
      - assertNotVisible:
          id: 'security.change.cancel'
      - assertVisible:
          id: 'security.password'
