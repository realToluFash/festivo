# sc-44949: the app's design demo, Your account ?state=undeliverable, scrolled to its delivery lines.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/account?state=undeliverable
- extendedWaitUntil:
    visible:
      id: 'demo.account.name'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '.*deliver email to.*'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: demo
