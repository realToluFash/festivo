# sc-3914 retest: Choose who gets it for ${VARIANT}: unticks ${P1} and ${P2} on a course that asks nothing, shoots "Goes back to …", saves, and shoots the Confirmed line under the header.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=menu
- extendedWaitUntil:
    visible:
      id: 'menu.header'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'menu.who.${VARIANT}'
    centerElement: true
- tapOn:
    id: 'menu.who.${VARIANT}'
- extendedWaitUntil:
    visible:
      id: 'menu.who.save'
    timeout: 10000
- tapOn:
    id: 'menu.who.tick.${P1}'
- takeScreenshot: untick-1
- swipe:
    start: 50%, 70%
    end: 50%, 30%
- swipe:
    start: 50%, 70%
    end: 50%, 30%
- tapOn:
    id: 'menu.who.tick.${P2}'
- takeScreenshot: untick-2
- tapOn:
    id: 'menu.who.save'
- waitForAnimationToEnd
- takeScreenshot: saved-where
- scrollUntilVisible:
    element:
      id: 'menu.header'
    direction: UP
- takeScreenshot: saved-top
