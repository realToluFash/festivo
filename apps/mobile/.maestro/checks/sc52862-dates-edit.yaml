# sc-52862 regression, upright: ${EVENT_ID}'s Dates row still opens its edit. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'events.details.dates'
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.details.dates'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: open
