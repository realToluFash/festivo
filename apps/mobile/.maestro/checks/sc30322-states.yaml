# sc-30322: every ?switcher= state from each opener, one screenshot each.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/events?switcher=populated
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: events-populated
- openLink: ${METRO_URL}/--/demo/today?switcher=populated
- extendedWaitUntil:
