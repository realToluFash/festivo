# Android only. sc-25667: before Create organisation is pressed, Cancel leaves the walk with a name typed (by its Discard), and Android back on the first step does the same, nothing created either way.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'Before Cancel'
- assertVisible:
    id: 'createWalk.cancel'
    enabled: true
- tapOn:
    id: 'createWalk.cancel'
- tapOn:
    id: 'createWalk.discard'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'Before Back'
- hideKeyboard
- waitForAnimationToEnd
- back
- tapOn:
    id: 'createWalk.discard'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible: '.*Before (Cancel|Back).*'
- takeScreenshot: before-switcher
