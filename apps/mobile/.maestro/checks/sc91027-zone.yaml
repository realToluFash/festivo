# Android phone. sc-91027: Time zone opens with the keys up and takes typing at once, with no tap on the field: on the first opening, after a clean Cancel, and after Discard. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- scrollUntilVisible:
    element:
      id: 'account.zone'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'account.zone'
- extendedWaitUntil:
    visible:
      id: 'account.zone.field'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- inputText: 'Lagos'
- takeScreenshot: open1-typed
- assertVisible:
    id: 'account.zone.field'
    text: '.*Lagos.*'
- runFlow:
    file: sc91027/close.yaml
    env:
      SHOT: open1
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: 'account.zone'
- extendedWaitUntil:
    visible:
      id: 'account.zone.field'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: open2-untyped
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 4000
- assertNotVisible:
    id: 'account.zone.field'
- tapOn:
    id: 'account.zone'
- extendedWaitUntil:
    visible:
      id: 'account.zone.field'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- inputText: 'Lagos'
- takeScreenshot: open3-typed
- assertVisible:
    id: 'account.zone.field'
    text: '.*Lagos.*'
- runFlow:
    file: sc91027/close.yaml
    env:
      SHOT: open3
- tapOn:
    id: 'account.zone'
- extendedWaitUntil:
    visible:
      id: 'account.zone.field'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- inputText: 'Lagos'
- takeScreenshot: open4-after-discard-typed
- assertVisible:
    id: 'account.zone.field'
    text: '.*Lagos.*'
- runFlow:
    file: sc91027/close.yaml
    env:
      SHOT: open4
