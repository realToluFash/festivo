# sc-50095, tablet landscape: sc50095-part-edit-words turned on its side, then back upright.
appId: host.exp.Exponent
---
# Android's LANDSCAPE_LEFT can leave the tablet portrait: the harness turns it. sc-50565.
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: sc50095-part-edit-words.yaml
- setOrientation: PORTRAIT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /portrait
