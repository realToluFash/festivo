# sc-40584, Android phone on its side: a blank name refused by Gboard's action key, then one scroll down shows the reason under the red field, keys still up. Turns back upright at the end.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- tapOn: { point: '93%,83%' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: side-refused
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: side-refused-scrolled
- hideKeyboard: { optional: true }
- tapOn: { id: 'createWalk.cancel', optional: true }
- setOrientation: PORTRAIT
