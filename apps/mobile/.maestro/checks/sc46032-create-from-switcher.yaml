# sc-46032 regression (sc-30412): the switcher's Create an organisation lands on the new organisation's Today with Now working in ‹name›.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'frame.home'
    optional: true
- tapOn:
    id: 'frame.organisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: 'switcher.tile.create'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'switcher.tile.create'
- extendedWaitUntil:
    visible:
      id: 'createWalk.name'
    timeout: 10000
- tapOn:
    id: 'createWalk.name'
- inputText: Delta
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'createWalk.search'
    timeout: 5000
- tapOn:
    id: 'createWalk.search'
- inputText: Nig
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: 'createWalk.country.NG'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'createWalk.country.NG'
- tapOn:
    id: 'createWalk.primary'
- extendedWaitUntil:
    visible: '.*Africa/Lagos.*'
    timeout: 5000
- tapOn:
    id: 'createWalk.primary'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 15000
- extendedWaitUntil:
    visible: '{{t:switcher.switched}}'
    timeout: 20000
- assertVisible: '.*Delta.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: landed
