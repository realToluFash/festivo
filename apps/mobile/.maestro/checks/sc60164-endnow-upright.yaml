# sc-60164: held upright on a tablet, ${EV_END}, a Live event after its start: End now's dialog with its thank-you field, then a 281-character line refused; kept on.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV_END}
- extendedWaitUntil:
    visible:
      id: 'events.phase.happening_now'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.end'
- tapOn:
    id: 'events.end'
- extendedWaitUntil:
    visible:
      id: 'events.endYes'
    timeout: 10000
- takeScreenshot: endnow-sheet
- tapOn:
    id: 'events.endThankYou'
- inputText: 'Thank you all for coming to our anniversary party. Thank you all for coming to our anniversary party. Thank you all for coming to our anniversary party. Thank you all for coming to our anniversary party. Thank you all for coming to our anniversary party. Thank you all for coming !'
- takeScreenshot: endnow-typed
- tapOn:
    id: 'events.endYes'
- takeScreenshot: endnow-over
- tapOn:
    id: 'events.endNo'
