# sc-47208: Your account's undeliverable lines and Change email, in any language, scrolled to the second line.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'account.undeliverable'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: lines
- scroll
- waitForAnimationToEnd
- takeScreenshot: lines-below
