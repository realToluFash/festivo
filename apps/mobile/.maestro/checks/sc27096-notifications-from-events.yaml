# Notifications opened from Events with the bell, the feed loaded, for the offline band to be watched from outside (sc-27096).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: frame.bell
    timeout: 30000
- runFlow: ../developer-menu-close.yaml
- tapOn:
    id: frame.bell
- extendedWaitUntil:
    visible:
      id: notifications.markAllRead
    timeout: 15000
- runFlow:
    when:
      visible:
        id: notifications.pushAsk.notNow
    commands:
      - tapOn:
          id: notifications.pushAsk.notNow
- assertNotVisible:
    id: offline.band
- takeScreenshot: notifications-online
