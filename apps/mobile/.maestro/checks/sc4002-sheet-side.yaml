# sc-4002, on its side: the role sheet of someone from outside lists the three service levels.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/events/01a21572-bae5-7306-a41e-377df526ef2b?area=people
- scrollUntilVisible:
    {
      element: { id: 'people.row.01a21573-cdd5-7bd4-9dd6-35de70a49cad' },
      timeout: 60000,
      centerElement: true,
    }
- tapOn: { id: 'people.row.01a21573-cdd5-7bd4-9dd6-35de70a49cad' }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: outsider-product
