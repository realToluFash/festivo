# sc-29152: the design demo's Settings in B Confetti, /organisation?state=transfer. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/organisation?state=transfer
- extendedWaitUntil:
    visible:
      id: 'demo.organisation.transfer.password'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: org-transfer
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: org-transfer-scrolled
