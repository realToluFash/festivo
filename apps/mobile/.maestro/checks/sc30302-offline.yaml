# sc-30302: Events loaded, then the API stopped (by the helper, after the online screenshot) and a pull to refresh: the search says it needs a connection.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.search'
    timeout: 30000
- takeScreenshot: online
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 800
- extendedWaitUntil:
    visible: 'Search needs a connection.'
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: offline
- tapOn:
    id: 'events.search'
- inputText: 'gala'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: offline-typed
