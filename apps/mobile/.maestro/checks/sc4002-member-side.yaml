# sc-4002, on its side: a member's role sheet offers the four event roles and none of the service levels. Pass EVENT_ID and PERSON_ID, the member whose sheet opens.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=people
- scrollUntilVisible:
    { element: { id: 'people.row.${PERSON_ID}' }, timeout: 60000, centerElement: true }
- tapOn: { id: 'people.row.${PERSON_ID}' }
- extendedWaitUntil: { visible: 'Member of .*', timeout: 15000 }
- waitForAnimationToEnd
- takeScreenshot: member-product
- assertNotVisible: 'Can work the floor'
- assertNotVisible: 'Can run the floor'
