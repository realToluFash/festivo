# sc-29152: the design demo's Settings in B Confetti, /members. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/members
- extendedWaitUntil:
    visible: '.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: members
- scroll
- waitForAnimationToEnd
- takeScreenshot: members-scrolled
