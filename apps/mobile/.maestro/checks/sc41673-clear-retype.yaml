# sc-41673, Android phone on its side: a fresh Create an organisation, Ibadan Supper Club typed, cleared, then a first letter typed again and the rest; pictured cleared, a second after the letter, and whole.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- inputText: 'Ibadan Supper Club'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: c0-typed
- eraseText: 40
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: c1-cleared
- inputText: 'I'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: c2-letter-again
- inputText: 'badan Supper Club'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: c3-whole-again
- tapOn: { id: 'createWalk.cancel', optional: true }
