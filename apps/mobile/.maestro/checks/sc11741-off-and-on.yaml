# sc-11741: Ask to join opened, Requests to join switched off and on again elsewhere, then Ask to join: the dead-link screen. Pass API, TOKEN and ORG.
appId: host.exp.Exponent
---
- evalScript: "${output.link = json(http.request(API + '/api/orgs/' + ORG + '/request-link', {method: 'PUT', headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json', Origin: 'http://127.0.0.1:25173'}, body: '{}'}).body).url.split('/join/')[1]}"
- openLink: ${METRO_URL}/--/join/${output.link}
- extendedWaitUntil:
    visible:
      id: 'requestToJoin.ask'
    timeout: 30000
- evalScript: "${output.off = http.request(API + '/api/orgs/' + ORG + '/request-link', {method: 'DELETE', headers: {Authorization: 'Bearer ' + TOKEN, Origin: 'http://127.0.0.1:25173'}}).status}"
- assertTrue: ${output.off < 300}
- evalScript: "${output.on = http.request(API + '/api/orgs/' + ORG + '/request-link', {method: 'PUT', headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json', Origin: 'http://127.0.0.1:25173'}, body: '{}'}).status}"
- tapOn:
    id: 'requestToJoin.ask'
- extendedWaitUntil:
    visible:
      id: 'requestToJoin.home'
    timeout: 15000
- assertNotVisible:
    id: 'requestToJoin.ask'
- assertNotVisible:
    id: 'requestToJoin.message'
- takeScreenshot: dead-after-tap
