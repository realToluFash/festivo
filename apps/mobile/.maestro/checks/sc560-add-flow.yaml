# sc-560: prove a domain in the app: blank, a public domain, then a new one, then Verify with no record. DOMAIN must be a domain not yet on any organisation's list, or Add stops on domain_taken.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.prove
    timeout: 20000
- tapOn:
    id: emailDomains.prove
- extendedWaitUntil:
    visible:
      id: emailDomains.prove.field
    timeout: 10000
- takeScreenshot: sc560-add
- tapOn:
    id: emailDomains.prove.add
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: sc560-blank
- tapOn:
    id: emailDomains.prove.field
- inputText: gmail.com
- takeScreenshot: sc560-typing-keyboard
- tapOn:
    id: emailDomains.prove.add
- extendedWaitUntil:
    visible:
      text: '(?:You cannot use a public email domain|No puede usar un dominio de correo electrónico público|Vous ne pouvez pas utiliser un domaine de messagerie public|Não pode usar um domínio de e-mail público).*'
    timeout: 10000
- takeScreenshot: sc560-public
- eraseText: 40
- inputText: ${DOMAIN}
- tapOn:
    id: emailDomains.prove.add
- extendedWaitUntil:
    visible:
      id: emailDomains.record.verify
    timeout: 10000
- takeScreenshot: sc560-record
- tapOn:
    id: emailDomains.record.verify
- extendedWaitUntil:
    visible:
      text: '(?:We could not find the record yet|Todavía no hemos encontrado el registro|Nous n’avons pas encore trouvé l’enregistrement|Ainda não encontrámos o registo).*'
    timeout: 10000
- takeScreenshot: sc560-not-found
