# sc-611: Export these entries open, on a tablet. On its side.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.step
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-export-landscape-product
