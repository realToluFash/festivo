# Add domain: gmail.com with the keys hidden, held, refused. Keys never open. sc-9674.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: companyDomains.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- repeat:
    times: 3
    commands:
      - tapOn:
          id: companyDomains.domain
      - eraseText: 80
- inputText: 'gmail.com'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- tapOn:
    point: '2%,45%'
- waitForAnimationToEnd
- takeScreenshot: keys-hidden
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- scrollUntilVisible:
    element:
      id: companyDomains.add
    centerElement: true
- tapOn:
    id: companyDomains.add
- waitForAnimationToEnd
- takeScreenshot: at-tap
- assertNotVisible: '(?i)(shift|delete)'
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd
- takeScreenshot: while-held
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '(?:You cannot use a public email domain|No puede usar un dominio de correo electrónico público|Vous ne pouvez pas utiliser un domaine de messagerie public|Não pode usar um domínio de e-mail público).*'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertNotVisible: '(?i)(shift|delete)'
