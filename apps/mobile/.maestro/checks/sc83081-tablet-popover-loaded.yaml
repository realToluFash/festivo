# sc-83081 on a tablet at its current orientation: the bell's popover opened from Today and loaded, left open for a step outside Maestro (a network or stack change). Needs ${METRO_URL} and BELL (the bell's point).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn: { text: '(Today|Hoy)' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 8000, optional: true }
- waitForAnimationToEnd
- tapOn: { point: '${BELL}' }
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 20000 }
- extendedWaitUntil: { visible: { id: 'notifications\.item\..*' }, timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: loaded
