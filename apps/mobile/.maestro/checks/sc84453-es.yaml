# sc-84453 iPad upright, Spanish: B from the bell over A reads ‹ Evento, spoken "Volver a Evento".
# The signed-in account and the device must already be in Spanish; this flow does not set the language, and it fails in English.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/events/${A}
- extendedWaitUntil:
    visible: 'Lagos Night'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: frame.bell
- extendedWaitUntil:
    visible:
      id: notifications.popover
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: ${NO_B}
- extendedWaitUntil:
    visible:
      id: frame.back
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: 'Ada and Tunde wedding'
- assertVisible:
    id: frame.back
    text: 'Volver a Evento'
- takeScreenshot: b-overview-evento
