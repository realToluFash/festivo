# sc-4015: turns the device ${ORIENT}, opens ${EVENT_ID}'s kitchen station, screenshots the top and two scrolls. Fails if neither the station, its list nor a refusal shows.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/station
- extendedWaitUntil:
    visible:
      id: 'station.title|station.landing|station.refused.*|station.sheet'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: top
- scroll
- waitForAnimationToEnd
- takeScreenshot: scrolled
- scroll
- waitForAnimationToEnd
- takeScreenshot: scrolled2
