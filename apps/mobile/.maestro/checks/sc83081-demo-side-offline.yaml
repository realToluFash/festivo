# sc-83081, the tablet on its side: the app demo's bellOffline popover. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?area=messages&state=bellOffline
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 8000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: bellOffline-demo
