# sc-39534: on a phone, the frame's back from a guest opened from Search returns to Search with its term and matches.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'frame.search'
    timeout: 30000
- tapOn:
    id: 'frame.search'
- extendedWaitUntil:
    visible:
      id: 'search.field'
    timeout: 15000
- inputText: 'okafor'
- extendedWaitUntil:
    visible: 'Annual Gala.*'
    timeout: 15000
- tapOn: 'Annual Gala.*'
- waitForAnimationToEnd
- takeScreenshot: guest
- tapOn:
    id: 'frame.back'
- waitForAnimationToEnd
- takeScreenshot: frame-back
- extendedWaitUntil:
    visible:
      id: 'search.field'
      text: 'okafor'
    timeout: 10000
- assertVisible: 'Annual Gala.*'
