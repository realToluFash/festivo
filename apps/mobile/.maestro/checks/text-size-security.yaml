# security, top to bottom, at whatever text size the simulator is set to. sc-13281.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible: '{{t:security.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-1
- scroll
- takeScreenshot: security-2
- scroll
- takeScreenshot: security-3
- scroll
- takeScreenshot: security-4
