# sc-37903 (scrolls to its row, for the largest sizes): Account's ‹ Settings pill, Name's header, Cancel and Save with one tap, then Back with one tap, at whatever text size the device is set to.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: account-top
- scrollUntilVisible:
    element:
      id: 'account.name'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'account.name'
- extendedWaitUntil:
    visible:
      id: 'account.name.screen'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: name
- tapOn:
    id: 'account.name.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'account.name.screen'
    timeout: 10000
- takeScreenshot: name-cancelled
- tapOn:
    id: 'account.name'
- extendedWaitUntil:
    visible:
      id: 'account.name.field'
    timeout: 15000
- tapOn:
    id: 'account.name.field'
- eraseText: 80
- inputText: 'QA Larger Text'
- tapOn:
    id: 'account.name.save'
- extendedWaitUntil:
    notVisible:
      id: 'account.name.screen'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: name-saved
- tapOn:
    id: 'frame.back'
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 15000
- takeScreenshot: back-settings
