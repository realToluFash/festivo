# sc-22103: on the phone, Events' cards sit two to a row and a card left alone in a row keeps its column: Upcoming, then Drafts. Needs ${METRO_URL} and an account with an odd count in each tab (three upcoming, one draft, say); the width is a screenshot call.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc22103/to-upcoming.yaml
- extendedWaitUntil:
    visible:
      id: 'events.row\..+'
    timeout: 20000
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: phone-upcoming
- swipe:
    start: 50%, 70%
    end: 50%, 35%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: phone-upcoming-more
- scrollUntilVisible:
    element:
      id: 'events.tab.drafts'
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.tab.drafts'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'events.row\..+'
    timeout: 20000
- takeScreenshot: phone-drafts
