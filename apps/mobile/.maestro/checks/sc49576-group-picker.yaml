# sc-49576: ${EVENT_ID}'s Guests, the rows with a group (guestList.withGroup), then ${GUEST_ID}'s Edit, Group: the picker sheet with forWhom under its title and chooseOrType as the field's placeholder, empty and focused.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=guests
- extendedWaitUntil: { visible: { id: 'guests.row.${GUEST_ID}' }, timeout: 30000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: guests-rows
- tapOn: { id: 'guests.row.${GUEST_ID}' }
- extendedWaitUntil: { visible: { id: 'guest.edit' }, timeout: 20000 }
- tapOn: { id: 'guest.edit' }
- extendedWaitUntil: { visible: { id: 'guest.form.group' }, timeout: 15000 }
- scrollUntilVisible:
    { element: { id: 'guest.form.group' }, direction: DOWN, timeout: 10000, optional: true }
- tapOn: { id: 'guest.form.group' }
- extendedWaitUntil: { visible: { id: 'guest.groupPicker.field' }, timeout: 15000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-keys-down
