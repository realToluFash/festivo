# sc-68438: a member's switcher, opened over Today, with Events from outside under their organisations.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: home.switchOrganisation
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: home.switchOrganisation
- extendedWaitUntil:
    visible:
      id: switcher.outside
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: switcher-outside-one-org
- swipe:
    start: '50%, 85%'
    end: '50%, 30%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: switcher-outside-one-org-foot
