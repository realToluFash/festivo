# Name on Account at rest, focused (green edge), then emptied and saved so it errors (red edge). sc-28849.
# A blank save focuses the field (focusChecked), so the wrong state is shot focused only: no wrong-at-rest shot.
# Android only: the unconditional hideKeyboard stops the flow on an iPhone.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'nameCard.change'
    timeout: 30000
- tapOn:
    id: 'nameCard.change'
- hideKeyboard
- takeScreenshot: name-rest
- tapOn:
    id: 'nameCard.field'
- takeScreenshot: name-focused
- eraseText: 80
- tapOn:
    id: 'nameCard.save'
- takeScreenshot: name-wrong-focused
