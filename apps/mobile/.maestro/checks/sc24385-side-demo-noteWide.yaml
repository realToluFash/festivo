# sc-24385, the tablet on its side: the app demo's event page, state noteWide, scrolled to Details' Venue row with the note, for the side-by-side pair.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?state=noteWide
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: top
- scrollUntilVisible:
    element:
      id: 'event.arrivalNote'
    centerElement: true
    timeout: 20000
- takeScreenshot: note
