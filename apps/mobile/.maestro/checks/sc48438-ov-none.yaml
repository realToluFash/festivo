# sc-48438: the Guests card on the Overview of an event with no guests, in the batch language.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- scrollUntilVisible:
    element:
      id: 'overview.guests.open'
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: head
