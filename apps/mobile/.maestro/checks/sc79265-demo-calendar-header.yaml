# sc-79265: every board of the app's design demo /demo/calendar-header, held ${ORIENT}: AX1 and AX5 in en and es without and with Refreshing…, and the default size in en and es.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/calendar-header?size=ax1&lang=en&refreshing=off
- waitForAnimationToEnd: { timeout: 6000 }
- runFlow: ../developer-menu-close.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- takeScreenshot: demo-ax1-en-off
