# sc-85005: suspended from Alpha while it is in use, a pushed Settings screen on a phone draws the pill alone, then ‹ Settings with the bell at that row's end, then the card. Bell opens Notifications, ‹ goes back. ORIENT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /membership?change=join&org=Alpha
- evalScript: ${output.joined = output.helper.id}
- runFlow: ../return-home.yaml
- tapOn:
    id: 'tab-events|frame\.events'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../switch-organisation.yaml
    env:
      ORG: ${output.joined}
- waitForAnimationToEnd:
    timeout: 5000
# Not paused: a pushed Settings screen keeps ‹, its title and the bell on the title's row.
- openLink: ${METRO_URL}/--/settings/members
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: active-members
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /membership?change=pause&org=Alpha
- tapOn:
    id: frame.back
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'frame.home|tab-today'
- extendedWaitUntil:
    visible:
      id: 'accessPaused\..+'
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-today
- tapOn:
    id: 'frame.settings|tab-settings'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-settings
- openLink: ${METRO_URL}/--/settings/members
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-members
- assertVisible:
    id: frame.back
- assertVisible:
    id: frame.bell
- tapOn:
    id: frame.bell
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-members-bell
- tapOn:
    point: '15%,10%'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-members-after-bell
- tapOn:
    id: frame.back
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-members-back
- openLink: ${METRO_URL}/--/settings/organisation
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: paused-organisation
- assertVisible:
    id: frame.back
- assertVisible:
    id: frame.bell
