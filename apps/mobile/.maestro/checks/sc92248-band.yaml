# sc-92248: Today at the device's text size, upright, scrolled until the band shows its title. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- takeScreenshot: today-top
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- waitForAnimationToEnd
- takeScreenshot: band
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- waitForAnimationToEnd
- takeScreenshot: band-lower
