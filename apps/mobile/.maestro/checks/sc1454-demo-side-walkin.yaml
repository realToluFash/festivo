# sc-1454 tablet on its side: the demo's walkIn state, keyboard hidden, and its walkInDuplicate
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/demo/guests/check-in?state=walkIn
- extendedWaitUntil: { visible: { text: 'Check-in|Add walk-in' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 4000 }
- hideKeyboard
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: walkInNoKb-side-demo
- openLink: ${METRO_URL}/--/demo/guests/check-in?state=walkInDuplicate
- extendedWaitUntil: { visible: { text: 'Check-in|Add walk-in' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 4000 }
- hideKeyboard
- takeScreenshot: walkInDuplicate-side-demo
