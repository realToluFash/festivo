# sc-37577: the events screen at ${ORIENT}, its menu shut, for measuring its button.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.filter'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: closed-events
