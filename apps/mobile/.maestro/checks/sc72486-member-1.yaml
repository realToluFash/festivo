# sc-72486: the page of the member ${M1}, for the Also a member of line (1 other organisations). Pass METRO_URL and M1.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.row.${M1}'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'members.row.${M1}'
- waitForAnimationToEnd
- takeScreenshot: sc72486-member-1
