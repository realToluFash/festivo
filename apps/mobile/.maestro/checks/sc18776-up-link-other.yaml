# Android only. sc-18776: EV's All dates by link over another event, OTHER; ‹ Event (BACK) opens EV, not OTHER; system back twice. Pass EV and OTHER (two events' ids), EV_NAME and OTHER_NAME (their names), BACK and ORIENT; BACK is frame.back on a phone, timeline.allDates.back on a tablet.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd
- runFlow: ../return-home.yaml

- openLink: ${METRO_URL}/--/events/${OTHER}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- takeScreenshot: behind
- openLink: ${METRO_URL}/--/events/${EV}/dates
- extendedWaitUntil:
    visible:
      id: 'timeline.row'
    timeout: 30000
- takeScreenshot: dates
- tapOn:
    id: ${BACK}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 20000
- assertVisible:
    text: '${EV_NAME}'
    childOf:
      id: 'events.page'
- assertNotVisible:
    text: '${OTHER_NAME}'
    childOf:
      id: 'events.page'
- assertNotVisible:
    id: 'timeline.allDates.page'

- takeScreenshot: up
- back
- waitForAnimationToEnd
- takeScreenshot: back1
- assertNotVisible:
    id: 'timeline.allDates.page'
- back
- waitForAnimationToEnd
- takeScreenshot: back2
- assertNotVisible:
    id: 'timeline.allDates.page'
