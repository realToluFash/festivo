# sc-3784: a Can view or Can check guests in grant holder sees the Guests header with no Export. ORG is the organisation that holds the event.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runFlow: ../open-switcher.yaml
- scrollUntilVisible:
    element:
      text: ${ORG}
    direction: UP
    timeout: 20000
- tapOn:
    text: ${ORG}
- waitForAnimationToEnd:
    timeout: 4000
- openLink: ${METRO_URL}/--/events/${EV}?area=guests
- extendedWaitUntil:
    visible:
      id: 'guests.search'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: grant
- assertNotVisible:
    id: 'guests.export'
