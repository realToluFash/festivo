# sc-92467, iPhone and iPad: Change password opens with the keys up and takes typing with no tap, first opening only. The short form of sc91027-password.yaml for the iOS pass of this story; that check holds the Cancel and Discard openings. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible:
      id: 'security.password'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.change.current'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: opened
- inputText: 'abcdef'
- tapOn:
    id: 'security.change.current.reveal'
- assertVisible:
    id: 'security.change.current'
    text: '.*abcdef.*'
- takeScreenshot: typed
