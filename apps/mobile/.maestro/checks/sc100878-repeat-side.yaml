# sc-100878 (tablet on its side): Zimbabwe stays in view and picked on Continue from step 1, three times running and after step 3 in between; then Create.
appId: host.exp.Exponent
---
- setOrientation: UPSIDE_DOWN # rotation 2: on its side on a tablet whose natural orientation is landscape (Soirely_QA2_Tablet)
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- tapOn: { id: 'createWalk.name' }
- inputText: 'QA Zimbabwe Side'
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { visible: '{{t:createOrganisation.whereTitle}}', timeout: 10000 }
- tapOn: { id: 'createWalk.search' }
- inputText: 'Zimbab'
- tapOn: { id: 'createWalk.country.ZW' }
- waitForAnimationToEnd
- takeScreenshot: zw-picked
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- takeScreenshot: side-step3
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-back-from-3
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-forward-1
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-forward-2
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-forward-3
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- takeScreenshot: side-step3-again
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-back-from-3-again
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1200, optional: true }
- takeScreenshot: side-forward-after-3
- assertVisible: { id: 'createWalk.country.ZW', selected: true }
- assertVisible: { text: '.*ZWG.*' }
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- takeScreenshot: side-ready
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { notVisible: { id: 'createWalk' }, timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: side-created
