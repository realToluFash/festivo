# The Calendar's Month grid in November 2026, with "+N more" at 1 and many, bars, marks and the day list, in the account's language. Needs an account with sc-36920's seed: busy days on 18 to 20 and 25 to 27 Nov 2026, a multi-day Toast on 27 to 28 Nov, and a Retreat from 30 Nov to 4 Dec with a Gala on 2 Dec.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible:
      id: calendar.view.month
    timeout: 30000
- tapOn:
    id: calendar.view.month
- tapOn:
    id: calendar.today
- extendedWaitUntil:
    visible:
      id: calendar.day.2026-11-18
    timeout: 15000
- takeScreenshot: month-top
- scrollUntilVisible:
    element:
      id: calendar.day.2026-12-02
    direction: DOWN
- takeScreenshot: month-busy
- tapOn:
    id: calendar.day.2026-11-27
- extendedWaitUntil:
    visible:
      id: calendar.dayList
    timeout: 10000
- takeScreenshot: day-list-multi
- tapOn:
    id: calendar.dayList.close
- tapOn:
    id: calendar.day.2026-11-25
- extendedWaitUntil:
    visible:
      id: calendar.dayList
    timeout: 10000
- takeScreenshot: day-list-busy
