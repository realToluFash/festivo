# sc-48600 (settled before each tap, for iOS momentum): on ${EVENT_ID}'s page, each Details and Name and cover row opens its own edit (Cancel, title, Save) and Cancel with nothing changed closes it; never the ShellContext Render Error. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.details.dates'
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'events.details.dates'
- extendedWaitUntil:
    visible:
      id: 'event.edit.dates.save'
    timeout: 20000
- assertNotVisible: '.*ShellContext.*'
- takeScreenshot: row-dates
- tapOn:
    id: 'event.edit.dates.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'events.details.venue'
