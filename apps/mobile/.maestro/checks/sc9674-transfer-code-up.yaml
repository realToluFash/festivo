# Transfer ownership, two-factor on: right password, keys up. The code field appears, keys stay; a tap on it takes them there; a wrong code is refused with keys up. sc-9674.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
    centerElement: true
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: ${PASSWORD}
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: organisation.transfer.send
    centerElement: true
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible:
      id: organisation.transfer.code
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: code-asked
- assertVisible: '(?i)(shift|delete)'
- inputText: q
- tapOn:
    id: organisation.transfer.password.reveal
- assertVisible:
    id: organisation.transfer.password
    text: '${PASSWORD}'
- scrollUntilVisible:
    element:
      id: organisation.transfer.code
    centerElement: true
- tapOn:
    id: organisation.transfer.code
- inputText: '000000'
- waitForAnimationToEnd
- takeScreenshot: code-typed
- assertVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: organisation.transfer.send
    centerElement: true
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible: '(?:That code did not work|Ese código no ha funcionado|Ce code n’a pas fonctionné|Esse código não funcionou).*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: code-refused
- assertVisible: '(?i)(shift|delete)'
