# sc-91291: Expo Go closed, the iPad on its side, then Today opened; top, middle and foot. Vars: METRO_URL.
appId: host.exp.Exponent
---
- stopApp
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 15000, optional: true }
- runFlow: ../developer-menu-close.yaml
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 5000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: launched-top
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- waitForAnimationToEnd
- takeScreenshot: launched-mid
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- waitForAnimationToEnd
- takeScreenshot: launched-foot
