# sc-23283: Remove… on ${ROW} opens its confirm in the row; turning the tablet to ${TURN_TO} keeps it open, and Keep it closes it.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'nameCard.change'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'contacts.${ROW}.remove'
    direction: DOWN
    timeout: 20000
- takeScreenshot: row-buttons
- tapOn:
    id: 'contacts.${ROW}.remove'
- extendedWaitUntil:
    visible:
      id: 'contacts.${ROW}.keep'
    timeout: 10000
- takeScreenshot: remove-confirm
- setOrientation: ${TURN_TO}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'contacts.${ROW}.keep'
    timeout: 10000
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- waitForAnimationToEnd
- takeScreenshot: remove-confirm-turned
- setOrientation: ${TURN_BACK}
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'contacts.${ROW}.keep'
    direction: DOWN
    timeout: 10000
- takeScreenshot: remove-confirm-back
- tapOn:
    id: 'contacts.${ROW}.keep'
- extendedWaitUntil:
    notVisible:
      id: 'contacts.${ROW}.keep'
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'contacts.${ROW}.remove'
    timeout: 10000
