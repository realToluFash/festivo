# Notification settings, its grid of switches, on a tablet in landscape (sc-14815).
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings/notifications
- extendedWaitUntil:
    visible: '{{t:notificationSettings.category.guest_replies}}'
    timeout: 30000
- takeScreenshot: settings-grid-landscape
- setOrientation: PORTRAIT
