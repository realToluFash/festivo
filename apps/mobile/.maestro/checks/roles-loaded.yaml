# Roles, opened by its link, once the list has loaded, with the admin's row in view.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible: '{{t:rolesScreen.title}}'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*{{t:roles.administrator}}.*'
    timeout: 30000
- takeScreenshot: roles-loaded
