# sc-28178: working in Alpha on Calendar, the member is removed while the app is behind the
# home screen; coming back to the front is the move, and it opens ${ORG_NAME} with Now working
# in ‹name›., and the switcher no longer lists Alpha.
appId: host.exp.Exponent
---
- runFlow:
    file: ../checks/sc28178/joined.yaml
    env:
      ORG: Alpha
- extendedWaitUntil:
    notVisible: '{{t:switcher.switched}}'
    timeout: 20000
- tapOn:
    id: 'tab-calendar|frame\.calendar'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: before
- pressKey: Home
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /membership?change=remove&org=Alpha
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /open?path=/--/calendar
- extendedWaitUntil:
    visible: '{{t:switcher.switched}}'
    timeout: 20000
- takeScreenshot: moved-on
- runFlow: ../open-switcher.yaml
- assertNotVisible:
    id: 'switcher.tile.${output.joined}'
- takeScreenshot: switcher
