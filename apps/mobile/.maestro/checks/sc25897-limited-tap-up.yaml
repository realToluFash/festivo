# sc-25897 Android, an account at its limit: keys up, Create organisation tapped. The limit notice comes wholly into view.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createOrganisation.name'
- inputText: 'Notice In View'
- waitForAnimationToEnd
- tapOn:
    id: 'createOrganisation.create'
- extendedWaitUntil:
    visible: '.*{{t:createOrganisation.limitedTitle}}.*'
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: 'sc25897.never'
    timeout: 3000
    optional: true
- takeScreenshot: answered
