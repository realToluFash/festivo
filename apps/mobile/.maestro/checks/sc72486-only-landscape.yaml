# sc-72486: Email domains in landscape, the card and the Only our organisation row, then the Ask. Pass METRO_URL and DOMAIN; the switch starts off.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.card
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc72486-landscape-top
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.only
    direction: DOWN
    timeout: 15000
- tapOn:
    id: emailDomains.${DOMAIN}.only
- extendedWaitUntil:
    visible:
      id: emailDomains.only.schedule
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc72486-landscape-ask
- tapOn:
    id: emailDomains.only.cancel
- setOrientation: PORTRAIT
