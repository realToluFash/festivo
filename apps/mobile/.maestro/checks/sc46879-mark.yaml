# sc-46879: ${BRUNO} (Not yet invited) on the Live event: the sheet, the empty refusal, a WhatsApp mark, then Mark as not invited; beside the demo.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${LIVE}?area=guests
- extendedWaitUntil:
    visible:
      id: 'guests.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: 'guests.search'
- inputText: 'Bruno'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'guests.row.${BRUNO}'
    timeout: 10000
- tapOn:
    id: 'guests.row.${BRUNO}'
- extendedWaitUntil:
    visible:
      id: 'guest.${BRUNO}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: notYetInvited
- scroll
- takeScreenshot: notYetInvited-scrolled
- scrollUntilVisible:
    element:
      id: 'guest.mark'
    direction: DOWN
- tapOn:
    id: 'guest.mark'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: markAsInvited
- tapOn:
    id: 'guest.markSheet.do'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: markRefused
- tapOn:
    id: 'guest.markSheet.whatsapp'
- tapOn:
    id: 'guest.markSheet.do'
- extendedWaitUntil:
    visible:
      id: 'guest.invited'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: marked
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: marked-top
- scrollUntilVisible:
    element:
      id: 'guest.unmark'
    direction: DOWN
- tapOn:
    id: 'guest.unmark'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: unmarked
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: unmarked-top
- openLink: ${METRO_URL}/--/demo/guests?state=notYetInvited
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-notYetInvited
- scroll
- takeScreenshot: demo-notYetInvited-scrolled
- openLink: ${METRO_URL}/--/demo/guests?state=markAsInvited
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-markAsInvited
- openLink: ${METRO_URL}/--/demo/guests?state=markRefused
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-markRefused
- openLink: ${METRO_URL}/--/demo/guests?state=marked
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-marked
- scroll
- takeScreenshot: demo-marked-scrolled
- openLink: ${METRO_URL}/--/demo/guests?state=unmarked
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-unmarked
- scroll
- takeScreenshot: demo-unmarked-scrolled
