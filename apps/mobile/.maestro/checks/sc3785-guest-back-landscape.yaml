# sc-3785 on a tablet on its side (SIDE, LANDSCAPE_LEFT unless the tablet's natural orientation is landscape, then PORTRAIT): ${GUEST_ID}'s details open beside ${EVENT_ID}'s Guests list, with no ‹ Guests, and the list stays in reach.
appId: host.exp.Exponent
env:
  SIDE: LANDSCAPE_LEFT
---
- setOrientation: ${SIDE}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=guests
- extendedWaitUntil:
    visible:
      id: 'guests.row.${GUEST_ID}'
    timeout: 30000
- tapOn:
    id: 'guests.row.${GUEST_ID}'
- extendedWaitUntil:
    visible:
      id: 'guest.${GUEST_ID}'
    timeout: 20000
- assertVisible:
    id: 'guests.search'
- assertNotVisible:
    id: 'frame.back'
    text: '{{t:eventNav.guests}}'
- takeScreenshot: guest-beside
- setOrientation: PORTRAIT
