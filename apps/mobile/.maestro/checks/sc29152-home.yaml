# sc-29152: the design demo's Settings in B Confetti, the list. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings
- extendedWaitUntil:
    visible: '.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: home
- scroll
- waitForAnimationToEnd
- takeScreenshot: home-scrolled
