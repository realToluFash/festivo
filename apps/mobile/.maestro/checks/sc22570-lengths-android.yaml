# sc-22570: Duplicate {event}'s words for four lengths (1 hour, 2 hours, 45 minutes, 2 hours 30 minutes), its refusals, the ends line once a start is chosen, and Draft created.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${E1}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- extendedWaitUntil:
    visible: '{{t:eventDuplicate.copied}}'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 1h-top
- repeat:
    times: 15
    while:
      notVisible:
        id: 'eventDuplicate.create'
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 65%
          duration: 400
- assertVisible:
    id: 'eventDuplicate.create'
- takeScreenshot: 1h-unchosen
- openLink: ${METRO_URL}/--/events/${E2}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
