# sc-563: a member's page in Settings > Members, as an Admin or Owner of the home organisation sees it. Pass PERSON0: the member's name as the list shows it.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      text: '${PERSON0}.*'
    timeout: 30000
- tapOn: '${PERSON0}.*'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: sc563-member0-product
