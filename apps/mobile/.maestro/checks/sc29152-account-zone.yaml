# sc-29152: the design demo's Settings in B Confetti, /account?state=zone. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/account?state=zone
- extendedWaitUntil:
    visible: '.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: account-zone
- scroll
- waitForAnimationToEnd
- takeScreenshot: account-zone-scrolled
