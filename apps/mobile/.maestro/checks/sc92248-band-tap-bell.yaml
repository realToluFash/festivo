# sc-92248: Today scrolled until the band shows its title, upright, then one tap on the band's bell. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'home.switchOrganisation' }, timeout: 15000 }
- runFlow: ../developer-menu-close.yaml
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- swipe: { start: '60%, 80%', end: '60%, 30%', duration: 700 }
- waitForAnimationToEnd
- takeScreenshot: before
- tapOn: { point: '91%, 10%' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: after
