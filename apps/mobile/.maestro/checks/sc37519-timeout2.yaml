# Password changed closes on its own about 10 seconds after it lands; times the close. sc-37519.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN_STEP}
- extendedWaitUntil: { visible: { id: 'recovery.password' }, timeout: 30000 }
- tapOn: { id: 'recovery.password' }
- inputText: 'a-brand-new-password-37519'
- tapOn: { id: 'recovery.save' }
- extendedWaitUntil: { visible: { id: 'completeProfile.organisation' }, timeout: 30000 }
- assertVisible: '{{t:any:recovery.changed}}'
- takeScreenshot: timeout2-01-landed
- extendedWaitUntil: { notVisible: '{{t:any:recovery.changed}}', timeout: 40000 }
- takeScreenshot: timeout2-02-gone
- runFlow: ../sign-out-from-complete-profile.yaml
