# sc-90472 regression: People's list, an outsider's role sheet, and Remove for someone from outside.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=people
- extendedWaitUntil: { visible: '.*{{t:eventPeople.title}}.*', timeout: 30000 }
- scrollUntilVisible:
    { element: { id: 'people.row.${P_OUT}' }, direction: DOWN, timeout: 20000, centerElement: true }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: list
- tapOn: { id: 'people.row.${P_OUT}' }
- extendedWaitUntil: { visible: { id: 'people.role.done' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: role-sheet
- tapOn: { id: 'people.remove' }
- extendedWaitUntil: { visible: { id: 'people.remove.confirm' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: remove-ask
- tapOn: { id: 'people.remove.confirm' }
- extendedWaitUntil: { notVisible: { id: 'people.row.${P_OUT}' }, timeout: 15000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: removed
