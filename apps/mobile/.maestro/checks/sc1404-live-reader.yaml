# sc-1404: a reader's run view picks up an item started elsewhere (the API, as a manager with TOKEN) within 10 s, without a reload.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}/run
- scrollUntilVisible: { element: { text: 'Cake cutting' }, timeout: 20000 }
- takeScreenshot: before
- runScript: ../scripts/sc1404-start-elsewhere.js
- extendedWaitUntil: { visible: { text: 'Started .* · planned 13:00 · 10 min' }, timeout: 30000 }
- takeScreenshot: after
