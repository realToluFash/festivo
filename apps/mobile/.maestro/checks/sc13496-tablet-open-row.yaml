# On a tablet held upright, the Settings list beside the page keeps the row just opened in view, at whatever text size the simulator is set to. sc-13496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 18%, 85%
    end: 18%, 45%
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: open-row-before
- tapOn:
    id: 'settings.signInRules'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: open-row-after
- assertVisible:
    id: 'settings.signInRules'
