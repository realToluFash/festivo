# sc-46032: a pick in the switcher opened from the pill on calendar shows Now working in Beta. there, once; the next screen does not carry it.
appId: host.exp.Exponent
---
- runFlow:
    file: ../checks/sc46032/pick.yaml
    env:
      FROM: frame.calendar
- extendedWaitUntil:
    visible: '{{t:switcher.switched}}'
    timeout: 20000
- assertVisible: '.*Beta.*'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: calendar-picked
- tapOn:
    id: 'frame.settings'
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: '{{t:switcher.switched}}'
- takeScreenshot: calendar-next-screen
