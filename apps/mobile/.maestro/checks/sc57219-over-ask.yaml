# sc-57219: 501 letters, keys up, tap Ask to join; the refusal shows above the button and the keys. TOKEN.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/join/${TOKEN}
- extendedWaitUntil:
    visible:
      id: requestToJoin.message
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: requestToJoin.message
- inputText: ''
- waitForAnimationToEnd
- takeScreenshot: over-keys-up
- tapOn:
    id: requestToJoin.ask
- extendedWaitUntil:
    visible: '.*(?:Keep your message to 500|Raccourcissez votre message|Encurte a mensagem|Acorte su mensaje).*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: over-asked
- assertVisible: '(?i)(shift|delete|supprimer|maj)'
