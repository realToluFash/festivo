# sc-80863: in A, A's own event's link opens as today with no notice. Pass OWN.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 20000
- tapOn:
    id: 'home.switchOrganisation'
- tapOn:
    text: '.*Adire Studio.*'
    index: 0
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events/${OWN}
- extendedWaitUntil:
    visible: '.*Adire Open House.*'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: same
