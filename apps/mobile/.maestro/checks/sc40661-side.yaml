# sc-40661: on its side, zzz shows the no-match line in the country panel, beside the demo's nothing-matches state; then upright.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../sc40661-to-country-search.yaml
- eraseText: 80
- inputText: 'zzz'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: s40661-side-zzz-keys
- assertVisible: { id: 'createWalk.countries.noMatch' }
- openLink: ${METRO_URL}/--/demo/today?create=country-nomatch
- extendedWaitUntil: { visible: { id: 'createWalk.search' }, timeout: 20000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- takeScreenshot: s40661-side-demo
- assertVisible: { id: 'createWalk.countries.noMatch' }
- setOrientation: PORTRAIT
