# sc-48600 keyboard bullet: the Arrival note over 500 characters, Save, keyboard up; then the keyboard put away, the message in view. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'event.edit.venue.note'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'event.edit.venue.note'
- inputRandomText:
    length: 505
- takeScreenshot: note-typing
- tapOn:
    id: 'event.edit.venue.save'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: note-saved-keyboard-up
- tapOn:
    id: 'event.edit.venue.name'
- tapOn: 'Venue name.*|Nom du lieu.*'
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Shorten the arrival note.*|.*500.*'
    direction: DOWN
    timeout: 8000
    optional: true
- takeScreenshot: note-keyboard-away
- tapOn:
    id: 'event.edit.venue.cancel'
- tapOn:
    id: 'event.edit.venue.discard'
