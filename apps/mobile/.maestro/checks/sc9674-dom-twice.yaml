# Add domain: soirely.test, held, Add domain tapped twice and return pressed. One domain added, the field emptied, and the domain removed again so the check reruns. sc-9674.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.domain.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- tapOn:
    id: organisation.domain.add
- extendedWaitUntil:
    visible:
      id: organisation.domain.field
    timeout: 10000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: organisation.domain.field
      - eraseText: 80
- inputText: 'soirely.test'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- scrollUntilVisible:
    element:
      id: organisation.domain.send
    centerElement: true
- tapOn:
    id: organisation.domain.send
- tapOn:
    id: organisation.domain.send
- pressKey: Enter
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '{{t:companyDomains.addedLine}}'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: added
- assertNotVisible: '.*{{t:companyDomains.failed}}.*'
- assertNotVisible: '.*(?:is already on the list|ya está en la lista|figure déjà dans la liste|já está na lista).*'
- assertNotVisible:
    id: organisation.domain.field
    text: 'soirely.test'
- scrollUntilVisible:
    element:
      id: organisation.domain.soirely.test.remove
    direction: UP
    centerElement: true
- tapOn:
    id: organisation.domain.soirely.test.remove
- tapOn:
    id: organisation.domain.confirm
- extendedWaitUntil:
    visible: '{{t:companyDomains.removed}}'
    timeout: 30000
