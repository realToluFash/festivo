appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible: 'Month'
    timeout: 30000
- tapOn: 'Month'
- extendedWaitUntil:
    visible:
      id: 'calendar.day.2026-11-25'
    timeout: 30000
- tapOn:
    id: 'calendar.day.2026-11-25'
- extendedWaitUntil:
    visible:
      id: 'calendar.daySheet'
    timeout: 15000
- waitForAnimationToEnd
