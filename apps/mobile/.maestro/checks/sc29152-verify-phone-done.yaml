# sc-29152: the design demo's Settings in B Confetti, /account?state=verifyPhoneDone. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/account?state=verifyPhoneDone
- extendedWaitUntil:
    visible:
      text: 'Number verified'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: verify-phone-done
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: verify-phone-done-scrolled
