# sc-22103: Edit details from the Venue row, what navigation shows over it, then Back (Cancel on a tablet) to the page and Back to Events. Needs ${METRO_URL}, ${LIVE}.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc22103/to-upcoming.yaml
- scrollUntilVisible:
    element:
      id: 'events.row.${LIVE}'
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.row.${LIVE}'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- takeScreenshot: page
- scrollUntilVisible:
    element:
      id: 'events.details.venue'
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.details.venue'
- waitForAnimationToEnd
- takeScreenshot: edit
- runFlow:
    when:
      visible:
        id: 'frame.back'
    commands:
      - tapOn:
          id: 'frame.back'
- runFlow:
    when:
      notVisible:
        id: 'frame.back'
    commands:
      - scrollUntilVisible:
          element:
            id: 'eventForm.cancel'
          direction: UP
      - tapOn:
          id: 'eventForm.cancel'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 15000
- takeScreenshot: back-page
- tapOn:
    id: 'frame.back'
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'events.page'
    timeout: 15000
- takeScreenshot: landed
- scrollUntilVisible:
    element:
      id: 'events.row.${LIVE}'
    centerElement: true
    timeout: 20000
- takeScreenshot: back-events
