# sc-22145: on a tablet, Duplicate {event}'s Cancel returns to the original's page, and the copy's ‹ Event control does too.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- extendedWaitUntil:
    visible:
      id: 'eventForm.cancel'
    timeout: 15000
- tapOn:
    id: 'eventForm.cancel'
- waitForAnimationToEnd
- takeScreenshot: after-cancel
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- scrollUntilVisible:
    element:
      id: 'eventDuplicate.create'
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'eventDuplicate.start.time'
      - tapOn: 'OK'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'eventDuplicate.start.date'
      - waitForAnimationToEnd
      - tapOn:
          id: 'eventDuplicate.start.done'
      - waitForAnimationToEnd
      - tapOn:
          id: 'eventDuplicate.start.time'
      - waitForAnimationToEnd
      - tapOn:
          id: 'eventDuplicate.start.done'
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: 'eventDuplicate.create'
          timeout: 15000
      - swipe:
          start: 50%, 80%
          end: 50%, 15%
          duration: 600
      - swipe:
          start: 50%, 80%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd
- tapOn:
    id: 'eventDuplicate.create'
- extendedWaitUntil:
    notVisible:
      id: 'eventDuplicate.create'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: copy-page
- tapOn:
    id: 'events.back'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: after-event-control
