# sc-75471: the demo settings?as=noOrg&from=none, from its top, for the side-by-side pair.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/demo/settings?as=noOrg&from=none
- extendedWaitUntil: { visible: { id: never.there }, timeout: 3000, optional: true }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: never.there }, timeout: 5000, optional: true }
- takeScreenshot: demo-settings
