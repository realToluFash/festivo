# sc-54450: Paste a reply pressed many times on ${EVENT_ID}'s Guests; each press that opens Whose reply is this? is shot as hit-N, each that does not as miss-N. Presses 1-6 keep the clipboard, 7-10 set a new message first.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=guests
- extendedWaitUntil:
    visible:
      id: 'guests.paste'
    timeout: 30000
- tapOn:
    id: 'guests.paste'
- extendedWaitUntil:
    visible:
      id: 'paste.whose'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'paste.whose'
    commands:
      - takeScreenshot: miss-1
- runFlow:
    when:
      visible:
        id: 'paste.whose'
    commands:
      - takeScreenshot: hit-1
      - tapOn:
          id: 'frame.back'
      - extendedWaitUntil:
          visible:
            id: 'guests.paste'
          timeout: 10000
