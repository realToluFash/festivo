# sc-32801: E2's Needs you rows, each one element read "{{title}}, {{due}}" with "overdue" among its words, not a button; and the card while the API is held (Loading the dates…). Needs ${METRO_URL}, ${E2}.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/events/${E2}
- extendedWaitUntil:
    visible:
      text: 'QA2 Overdue'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'event.needsYou.row'
    direction: DOWN
    visibilityPercentage: 100
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: rows
- assertVisible:
    id: 'event.needsYou.row'
    text: '.+, (\d+ days? overdue|1 day overdue|Overdue)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- openLink: ${METRO_URL}/--/events/${E2}
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 8000, optional: true }
- takeScreenshot: held
- scrollUntilVisible:
    element:
      id: 'event.needsYou.loading'
    direction: DOWN
    timeout: 15000
    optional: true
- takeScreenshot: held-card
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
