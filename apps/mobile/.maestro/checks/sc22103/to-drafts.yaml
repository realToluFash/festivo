# Events from the app's tab bar, with drafts chosen.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'frame.events'
    timeout: 30000
- tapOn:
    id: 'frame.events'
- extendedWaitUntil:
    visible:
      id: 'events.summary'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.tab.drafts'
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.tab.drafts'
- waitForAnimationToEnd
