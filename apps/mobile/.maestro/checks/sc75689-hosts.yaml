# sc-75689: ${EVENT_ID}, which starts with no hosts: its hosts part opened as Can edit, then taken off the event: Save says the event is no longer available, no Try again, what was changed stays, and a second Save says the same.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: add
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.details.hosts'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'events.details.hosts'
- extendedWaitUntil:
    visible: 'Add a host'
    timeout: 20000
- tapOn: 'Add a host'
- waitForAnimationToEnd
- tapOn: 'Host 1'
- inputText: 'Ada Host'
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: remove
- tapOn:
    id: 'event.edit.hosts.save'
- extendedWaitUntil:
    visible: '{{t:eventEdit.eventGone}}'
    timeout: 15000
- assertNotVisible: '{{t:eventEdit.notSaved}}'
- takeScreenshot: forbidden
- tapOn:
    id: 'event.edit.hosts.save'
- extendedWaitUntil:
    visible: '{{t:eventEdit.eventGone}}'
    timeout: 15000
- assertNotVisible: '{{t:eventEdit.notSaved}}'
- takeScreenshot: forbidden-again
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: add
