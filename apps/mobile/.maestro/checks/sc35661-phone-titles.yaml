# sc-35661: the Add a phone number sheet's title, then the Verify sheet's (verifyPhone.title), each screenshotted in the header. The check adds one unverified number, opens Verify from that number's own row, and removes it before it ends, so it re-runs on one account and next to the email check.
appId: host.exp.Exponent
onFlowComplete:
  - runFlow:
      when:
        true: ${output.removed != true}
      commands:
        - runFlow:
            when:
              visible:
                id: 'account.verify.cancel'
            commands:
              - tapOn:
                  id: 'account.verify.cancel'
              - waitForAnimationToEnd
        - runFlow:
            when:
              visible:
                id: 'account.phone.add.cancel'
            commands:
              - tapOn:
                  id: 'account.phone.add.cancel'
              - waitForAnimationToEnd
        - runFlow:
            when:
              visible:
                id: 'account.phone.add.discard'
            commands:
              - tapOn:
                  id: 'account.phone.add.discard'
              - waitForAnimationToEnd
        - openLink: ${METRO_URL}/--/settings/account
        - extendedWaitUntil:
            visible: '{{t:account.title}}'
            timeout: 30000
            optional: true
        - scrollUntilVisible:
            element:
              text: ${output.row}
            timeout: 15000
            centerElement: true
            optional: true
        - waitForAnimationToEnd
        - runFlow:
            when:
              visible: ${output.row}
            commands:
              - tapOn: ${output.row}
              - runFlow:
                  file: ../scroll-tap.yaml
                  env:
                    ID: 'account\..+\.remove'
---
- evalScript: '${output.removed = false}'
- evalScript: '${output.tail = String(Date.now()).slice(-6)}'
- evalScript: "${output.row = '.*' + output.tail.split('').join(' ?') + '.*'}"
- evalScript: "${output.title = '.*' + output.tail.split('').join(' ?')}"
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: 'account.phone.add'
- extendedWaitUntil:
    visible:
      id: 'account.phone.add.number'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: add-phone-sheet
- assertVisible: '{{t:contacts.addPhone}}'
- tapOn:
    id: 'account.phone.add.number'
- inputText: '7400${output.tail}'
- tapOn:
    id: 'account.phone.add.submit'
- scrollUntilVisible:
    element:
      text: ${output.row}
    timeout: 15000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: ${output.row}
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: 'account\..+\.send'
- extendedWaitUntil:
    visible:
      id: 'account.verify.code'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: verify-phone-sheet
- assertVisible: '{{t:verifyPhone.title}}'
- tapOn:
    id: 'account.verify.cancel'
- waitForAnimationToEnd
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: 'account\..+\.remove'
- extendedWaitUntil:
    notVisible: '${output.title}(\. .*)?'
    timeout: 15000
- evalScript: '${output.removed = true}'
