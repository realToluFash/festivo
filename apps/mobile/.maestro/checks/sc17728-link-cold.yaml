# sc-17728: ${EV}'s All dates as the first screen after a cold launch by link, nothing behind it: ‹ Event opens the event's page. Pass ORIENT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd:
    timeout: 5000
- stopApp
- openLink: ${METRO_URL}/--/events/${EV}/dates
- extendedWaitUntil:
    visible:
      id: 'timeline.row'
    timeout: 60000
- takeScreenshot: all-dates
- tapOn:
    id: 'timeline.allDates.back'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 15000
- takeScreenshot: back
