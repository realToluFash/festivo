# sc-23283: Your account's sections, top and scrolled to the Time zone row, for the board's titles and a row's buttons.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.name'
    timeout: 30000
- takeScreenshot: cards-top
- scrollUntilVisible:
    element:
      id: 'account.zone'
    direction: DOWN
    timeout: 20000
- takeScreenshot: cards-bottom
