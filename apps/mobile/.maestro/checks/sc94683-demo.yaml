# sc-94683: the demo's Today size boards, This week Two events starting, in ORIENT, at AX2 fr, AX5 fr, AX2 en, default fr and AX1 fr; This week's heading brought to the middle for each. Vars: METRO_URL, ORIENT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- openLink: ${METRO_URL}/--/demo/today-size?week=starts&size=ax2&lang=fr
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- runFlow: ../developer-menu-close.yaml
- scrollUntilVisible:
    element: { text: '(This week|Cette semaine|THIS WEEK|CETTE SEMAINE)' }
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: d-ax2-fr
- swipe: { start: '50%,75%', end: '50%,45%', duration: 600 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: d-ax2-fr-2
