# sc-3584: in ${ORG}, opening each event from the list, the draft ${DRAFT} shows the row and Make live, whose sheet closes on Not yet; the draft ${PAST}, whose end has passed, says so with no Make live; then ${EVENT} is made live and reads Live with Make live gone. DRAFT and EVENT are drafts with a host and an end still to come: on a draft with no host Make live opens the refused sheet, which has no Not yet. EVENT stays live after a run, so each run needs a new draft for it.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runFlow:
    file: ../switch-organisation.yaml
    env:
      ORG: ${ORG}
- openLink: ${METRO_URL}/--/events
- scrollUntilVisible:
    element:
      id: 'events.row.${DRAFT}'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'events.row.${DRAFT}'
- extendedWaitUntil:
    visible:
      id: 'events.card'
    timeout: 30000
- assertVisible:
    id: 'events.phase.draft'
- takeScreenshot: draft
- tapOn:
    id: 'events.card.step'
- extendedWaitUntil:
    visible:
      id: 'events.makeLiveSheet'
    timeout: 10000
- takeScreenshot: confirm
- tapOn:
    id: 'events.makeLiveNo'
- extendedWaitUntil:
    notVisible:
      id: 'events.makeLiveSheet'
    timeout: 10000
- assertVisible:
    id: 'events.phase.draft'
- takeScreenshot: not-yet
- openLink: ${METRO_URL}/--/events
- scrollUntilVisible:
    element:
      id: 'events.row.${PAST}'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'events.row.${PAST}'
- extendedWaitUntil:
    visible:
      id: 'events.card'
    timeout: 30000
- assertVisible: '{{t:eventsScreen.nextChangeDates}}'
- assertVisible:
    id: 'events.card.step'
    text: '{{t:eventLive.changeDates}}'
- takeScreenshot: past-end
- openLink: ${METRO_URL}/--/events
- scrollUntilVisible:
    element:
      id: 'events.row.${EVENT}'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'events.row.${EVENT}'
- extendedWaitUntil:
    visible:
      id: 'events.card.step'
    timeout: 30000
- tapOn:
    id: 'events.card.step'
- extendedWaitUntil:
    visible:
      id: 'events.makeLiveYes'
    timeout: 10000
- tapOn:
    id: 'events.makeLiveYes'
- extendedWaitUntil:
    visible:
      id: 'events.phase.live'
    timeout: 20000
- assertNotVisible:
    id: 'events.card.step'
- assertNotVisible:
    id: 'events.phase.draft'
- takeScreenshot: made-live
- runFlow:
    when:
      visible:
        id: 'events.back'
    commands:
      - tapOn:
          id: 'events.back'
- scrollUntilVisible:
    element:
      id: 'events.row.${EVENT}'
    direction: DOWN
    timeout: 30000
- takeScreenshot: list
