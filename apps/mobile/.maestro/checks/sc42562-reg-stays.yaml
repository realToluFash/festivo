# Password changed stays while Organisation name keeps focus and is typed in; lowering the keys moves it above Continue. sc-37519.
appId: host.exp.Exponent
---
- runFlow: ../batch/sign-out.yaml
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN}
- extendedWaitUntil: { visible: { id: 'recovery.password' }, timeout: 30000 }
- tapOn: { id: 'recovery.password' }
- inputText: 'a-brand-new-password-37519'
- tapOn: { id: 'recovery.save' }
- extendedWaitUntil: { visible: { id: 'completeProfile.organisation' }, timeout: 30000 }
- assertVisible: '{{t:any:recovery.changed}}'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: stays-01-landed-keys-up
- inputText: 'Acme Events'
- assertVisible: '{{t:any:recovery.changed}}'
- takeScreenshot: stays-02-typed
- hideKeyboard
- assertVisible: '{{t:any:recovery.changed}}'
- takeScreenshot: stays-03-keys-down
