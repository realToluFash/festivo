# sc-1404: the app's design demo of the run view in one state (STATE, AS=&as=reader or empty), shot as sc1404-run-product shoots the product.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/run-view?state=${STATE}${AS}
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: run-top
- tapOn: { text: 'Main hall', optional: true }
- waitForAnimationToEnd
- takeScreenshot: main-hall
- scroll
- takeScreenshot: main-hall-2
- scroll
- takeScreenshot: main-hall-3
- scrollUntilVisible:
    { element: { text: 'Garden.*' }, direction: UP, timeout: 10000, optional: true }
- tapOn: { text: 'Garden.*', optional: true }
- waitForAnimationToEnd
- takeScreenshot: garden
- scroll
- takeScreenshot: garden-2
