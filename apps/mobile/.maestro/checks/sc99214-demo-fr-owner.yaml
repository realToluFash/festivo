# sc-99214: the narrow-bars demo on this phone's own width and text size, in fr, the owner bar, for the pair beside the product.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/narrow-bars?width=phone&size=phone&lang=fr&bar=owner
- extendedWaitUntil:
    visible:
      text: '.+'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo
- scroll
- takeScreenshot: demo-down
