# sc-91027 (PR #3890): on Create an organisation, a country picked far down the list is in view when Where is it based? is reached again, by Back from step 3 and by Continue from step 1.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'QA Country Back Ltd'
- tapOn:
    id: 'createWalk.primary'
- extendedWaitUntil:
    visible: '{{t:createOrganisation.whereTitle}}'
    timeout: 10000
- tapOn:
    id: 'createWalk.search'
- inputText: 'Zimbab'
- tapOn:
    id: 'createWalk.country.ZW'
- waitForAnimationToEnd
- takeScreenshot: create-country-zw-picked
- tapOn:
    id: 'createWalk.primary'
- waitForAnimationToEnd
- takeScreenshot: create-step3
- tapOn:
    id: 'createWalk.back'
- waitForAnimationToEnd
- takeScreenshot: create-country-back-from-3
- assertVisible:
    id: 'createWalk.country.ZW'
- tapOn:
    id: 'createWalk.back'
- waitForAnimationToEnd
- tapOn:
    id: 'createWalk.primary'
- waitForAnimationToEnd
- takeScreenshot: create-country-forward-from-1
- assertVisible:
    id: 'createWalk.country.ZW'
