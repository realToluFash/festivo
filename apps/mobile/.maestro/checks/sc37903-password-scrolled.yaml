# sc-37903 (scrolls to its row, for the largest sizes): Change password's header, Cancel with one tap, Save with one tap (a wrong current password, refused), at whatever text size the device is set to.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: 'security.password'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-top
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.change.current'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: password
- tapOn:
    id: 'security.change.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'security.change.current'
    timeout: 10000
- takeScreenshot: password-cancelled
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.change.current'
    timeout: 15000
- tapOn:
    id: 'security.change.current'
- inputText: 'not-the-password-1'
- tapOn:
    id: 'security.change.new'
- inputText: 'Another-long-pass-9'
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'security.change.save'
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: password-saved-refused
