# sc-92090: Today upright scrolled to Your events, recorded while it turns on its side, so every frame after the turn can be read. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- swipe: { start: '80%, 75%', end: '80%, 35%', duration: 900 }
- swipe: { start: '80%, 75%', end: '80%, 35%', duration: 900 }
- waitForAnimationToEnd
- takeScreenshot: up
- startRecording: turn
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 4000, optional: true }
- stopRecording
- takeScreenshot: side
