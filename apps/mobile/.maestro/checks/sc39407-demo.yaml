# sc-39407: the app's design demo, Calendar page, Month and Agenda stepped back to September 2026, for the month title beside the product's.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/calendar?state=populated
- extendedWaitUntil:
    visible:
      id: calendar.view.month
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: demo-month-nov
- repeat:
    times: 6
    while:
      notVisible:
        id: calendar.day.2026-09-15
    commands:
      - tapOn:
          id: calendar.previous
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: demo-month-sep
- tapOn:
    id: calendar.previous
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-month-aug
- openLink: ${METRO_URL}/--/demo/calendar?state=agenda
- extendedWaitUntil:
    visible:
      id: calendar.agenda
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: demo-agenda-nov
- tapOn:
    id: calendar.previous
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: calendar.previous
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-agenda-sep
