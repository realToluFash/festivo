# sc-23330: the app frame's title is the wordmark, at ${ORIENT}. The wait matches the Brand's
# accessibility label, which the plain-text name would match too; the rail shot checks the wordmark.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible: '{{t:app.name}}'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: rail
