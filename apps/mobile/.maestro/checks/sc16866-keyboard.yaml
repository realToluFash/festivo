# Settings > Organisation, the failed preview with the keyboard up: the name field and the delete button still reachable. sc-16866.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.ownership.delete'
    timeout: 60000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'organisation.ownership.delete'
- extendedWaitUntil:
    visible:
      id: 'organisation.delete.retry'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: failed-top
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- scrollUntilVisible:
    element:
      id: 'organisation.delete.name'
    timeout: 20000
- tapOn:
    id: 'organisation.delete.name'
- inputText: 'Not the name'
- waitForAnimationToEnd
- takeScreenshot: keyboard-field
- scrollUntilVisible:
    element:
      id: 'organisation.delete.send'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: keyboard-send
- assertVisible:
    id: 'organisation.delete.send'
- assertVisible: 'Not the name'
