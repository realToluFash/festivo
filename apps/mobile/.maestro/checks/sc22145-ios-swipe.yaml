# sc-22145: the edge swipe on Duplicate {event} leaves at once for the original; during Create draft it is ignored and the copy opens.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- extendedWaitUntil:
    visible: '{{t:eventDuplicate.copied}}'
    timeout: 15000
- waitForAnimationToEnd
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: swipe-from-form
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: 'eventDuplicate.start.time'
- tapOn:
    id: 'eventDuplicate.start.done'
- waitForAnimationToEnd
- takeScreenshot: time-first
- tapOn:
    id: 'eventDuplicate.create'
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 300
- takeScreenshot: swipe-while-creating
- extendedWaitUntil:
    visible:
      id: 'events.page.duplicate'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: landed
