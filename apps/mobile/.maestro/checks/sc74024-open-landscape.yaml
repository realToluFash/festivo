# sc-74024: the Calendar on the iPad on its side.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../return-home.yaml
- runFlow:
    when:
      visible:
        id: 'tab-calendar|frame.calendar'
    commands:
      - tapOn:
          id: 'tab-calendar|frame.calendar'
- runFlow:
    when:
      notVisible:
        id: 'calendar.next'
    commands:
      - tapOn:
          text: 'Calendar'
          index: 0
- extendedWaitUntil:
    visible:
      id: 'calendar.next'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: calendar-opened
