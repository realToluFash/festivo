# sc-19212: on a tablet on its side, Events of ${ORG} (with events) opened with the API stopped: the failed card at full width, no Choose an event pane; Try again with the API back gives the list beside the pane.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    file: ../switch-organisation.yaml
    env:
      ORG: ${ORG}
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.retry'
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: '{{t:eventsScreen.choose}}.*'
- takeScreenshot: failed
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- tapOn:
    id: 'events.retry'
- takeScreenshot: retrying
- extendedWaitUntil:
    visible:
      id: 'events.new'
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: '{{t:eventsScreen.choose}}.*'
- takeScreenshot: split
