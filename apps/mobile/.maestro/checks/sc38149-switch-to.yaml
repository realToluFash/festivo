# Switches to the organisation ${ORG} in Where are you working?, then reads Today's pill. sc-38149.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'tab-today|frame.home'
    optional: true
- tapOn:
    id: 'frame.organisation|home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'switcher.tile.${ORG}'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switched
- openLink: ${METRO_URL}/--/
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: today
