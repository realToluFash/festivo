# sc-73564: the audit log filtered to Sign-in and security, where the longest action words are.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.filter.type
- tapOn:
    id: audit.menu.type.security
- extendedWaitUntil:
    notVisible:
      id: audit.menu.type
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: audit.entry.${E_LONG}
    centerElement: true
    timeout: 30000
- takeScreenshot: audit-security-list-product
- tapOn:
    id: audit.entry.${E_LONG}
- extendedWaitUntil:
    visible:
      id: audit.detail.when
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-security-detail-product
