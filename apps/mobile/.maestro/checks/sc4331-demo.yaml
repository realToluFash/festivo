- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: changedRow-demo
- openLink: ${METRO_URL}/--/demo/guests?state=changedMenu
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: changedMenu-demo
- openLink: ${METRO_URL}/--/demo/guests?state=changed
