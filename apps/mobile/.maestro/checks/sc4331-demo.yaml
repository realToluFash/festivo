# sc-4331: the app demos' states for this story, for side-by-side pairs.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?area=messages&state=bell
- waitForAnimationToEnd: { timeout: 8000 }
- runFlow: ../developer-menu-close.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: bell-demo
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?area=messages&state=replyArrived
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
