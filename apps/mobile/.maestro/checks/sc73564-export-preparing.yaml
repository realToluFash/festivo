# sc-73564: the Export dialog on the tablet, then sent with more than 10,000 entries matching: Preparing your export.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.step
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-export-dialog-product
- tapOn:
    id: audit.export.send
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: audit-export-preparing-product
