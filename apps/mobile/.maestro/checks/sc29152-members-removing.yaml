# sc-29152: the design demo's Settings in B Confetti, /members?state=removing. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/members?state=removing
- extendedWaitUntil:
    visible:
      text: 'Remove Priya Shah from .*\?'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: members-removing
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: members-removing-scrolled
