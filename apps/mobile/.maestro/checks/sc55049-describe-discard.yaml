# sc-55049: the description changed and discarded, no photo touched; the saved cover stays. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc52652/open.yaml
- takeScreenshot: before
- scrollUntilVisible:
    element:
      id: 'event.edit.cover.describe'
    direction: DOWN
- tapOn:
    id: 'event.edit.cover.describe'
- inputText: ' changed'
- hideKeyboard
- takeScreenshot: described
- tapOn:
    id: 'event.edit.cover.cancel'
- extendedWaitUntil:
    visible:
      id: 'event.edit.cover.discard'
    timeout: 10000
- takeScreenshot: discard-ask
- tapOn:
    id: 'event.edit.cover.discard'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- extendedWaitUntil:
    visible: 'never.there'
    timeout: 12000
    optional: true
- takeScreenshot: page-after
