# sc-80863: a Member of B with no role on B's event reads not available and stays in A. Pass A_ID, NOROLE.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 20000
- tapOn:
    id: 'home.switchOrganisation'
- tapOn:
    text: '.*Moremi Club.*'
    index: 0
- waitForAnimationToEnd
- takeScreenshot: today-before
- openLink: ${METRO_URL}/--/events/${NOROLE}
- extendedWaitUntil:
    visible:
      id: 'events.backToEvents'
    timeout: 20000
- takeScreenshot: unavailable
- tapOn:
    id: 'events.backToEvents'
- waitForAnimationToEnd
- takeScreenshot: back
