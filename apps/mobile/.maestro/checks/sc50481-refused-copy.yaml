# sc-50481: Delete event on an event with a guest Invited opens the refusal in the batch's language; screenshot for its copy, then Keep it. Needs ${METRO_URL}, ${EV}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.delete'
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'events.delete'
- extendedWaitUntil:
    visible:
      id: 'events.deleteRefused'
    timeout: 15000
- waitForAnimationToEnd
- assertVisible: '{{t:eventDelete.keep}}'
- takeScreenshot: refused
- tapOn:
    id: 'events.deleteRefusedKeep'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'events.deleteRefused'
