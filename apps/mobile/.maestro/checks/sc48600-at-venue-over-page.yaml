# sc-48600: a link to /events/${EVENT_ID}/edit?at=venue that arrives while that event's page is already showing still opens the Venue edit. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 20000
- takeScreenshot: at-venue-over-page
