# sc-91027: Cancel the screen on top, and Discard if it asks. Ends with no Discard ask showing.
appId: host.exp.Exponent
---
- tapOn:
    id: '.*\.cancel'
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible:
        id: '.*\.discard'
    commands:
      - takeScreenshot: ${SHOT}-ask
      - tapOn:
          id: '.*\.discard'
      - waitForAnimationToEnd:
          timeout: 4000
- assertNotVisible:
    id: '.*\.discard'
