# sc-29961: an answer (replaced) arriving while Cancel your request? is open closes the sheet and shows it. The answer is made from the shell (.qa/sc29961/answer.py).
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- runFlow: ../sc29961-to-waiting.yaml
- tapOn: { id: 'lostTwoFactor.cancel' }
- extendedWaitUntil: { visible: '{{t:lostTwoFactor.cancelTitle}}', timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: sheet-open
- extendedWaitUntil: { visible: '{{t:lostTwoFactor.replacedTitle}}', timeout: 90000 }
- waitForAnimationToEnd
- assertNotVisible: '{{t:lostTwoFactor.cancelTitle}}'
- takeScreenshot: answered
- extendedWaitUntil: { visible: 'zz-never-on-screen-zz', timeout: 5000, optional: true }
- tapOn: { id: 'lostTwoFactor.startAgain' }
- extendedWaitUntil: { visible: { id: 'signIn.password' }, timeout: 30000 }
- waitForAnimationToEnd
- assertVisible: '{{t:signIn.codeTimedOutTitle}}\. {{t:signIn.endedBody}}'
- assertVisible: { id: 'signIn.email', text: '${EMAIL}' }
- takeScreenshot: start-again-timed-out
