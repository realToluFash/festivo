# sc-58991: Copy invitation link with no way to the API, then the failed-copy line under the row. Pass METRO_URL, EVENT_ID, GUEST_ID, ORIENT, NET (a host helper that cuts and restores the API).
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../scripts/sc58991-net.js
      env:
        NET_URL: ${NET}/online
---
- runFlow: sc58991-open-guest.yaml
- scrollUntilVisible:
    element:
      id: 'guest.copy'
    timeout: 20000
- runScript:
    file: ../scripts/sc58991-net.js
    env:
      NET_URL: ${NET}/offline
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'guest.replace'
    timeout: 20000
- tapOn:
    id: 'guest.copy'
- extendedWaitUntil:
    visible:
      id: 'guest.notCopied'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'guest.replace'
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: notcopied
- runScript:
    file: ../scripts/sc58991-net.js
    env:
      NET_URL: ${NET}/online
