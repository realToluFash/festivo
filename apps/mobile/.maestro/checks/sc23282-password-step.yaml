# sc-23282: Change password opens its step in the Ways card with Save new password on top of Cancel; Cancel closes it. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'password.change'
- scrollUntilVisible:
    element:
      id: 'password.save'
    timeout: 15000
    centerElement: true
- takeScreenshot: step
- scrollUntilVisible:
    element:
      id: 'password.current'
    direction: UP
    timeout: 15000
- takeScreenshot: step-top
- tapOn:
    id: 'password.current'
- takeScreenshot: keyboard
- tapOn:
    id: 'password.cancel'
- waitForAnimationToEnd
- takeScreenshot: closed
- assertVisible:
    id: 'password.change'
- assertNotVisible:
    id: 'password.save'
