# sc-23282: Password opens Change password, its own screen, with Save new password and Cancel showing; Cancel returns to Security with Password showing. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.change.screen'
    timeout: 15000
- assertVisible:
    id: 'security.change.save'
- assertVisible:
    id: 'security.change.cancel'
- takeScreenshot: step
- tapOn:
    id: 'security.change.current'
- takeScreenshot: keyboard
- tapOn:
    id: 'security.change.cancel'
- waitForAnimationToEnd
- takeScreenshot: closed
- assertVisible:
    id: 'security.password'
- assertNotVisible:
    id: 'security.change.screen'
