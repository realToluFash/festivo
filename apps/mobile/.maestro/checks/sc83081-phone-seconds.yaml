# sc-83081 on a phone: Notifications opened by the bell on Events on a cold start, recorded and shot every second from 1 to 25 s after the tap, to tell a late mount from a loading state that draws nothing. Pass METRO_URL; run with batch --cold --android.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- startRecording: events-bell
- tapOn: { id: 'frame.bell' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: events-1s
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
