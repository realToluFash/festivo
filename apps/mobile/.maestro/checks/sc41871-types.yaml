# Needs an organisation with events (any).
# sc-41871 (scrolls to each type, for a phone whose Type list runs below the menu): the menu's Type row with types chosen until its first is cut, for the one-space gap on Android.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.filter'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'events.filter'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'events.filter.menu'
    commands:
      - tapOn:
          id: 'events.filter'
- extendedWaitUntil:
    visible:
      id: 'events.filter.menu'
    timeout: 10000
- tapOn:
    id: 'events.filter.type'
- tapOn:
    id: 'events.filter.type.anniversary'
- tapOn:
    id: 'events.filter.type.engagement'
- tapOn:
    id: 'events.filter.type.baby_shower'
- tapOn:
    id: 'events.filter.type.graduation'
- scrollUntilVisible:
    element:
      id: 'events.filter.back'
    direction: UP
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: types-four-menu
- tapOn:
    id: 'events.filter.type'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.memorial'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.memorial'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.religious'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.religious'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.cultural'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.cultural'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.party'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.party'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.gala'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.gala'
- scrollUntilVisible:
    element:
      id: 'events.filter.type.conference'
    direction: DOWN
- tapOn:
    id: 'events.filter.type.conference'
- scrollUntilVisible:
    element:
      id: 'events.filter.back'
    direction: UP
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: types-twelve-menu
- tapOn:
    point: '50%,85%'
- waitForAnimationToEnd
- takeScreenshot: types-twelve
- tapOn:
    id: 'events.filter'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: 'events.filter.menu'
    commands:
      - tapOn:
          id: 'events.filter'
- extendedWaitUntil:
    visible:
      id: 'events.filter.menu'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: types-twelve-reopened
