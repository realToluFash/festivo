# sc-67665: the People demo, roleFails, on the iPad in ${ORIENT}: the list, then Ana's role changed to Can view and refused.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/people?state=roleFails
- extendedWaitUntil: { visible: { id: 'people.row.ana.souza@ire.events' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: d
- tapOn: { id: 'people.row.ana.souza@ire.events' }
- waitForAnimationToEnd: { timeout: 8000 }
- tapOn: { id: 'people.role.Can view' }
- extendedWaitUntil: { visible: '.*change Ana.*role.*', timeout: 30000 }
- takeScreenshot: refused
