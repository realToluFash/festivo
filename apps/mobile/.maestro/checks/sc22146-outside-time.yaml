# sc-22146: on iOS, New event's Starts time sheet, the wheel scrolled to a new time and the sheet closed by a tap outside it; Starts' time shows a time, not its empty Time, as Done would.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.new'
    timeout: 30000
- tapOn:
    id: 'events.new'
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'eventForm.start.time'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'eventForm.start.time'
    text: '{{t:eventForm.time}}'
- tapOn:
    id: 'eventForm.start.time'
- extendedWaitUntil:
    visible:
      id: 'eventForm.start.done'
    timeout: 10000
- swipe:
    start: 35%, 80%
    end: 35%, 70%
- waitForAnimationToEnd
- takeScreenshot: scrolled
- tapOn:
    point: '50%,8%'
- waitForAnimationToEnd
- assertNotVisible:
    id: 'eventForm.start.done'
- assertNotVisible:
    id: 'eventForm.start.time'
    text: '{{t:eventForm.time}}'
- assertVisible:
    id: 'eventForm.start.time'
    text: '.*\d.*'
- takeScreenshot: kept
