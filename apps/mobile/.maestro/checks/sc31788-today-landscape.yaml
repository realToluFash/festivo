# sc-31788: the Today tab in the account's language on a tablet in landscape, at ${ORIENT}: LANDSCAPE_LEFT, or PORTRAIT on a landscape-native tablet such as Soirely_QA2_Tablet (sc-23471).
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible: '{{t:todayScreen.tab.today}}'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: top
- swipe:
    start: 50%, 80%
    end: 50%, 35%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: s1
- swipe:
    start: 50%, 80%
    end: 50%, 35%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: s2
- swipe:
    start: 50%, 80%
    end: 50%, 35%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: s3
- swipe:
    start: 50%, 80%
    end: 50%, 35%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: s4
