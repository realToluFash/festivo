# Android: Transfer ownership, the button swiped above the keys by hand: member chosen, password typed, keys up, API stopped, Make the owner tapped. The whole notice ends in view, keys up. sc-24496.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
    timeout: 60000
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: ${PASSWORD}
- waitForAnimationToEnd
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- swipe:
    start: 50%, 44%
    end: 50%, 23%
    duration: 600
- swipe:
    start: 50%, 44%
    end: 50%, 23%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: swiped
- assertVisible:
    id: organisation.transfer.send
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible: '.*{{t:ownership.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertVisible: '(?i)(shift|delete)'
