# Android only. sc-18776: EV's All dates by link while EV itself shows; ‹ Event (BACK) steps back to it rather than opening a second copy, so the first system back leaves EV; that second-copy check only bites with ORIENT landscape on a tablet, since on a phone or an upright tablet the first back closes the page to the list and the second dismisses to Home past any copy. Pass EV (an event's id), EV_NAME (its name), BACK and ORIENT; BACK is frame.back on a phone, timeline.allDates.back on a tablet.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd
- runFlow: ../return-home.yaml

- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- takeScreenshot: behind
- openLink: ${METRO_URL}/--/events/${EV}/dates
- extendedWaitUntil:
    visible:
      id: 'timeline.row'
    timeout: 30000
- takeScreenshot: dates
- tapOn:
    id: ${BACK}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 20000
- assertVisible:
    text: '${EV_NAME}'
    childOf:
      id: 'events.page'
- assertNotVisible:
    id: 'timeline.allDates.page'

- takeScreenshot: up
- back
- waitForAnimationToEnd
- takeScreenshot: back1
- assertNotVisible:
    text: '${EV_NAME}'
    childOf:
      id: 'events.page'
- assertNotVisible:
    id: 'timeline.allDates.page'
- back
- waitForAnimationToEnd
- takeScreenshot: back2
- assertNotVisible:
    id: 'timeline.allDates.page'
