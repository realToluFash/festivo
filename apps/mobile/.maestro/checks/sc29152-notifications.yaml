# sc-29152: the design demo's Settings in B Confetti, /notifications. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/notifications
- extendedWaitUntil:
    visible:
      id: 'demo.notifications'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: notifications
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: notifications-scrolled
