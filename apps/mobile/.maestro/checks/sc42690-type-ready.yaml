# New event, scrolled to its Type picker, left at rest for a TalkBack pass. sc-42690.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/new
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'eventForm.type'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: type-ready
