# sc-12226: Remove role? opened from the page of the role named by ${ROLE}, then kept.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible: '{{t:rolesScreen.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'roles.role.${ROLE}'
    direction: DOWN
- tapOn:
    id: 'roles.role.${ROLE}'
- scrollUntilVisible:
    element:
      id: 'roles.remove'
    direction: DOWN
- tapOn:
    id: 'roles.remove'
- takeScreenshot: role-spare-remove
- scrollUntilVisible:
    element:
      id: 'roles.remove.keep'
    direction: DOWN
- takeScreenshot: role-spare-remove-foot
- tapOn:
    id: 'roles.remove.keep'
