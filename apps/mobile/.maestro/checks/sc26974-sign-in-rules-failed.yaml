# sc-26974: Settings > Sign-in rules that cannot load, with Try again.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible:
      id: 'signInRules.retry'
    timeout: 60000
- assertVisible: '{{t:signInRules.retry}}'
- takeScreenshot: failed
