# sc-18978: another member's role changed to Owner (${MEMBER_ID}) opens Confirm it's you with membersScreen.proveOwner, which names the organisation and the minutes. Needs an owner signed in to ${ORG_NAME}, and MEMBER_ID of another member who is not an owner.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible: '{{t:membersScreen.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: members.row.${MEMBER_ID}
    timeout: 20000
- tapOn:
    id: members.row.${MEMBER_ID}
- scrollUntilVisible:
    element:
      id: members.role.owner
    timeout: 20000
- tapOn:
    id: members.role.owner
- repeat:
    while:
      notVisible:
        id: members.role.save
    times: 10
    commands:
      - swipe:
          start: 85%, 80%
          end: 85%, 30%
- tapOn:
    id: members.role.save
- extendedWaitUntil:
    visible:
      id: members.role.prove.continue
    timeout: 20000
- scrollUntilVisible:
    element: '.*${ORG_NAME}, .* 5 .*'
    direction: UP
    timeout: 20000
- takeScreenshot: member-role-owner-prove
