# sc-37983: Set a new password lands on Your organisation; waits for the step to arrive, then pictures Password changed against Continue with the keys up, down, and up again with text typed, without closing it. ORIENT is PORTRAIT or LANDSCAPE_LEFT. Pass METRO_URL and TOKEN_ORG, a reset token for an account with no organisation, invitation or offer.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN_ORG}
- extendedWaitUntil: { visible: { id: 'recovery.password' }, timeout: 30000 }
- tapOn: { id: 'recovery.password' }
- inputText: 'a-brand-new-password-37983'
- hideKeyboard
- tapOn: { id: 'recovery.save' }
- extendedWaitUntil: { visible: '{{t:any:recovery.changed}}', timeout: 30000 }
- extendedWaitUntil: { visible: { id: 'completeProfile.organisation' }, timeout: 15000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: orgK-01-keys-up
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: orgK-02-keys-down
- tapOn: { id: 'completeProfile.organisation' }
- inputText: 'Acme'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: orgK-03-typed
- setOrientation: PORTRAIT
- runFlow: ../sign-out-from-complete-profile.yaml
