# New event: a refused submit with nothing filled, to see whether Type, Time zone or Currency take a line and the red edge. sc-30447.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/new
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 30000
- hideKeyboard
- takeScreenshot: event-at-rest
- scrollUntilVisible:
    element:
      id: 'eventForm.send'
- tapOn:
    id: 'eventForm.send'
- waitForAnimationToEnd
- takeScreenshot: event-refused
- scrollUntilVisible:
    element:
      id: 'eventForm.type'
    direction: UP
- takeScreenshot: event-refused-type
- tapOn:
    id: 'eventForm.type'
- waitForAnimationToEnd
- takeScreenshot: event-type-open
