# sc-38666: at the accessibility text sizes (font scale set to 2.0 outside the flow), the name step on a phone on its side with the keys up (label above, field and caret first) and upright (label above, 52 nav).
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: a01-side-arrive
- inputText: 'Lagos Supper Club'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: a02-side-typed
- tapOn: { id: 'createWalk.cancel', optional: true }
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: a03-up-arrive
- tapOn: { id: 'createWalk.cancel', optional: true }
