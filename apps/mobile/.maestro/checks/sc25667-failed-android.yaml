# Android only. sc-25667: Create organisation with the API stopped answers Creating the organisation did not work., and then Cancel is live and closes the sheet with nothing named Held Failed created.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createOrganisation.name'
- inputText: 'Held Failed'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'createOrganisation.create'
- extendedWaitUntil:
    visible:
      id: 'createOrganisation.cancel'
      enabled: true
    timeout: 60000
- takeScreenshot: failed-answer-keys-up
- back
- waitForAnimationToEnd
- assertVisible:
    id: 'createOrganisation'
- takeScreenshot: failed-answer
- assertVisible:
    id: 'createOrganisation.cancel'
    enabled: true
- tapOn:
    id: 'createOrganisation.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'createOrganisation'
    timeout: 10000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: '.*Held Failed.*'
- takeScreenshot: failed-switcher
