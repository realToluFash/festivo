# Android only. sc-25667: Create organisation with the API stopped answers Creating the organisation did not work., and then Cancel is live and leaves the walk by its Discard with nothing named Held Failed created.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- runFlow: ../open-create-organisation.yaml
- runFlow:
    file: ../walk-to-ready.yaml
    env:
      NAME: 'Held Failed'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'createWalk.primary'
- extendedWaitUntil:
    visible: '{{t:createOrganisation.failed}}'
    timeout: 60000
- takeScreenshot: failed-answer
- assertVisible:
    id: 'createWalk.cancel'
    enabled: true
- tapOn:
    id: 'createWalk.cancel'
- tapOn:
    id: 'createWalk.discard'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible: '.*Held Failed.*'
- takeScreenshot: failed-switcher
