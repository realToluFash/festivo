# Settings > Organisation, opened with the API stopped, then deleted once it is back: the typed name still deletes. sc-16866.
# It deletes the account's organisation: run it alone, in one language, then register a fresh account with `node scripts/qa-account.mjs`.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.ownership.delete'
    timeout: 60000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'organisation.ownership.delete'
- extendedWaitUntil:
    visible:
      id: 'organisation.delete.retry'
    timeout: 30000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- tapOn:
    id: 'organisation.delete.name'
- inputText: 'QA Organisatio'
- scrollUntilVisible:
    element:
      id: 'organisation.delete.send'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'organisation.delete.send'
- waitForAnimationToEnd
- assertVisible: '{{t:ownership.deleteMismatch}}'
- takeScreenshot: mismatch
- tapOn:
    id: 'organisation.delete.name'
- eraseText: 60
- inputText: 'QA Organisation'
- scrollUntilVisible:
    element:
      id: 'organisation.delete.send'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'organisation.delete.send'
- extendedWaitUntil:
    notVisible:
      id: 'organisation.delete.send'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: deleted
