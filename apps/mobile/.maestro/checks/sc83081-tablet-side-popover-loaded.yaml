# sc-83081, the tablet on its side: the bell's popover opened from Today (by its label) and loaded, left open for a step outside Maestro (a network or stack change). Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/
- tapOn: { text: '(Today|Hoy)' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 8000, optional: true }
- waitForAnimationToEnd
- tapOn: { text: '(Notificaciones|Notifications).*', index: 0 }
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 20000 }
- extendedWaitUntil: { visible: { id: 'notifications\.item\..*' }, timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: loaded
