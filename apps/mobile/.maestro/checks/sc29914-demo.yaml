# sc-29914: the demo's People (populated, role sheet, Add people, nobody, read only), Members' picker and a Member's Settings and Organisation, at ${ORIENT}.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/people
- extendedWaitUntil: { visible: 'On this event.*', timeout: 30000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: people
- tapOn: { text: '.*Tom Becker.*', index: 0 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: role
- tapOn: { text: 'Done', index: 0 }
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/demo/people
- tapOn: { text: 'Add by name.*' }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: add
- tapOn: { text: 'Cancel', index: 0 }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { text: 'Discard.*', optional: true }
- openLink: ${METRO_URL}/--/demo/people?state=nobody
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: nobody
- openLink: ${METRO_URL}/--/demo/people?state=readOnly
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: readonly
- openLink: ${METRO_URL}/--/demo/settings?as=member
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: settings-member
- openLink: ${METRO_URL}/--/demo/settings/organisation?as=member
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: org-member
- openLink: ${METRO_URL}/--/demo/settings/members?state=list
- waitForAnimationToEnd: { timeout: 6000 }
- takeScreenshot: members
