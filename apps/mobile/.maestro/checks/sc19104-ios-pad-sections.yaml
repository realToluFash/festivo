# sc-19104, iPad on its side: each Settings section chosen shows beside the Settings list, its row lit there.
# Members is the exception: its own list takes the Settings list's place (SummaryColumn), and its back returns to Settings.
# Upright, Settings is its own screen (sc-30412).
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../open-settings.yaml
- takeScreenshot: choose-section
- scrollUntilVisible:
    element:
      id: 'settings.account'
    timeout: 20000
- tapOn:
    id: 'settings.account'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings.account'
    selected: true
- assertVisible:
    id: 'account.zone'
- takeScreenshot: account-beside
- scrollUntilVisible:
    element:
      id: 'settings.security'
    timeout: 20000
- tapOn:
    id: 'settings.security'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings.security'
    selected: true
- assertVisible:
    id: 'security.password'
- takeScreenshot: security-beside
- scrollUntilVisible:
    element:
      id: 'settings.organisation'
    timeout: 20000
- tapOn:
    id: 'settings.organisation'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings.organisation'
    selected: true
- assertVisible: '{{t:orgGeneral.details}}'
- takeScreenshot: organisation-beside
- scrollUntilVisible:
    element:
      id: 'settings.members'
    timeout: 20000
- tapOn:
    id: 'settings.members'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 15000
- assertNotVisible:
    id: 'settings.members'
- takeScreenshot: members-own-pane
- tapOn: '.+ {{t:settings.title}}'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'settings.members'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings.signInRules'
    timeout: 20000
- tapOn:
    id: 'settings.signInRules'
- waitForAnimationToEnd
- assertVisible:
    id: 'settings.signInRules'
    selected: true
- assertVisible: '{{t:signInRules.stand.whereTitle}}'
- takeScreenshot: signInRules-beside
- setOrientation: PORTRAIT
