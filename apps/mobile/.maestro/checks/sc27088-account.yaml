# sc-27088, Android only: Settings > account shows the offline band, the automatic rereads are refused with the band still up, Try again's own load shows Refreshing…, then the band goes once Soirely answers.
appId: host.exp.Exponent
---
- runFlow:
    file: ../checks/sc27088/band-refreshing.yaml
    env:
      SCREEN: account
      REFRESHING: 'account.refreshing'
      LOADED_TEXT: '.*'
      LOADED_ID: 'nameCard.change'
- assertVisible:
    id: 'nameCard.change'
- takeScreenshot: reloaded
