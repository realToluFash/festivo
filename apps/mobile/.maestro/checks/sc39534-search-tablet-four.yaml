# sc-39534: the tablet's Search on Today, Events, Calendar and Settings, in both orientations (this emulator's PORTRAIT is its wide side).
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/
- waitForAnimationToEnd
- takeScreenshot: wide-today
- openLink: ${METRO_URL}/--/events
- waitForAnimationToEnd
- takeScreenshot: wide-events
- openLink: ${METRO_URL}/--/calendar
- waitForAnimationToEnd
- takeScreenshot: wide-calendar
- openLink: ${METRO_URL}/--/settings
- waitForAnimationToEnd
- takeScreenshot: wide-settings
- tapOn: 'Search.*'
- extendedWaitUntil:
    visible:
      id: 'search.field'
    timeout: 15000
- inputText: 'ines'
- extendedWaitUntil:
    visible: 'Inês Duarte'
    timeout: 15000
- takeScreenshot: wide-mixed
- tapOn:
    id: 'search.scrim'
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/
- waitForAnimationToEnd
- takeScreenshot: upright-today
- openLink: ${METRO_URL}/--/settings
- waitForAnimationToEnd
- takeScreenshot: upright-settings
- openLink: ${METRO_URL}/--/calendar
- waitForAnimationToEnd
- takeScreenshot: upright-calendar
- tapOn:
    id: 'frame.search'
- extendedWaitUntil:
    visible:
      id: 'search.field'
    timeout: 15000
- inputText: 'qa-17947713644'
- extendedWaitUntil:
    visible: 'qa-1794771364488@soirely.test.*'
    timeout: 15000
- takeScreenshot: upright-member-results
- tapOn: 'qa-1794771364488@soirely.test.*'
- waitForAnimationToEnd
- takeScreenshot: upright-member-opened
