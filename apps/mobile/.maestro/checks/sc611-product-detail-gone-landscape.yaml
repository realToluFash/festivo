# sc-611: an entry opened: detail_gone. On its side.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.filter.type
- tapOn:
    id: audit.menu.type.events
- extendedWaitUntil:
    notVisible:
      id: audit.menu.type
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: audit.entry.${E_GONE}
    centerElement: true
    timeout: 30000
- tapOn:
    id: audit.entry.${E_GONE}
- extendedWaitUntil:
    visible:
      id: audit.detail.when
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-detail_gone-landscape-product
