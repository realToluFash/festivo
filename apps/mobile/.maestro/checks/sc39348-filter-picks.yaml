# Needs an organisation with events typed wedding, birthday, gala and corporate, hosted by Adaeze Obi and Tunde Bakare, Chidi Okafor, Funmilayo Adéṣínà-Ọláolúwa and The Mensah family.
# sc-39348: Filter and the menu's rows with nothing, six, four, one long and two hosts chosen: whole picks, then "+N more".
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.filter'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: nothing
- tapOn:
    id: 'events.filter'
- extendedWaitUntil:
    visible:
      id: 'events.filter.menu'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: nothing-menu
- tapOn:
    id: 'events.filter.type'
- tapOn:
    id: 'events.filter.type.wedding'
- tapOn:
    id: 'events.filter.type.birthday'
- tapOn:
    id: 'events.filter.type.gala'
- tapOn:
    id: 'events.filter.back'
- tapOn:
    id: 'events.filter.when'
- tapOn:
    id: 'events.filter.when.week'
- tapOn:
    id: 'events.filter.back'
- tapOn:
    id: 'events.filter.hosts'
- tapOn:
    id: 'events.filter.host.Adaeze Obi'
- tapOn:
    id: 'events.filter.host.Tunde Bakare'
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: six-menu
- tapOn:
    point: '50%,85%'
- waitForAnimationToEnd
- takeScreenshot: six
- tapOn:
    id: 'events.filter'
- tapOn:
    id: 'events.filter.type'
- tapOn:
    id: 'events.filter.type.gala'
- tapOn:
    id: 'events.filter.back'
- tapOn:
    id: 'events.filter.hosts'
- tapOn:
    id: 'events.filter.host.Adaeze Obi'
- tapOn:
    id: 'events.filter.host.Tunde Bakare'
- tapOn:
    id: 'events.filter.host.Chidi Okafor'
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: four-menu
- tapOn:
    point: '50%,85%'
- waitForAnimationToEnd
- takeScreenshot: four
- tapOn:
    id: 'events.filter'
- tapOn:
    id: 'events.filter.type'
- tapOn:
    id: 'events.filter.type.wedding'
- tapOn:
    id: 'events.filter.type.birthday'
- tapOn:
    id: 'events.filter.back'
- tapOn:
    id: 'events.filter.when'
- tapOn:
    id: 'events.filter.when.any'
- tapOn:
    id: 'events.filter.back'
- tapOn:
    id: 'events.filter.hosts'
- tapOn:
    id: 'events.filter.host.Chidi Okafor'
- tapOn:
    id: 'events.filter.host.Funmilayo Adéṣínà-Ọláolúwa'
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: longhost-menu
- tapOn:
    point: '50%,85%'
- waitForAnimationToEnd
- takeScreenshot: longhost
- tapOn:
    id: 'events.filter'
- tapOn:
    id: 'events.filter.hosts'
- tapOn:
    id: 'events.filter.host.The Mensah family'
- tapOn:
    id: 'events.filter.back'
- waitForAnimationToEnd
- takeScreenshot: longhost-two-menu
- tapOn:
    point: '50%,85%'
- waitForAnimationToEnd
- takeScreenshot: longhost-two
