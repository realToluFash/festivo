# sc-27213 regression: a wrong current password sent by the return key is refused with the keys up and New password still focused (sc-13408); then a key typed there and sent again with the API paused leaves Cancel off, and a tap on it closes nothing (sc-12545). Needs ${METRO_URL}.
# The return key is Enter on iOS and the keyboard's action key on Android, where Enter can type into the field instead (sc-18648): tapped by its name, Done, where the keyboard names it, else at its place.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.change.current'
    timeout: 10000
- tapOn:
    id: 'security.change.current'
- inputText: 'wrong-current-password-1'
- takeScreenshot: current-typed-in-view
# In Spanish the Forgot link wraps and New password sits under the keys, so Android brings it into view first.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'security.change.new'
          timeout: 10000
          centerElement: true
- tapOn:
    id: 'security.change.new'
- inputText: 'brand-new-password-123'
- takeScreenshot: new-typed-in-view
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: '(?i)^(done|listo|hecho|ok)$'
          commands:
            - tapOn: '(?i)^(done|listo|hecho|ok)$'
      - runFlow:
          when:
            notVisible: '(?i)^(done|listo|hecho|ok)$'
          commands:
            - tapOn:
                point: '92%,88%'
- extendedWaitUntil:
    visible: '{{t:passwordCard.wrongCurrent}}'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: refused-keys
- assertVisible: '(?i)(shift|delete)'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'security.change.new'
          focused: true
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
# Focus, proved as sc13408-change-return-up.yaml does: the key and the send reach the form only if New password still holds it.
- inputText: 'x'
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: '(?i)^(done|listo|hecho|ok)$'
          commands:
            - tapOn: '(?i)^(done|listo|hecho|ok)$'
      - runFlow:
          when:
            notVisible: '(?i)^(done|listo|hecho|ok)$'
          commands:
            - tapOn:
                point: '92%,88%'
- extendedWaitUntil:
    visible:
      id: 'security.change.cancel'
      enabled: false
    timeout: 5000
- takeScreenshot: held-cancel-off
- tapOn:
    id: 'security.change.cancel'
    retryTapIfNoChange: false
- assertVisible:
    id: 'security.change.cancel'
    enabled: false
- assertVisible:
    id: 'security.change.save'
- takeScreenshot: held-cancel-tapped-still-open
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '{{t:passwordCard.wrongCurrent}}'
    timeout: 30000
- takeScreenshot: after-up
