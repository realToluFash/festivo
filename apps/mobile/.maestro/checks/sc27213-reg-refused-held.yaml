# sc-27213 regression: a wrong current password sent by the return key is refused with the keys up and New password still focused (sc-13408); then a key typed there and sent again with the API paused leaves Cancel off, and a tap on it closes nothing (sc-12545). Needs ${METRO_URL}.
# The return key is Enter on iOS and a tap on the keyboard's action key on Android, where Enter can type into the field instead (sc-18648).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'password.change'
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: 'password.current'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'password.current'
- inputText: 'wrong-current-password-1'
- takeScreenshot: current-typed-in-view
- tapOn:
    id: 'password.new'
- inputText: 'brand-new-password-123'
- takeScreenshot: new-typed-in-view
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: '92%,88%'
- extendedWaitUntil:
    visible: '{{t:passwordCard.wrongCurrent}}'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: refused-keys
- assertVisible: '(?i)(shift|delete)'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'password.new'
          focused: true
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
# Focus, proved as sc13408-change-return-up.yaml does: the key and the send reach the form only if New password still holds it.
- inputText: 'x'
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: '92%,88%'
- extendedWaitUntil:
    visible:
      id: 'password.cancel'
      enabled: false
    timeout: 5000
- takeScreenshot: held-cancel-off
- tapOn:
    id: 'password.cancel'
    retryTapIfNoChange: false
- assertVisible:
    id: 'password.cancel'
    enabled: false
- assertVisible:
    id: 'password.save'
- takeScreenshot: held-cancel-tapped-still-open
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '{{t:passwordCard.wrongCurrent}}'
    timeout: 30000
- takeScreenshot: after-up
