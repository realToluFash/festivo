# Transfer ownership: wrong password, keys hidden, refused. Keys never open. sc-9674.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
    centerElement: true
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: not-my-password
- tapOn:
    point: '2%,45%'
- waitForAnimationToEnd
- takeScreenshot: keys-hidden
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- scrollUntilVisible:
    element:
      id: organisation.transfer.send
    centerElement: true
- tapOn:
    id: organisation.transfer.send
- waitForAnimationToEnd
- takeScreenshot: at-tap
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    visible: '{{t:ownership.passwordWrong}}'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertNotVisible: '(?i)(shift|delete)'
