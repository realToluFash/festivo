# The frame at whatever text size the simulator is set to: each destination opens with one tap. sc-13496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'frame.organisation'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: frame-home
- tapOn:
    id: 'frame.settings'
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: frame-settings
- tapOn:
    id: 'frame.home'
- extendedWaitUntil:
    visible:
      id: 'frame.organisation'
    timeout: 15000
