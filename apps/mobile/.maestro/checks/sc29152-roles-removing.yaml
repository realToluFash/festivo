# sc-29152: the design demo's Settings in B Confetti, /roles?state=removing. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/roles?state=removing
- extendedWaitUntil:
    visible:
      id: 'roles.remove.confirm'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: roles-removing
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: roles-removing-scrolled
