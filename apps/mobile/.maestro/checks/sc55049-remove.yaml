# sc-55049: a freshly uploaded cover removed with Remove photo while Cover stays open; screenshots up to 15 s, for the store check. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc52652/open.yaml
- scrollUntilVisible:
    element:
      id: 'event.edit.cover.upload'
    direction: DOWN
- tapOn:
    id: 'event.edit.cover.upload'
- extendedWaitUntil:
    visible: 'Photos'
    timeout: 15000
- tapOn:
    point: '16%,25%'
- extendedWaitUntil:
    visible: 'never.there'
    timeout: 12000
    optional: true
- takeScreenshot: uploaded
- scrollUntilVisible:
    element:
      id: 'event.edit.cover.remove'
    direction: DOWN
- tapOn:
    id: 'event.edit.cover.remove'
- takeScreenshot: removed
- extendedWaitUntil:
    visible: 'never.there'
    timeout: 15000
    optional: true
- takeScreenshot: cover-open-15s
