# sc-97614: the demo's Shift notices states, in ${ORIENT}: each top, and its foot scrolled.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?area=staff&staff=smsOn&shift=list
- extendedWaitUntil:
    visible:
      id: '.+'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: list-top
- swipe:
    start: '50%,80%'
    end: '50%,30%'
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: list-foot
