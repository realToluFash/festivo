# sc-25667: before Create organisation is pressed, Cancel leaves the walk with a name typed (by its Discard), and on an iPad a tap on the scrim does the same, nothing created either way.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'Before Cancel'
- hideKeyboard:
    optional: true
- assertVisible:
    id: 'createWalk.cancel'
    enabled: true
- tapOn:
    id: 'createWalk.cancel'
- tapOn:
    id: 'createWalk.discard'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- runFlow: ../open-create-organisation.yaml
- runFlow:
    when:
      visible:
        id: 'createWalk.scrim'
    commands:
      - tapOn:
          id: 'createWalk.name'
      - inputText: 'Before Scrim'
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          point: '50%,8%'
      - tapOn:
          id: 'createWalk.discard'
- runFlow:
    when:
      visible:
        id: 'createWalk'
    commands:
      - tapOn:
          id: 'createWalk.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 20000
- waitForAnimationToEnd
- assertNotVisible: '.*Before (Cancel|Scrim).*'
- takeScreenshot: before-switcher
