# sc-38005: Members' card, a request to get back in and its Approve confirm, on the tablet turned to ORIENT (PORTRAIT draws the landscape-native Android tablet on its side). Needs ${METRO_URL}, ${ORIENT}; request 22222222-2222-4222-8222-222222222221 waiting.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: card
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222221.approve'
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: list
- tapOn:
    id: 'members.recovery.22222222-2222-4222-8222-222222222221.approve'
- waitForAnimationToEnd
- takeScreenshot: approve
- tapOn:
    id: 'members.recovery.cancel'
