# sc-65714: a suspended member's page on Members, with "If nobody answers by …, they are removed." as the server writes it. Needs MEMBER_ID.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.row.${MEMBER_ID}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: members-suspended-list
- tapOn:
    id: 'members.row.${MEMBER_ID}'
- extendedWaitUntil:
    visible: '.*they are removed.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: member-suspended
