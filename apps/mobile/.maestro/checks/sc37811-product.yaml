# sc-37811: the product's Settings › Members, top and scrolled, in the batch's language. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: top
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: scrolled
