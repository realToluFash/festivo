# sc-611: an entry opened: detail_gone.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.filter.type
- tapOn:
    id: audit.menu.type.events
- extendedWaitUntil:
    notVisible:
      id: audit.menu.type
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: audit.entry.${E_GONE}
    timeout: 30000
- tapOn:
    id: audit.entry.${E_GONE}
- extendedWaitUntil:
    visible:
      id: audit.entrySheet
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-detail_gone-product
