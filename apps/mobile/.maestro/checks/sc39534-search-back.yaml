# sc-39534: on a phone, Back from an opened guest match returns to Search with the term and results kept.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'frame.search'
    timeout: 30000
- tapOn:
    id: 'frame.search'
- extendedWaitUntil:
    visible:
      id: 'search.field'
    timeout: 15000
- inputText: 'okafor'
- extendedWaitUntil:
    visible: 'Annual Gala.*'
    timeout: 15000
- takeScreenshot: results
- tapOn: 'Annual Gala.*'
- waitForAnimationToEnd
- takeScreenshot: guest
- back
- waitForAnimationToEnd
- takeScreenshot: back-once
- back
- waitForAnimationToEnd
- takeScreenshot: back-twice
