# sc-95859: on the iPad, the long day upright (its dialog) and on its side (its side panel): neither has a grabber's strip.
appId: host.exp.Exponent
env:
  DAY: '2026-11-25'
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible: '{{t:calendar.month}}'
    timeout: 30000
- tapOn: '{{t:calendar.month}}'
- extendedWaitUntil:
    visible:
      id: 'calendar.day.${DAY}'
    timeout: 30000
- tapOn:
    id: 'calendar.day.${DAY}'
- extendedWaitUntil:
    visible:
      id: 'calendar.dayDialog'
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar.dayDialog'
- assertNotVisible:
    id: 'calendar.daySheet'
- takeScreenshot: ipad-day-upright
- swipe: { start: '50%,70%', end: '50%,40%', duration: 1200 }
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar.dayDialog'
- takeScreenshot: ipad-day-upright-scrolled
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible:
      id: 'calendar.day.${DAY}'
    timeout: 30000
- tapOn:
    id: 'calendar.day.${DAY}'
- extendedWaitUntil:
    visible:
      id: 'calendar.dayPanel'
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible:
    id: 'calendar.daySheet'
- assertNotVisible:
    id: 'calendar.dayDialog'
- takeScreenshot: ipad-day-side
- setOrientation: PORTRAIT
