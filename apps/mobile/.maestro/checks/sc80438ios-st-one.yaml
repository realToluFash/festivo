# sc-80438: Check-in with one arrived, its header and count, alone so the screen mounts for this event.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV_ONE}/check-in
- extendedWaitUntil: { visible: { id: 'checkIn.search' }, timeout: 30000 }
