# sc-40664 regression: the screens built on the shared summary row (Sign-in rules, Settings, Organisation, Security), upright then on its side.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible: '{{t:settings.signInRules}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rules-upright
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible: '{{t:settings.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings-upright
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: organisation-upright
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible: '{{t:security.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-upright
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible: '{{t:settings.signInRules}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rules-side
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible: '{{t:settings.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings-side
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: organisation-side
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible: '{{t:security.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-side
- setOrientation: PORTRAIT
