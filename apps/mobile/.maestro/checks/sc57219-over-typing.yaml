# sc-57219: 501 refused on the press, field left, then typed in again: the refusal shows above the button and the keys while typing. TOKEN.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/join/${TOKEN}
- extendedWaitUntil:
    visible:
      id: requestToJoin.message
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: requestToJoin.message
- inputText: ''
- tapOn:
    id: requestToJoin.ask
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: over-left
- tapOn:
    id: requestToJoin.message
- inputText: 'bb'
- waitForAnimationToEnd
- takeScreenshot: over-typing
- assertVisible: '.*(?:Keep your message to 500|Raccourcissez votre message|Encurte a mensagem|Acorte su mensaje).*'
