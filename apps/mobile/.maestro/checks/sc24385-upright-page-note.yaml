# sc-24385, the tablet upright (the harness turns it; no setOrientation, whose PORTRAIT lays this landscape-native tablet on its side): the event's page, Details' Venue row with the arrival note under the address. Needs ${METRO_URL}, ${PLAIN}.
appId: host.exp.Exponent
---
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /portrait # the batch's reset sets Maestro's PORTRAIT, rotation 0, which lays this landscape-native tablet on its side
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events/${PLAIN}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 90000
- takeScreenshot: top
- scrollUntilVisible:
    element:
      id: 'events.arrivalNote'
    centerElement: true
    timeout: 20000
- takeScreenshot: venue
