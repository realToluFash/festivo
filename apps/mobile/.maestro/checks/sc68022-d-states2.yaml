# sc-68022: /demo/people's remaining states on a phone; an add state opens Add people over the page, so ‹ Overview is checked only where the page shows.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/people?state=addPartial
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addPartial
- openLink: ${METRO_URL}/--/demo/people?state=everyoneOn
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-everyoneOn
- openLink: ${METRO_URL}/--/demo/people?state=addOutside
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addOutside
- openLink: ${METRO_URL}/--/demo/people?state=addMobile
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addMobile
- openLink: ${METRO_URL}/--/demo/people?state=addUnusable
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addUnusable
- openLink: ${METRO_URL}/--/demo/people?state=addLeadOutside
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addLeadOutside
- openLink: ${METRO_URL}/--/demo/people?state=addMemberAddress
- waitForAnimationToEnd: { timeout: 6000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-addMemberAddress
- openLink: ${METRO_URL}/--/demo/people?state=loading
- extendedWaitUntil: { visible: '(Back to|Voltar a|Volver a|Retour à) Overview', timeout: 20000 }
- waitForAnimationToEnd: { timeout: 4000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-loading
- openLink: ${METRO_URL}/--/demo/people?state=failed
- extendedWaitUntil: { visible: '(Back to|Voltar a|Volver a|Retour à) Overview', timeout: 20000 }
- waitForAnimationToEnd: { timeout: 4000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-state-failed
