# Create an organisation, from the switcher's row.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'home.switchOrganisation'
- tapOn:
    id: 'switcher.create'
- extendedWaitUntil:
    visible: '{{t:createOrganisation.title}}'
    timeout: 30000
- takeScreenshot: create-organisation
