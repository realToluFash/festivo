# Find your time zone open, "Atlantis" typed, nothing picked, keys still up on the field. sc-18587.
appId: host.exp.Exponent
---
- runFlow:
    file: ../time-zone-typed.yaml
    env:
      QUERY: 'Atlantis'
# The text itself, so a check whose typing went nowhere fails rather than passing on its screenshot. sc-32521.
- assertVisible:
    id: 'account.zone.field'
    text: 'Atlantis'
- takeScreenshot: time-zone-atlantis-typed
