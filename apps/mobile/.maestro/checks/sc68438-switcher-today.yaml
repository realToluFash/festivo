# sc-68438: a member's switcher, opened over Today, with Events from outside under their organisations.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: home.switchOrganisation
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: home.switchOrganisation
- extendedWaitUntil:
    visible:
      id: switcher.outside
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: switcher-outside
- scrollUntilVisible:
    element:
      id: switcher.outside.${LAST}
    direction: DOWN
    timeout: 20000
- takeScreenshot: switcher-outside-foot
