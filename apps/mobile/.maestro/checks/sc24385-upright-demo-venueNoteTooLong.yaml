# sc-24385, the tablet upright (the harness turns it; no setOrientation, whose PORTRAIT lays this landscape-native tablet on its side): the app demo's event page, state venueNoteTooLong, top and one scroll, for the side-by-side pair.
appId: host.exp.Exponent
---
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /portrait # the batch's reset sets Maestro's PORTRAIT, rotation 0, which lays this landscape-native tablet on its side
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?state=venueNoteTooLong
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: top
- scroll
- waitForAnimationToEnd
- takeScreenshot: scrolled
