# sc-38005: approve a request to get back in, then the outcome on the card. Needs ${METRO_URL}; request 22222222-2222-4222-8222-222222222222 waiting.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222222.approve'
    centerElement: true
- tapOn:
    id: 'members.recovery.22222222-2222-4222-8222-222222222222.approve'
- waitForAnimationToEnd
- tapOn:
    id: 'members.recovery.turnOff'
- extendedWaitUntil:
    notVisible:
      id: 'members.recovery.turnOff'
    timeout: 30000
- waitForAnimationToEnd
- swipe:
    start: 50%, 30%
    end: 50%, 90%
- swipe:
    start: 50%, 30%
    end: 50%, 90%
- waitForAnimationToEnd
- takeScreenshot: card-after
