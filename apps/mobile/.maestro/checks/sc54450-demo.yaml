# sc-54450: the app's Guests demo, Paste a reply states, at the top, in ORIENT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/guests?state=paste
- waitForAnimationToEnd:
    timeout: 8000
- runFlow: ../developer-menu-close.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: paste
