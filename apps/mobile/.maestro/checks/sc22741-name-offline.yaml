# sc-22741: a save that cannot reach the server keeps the field open with what was typed and says so. Stop the api while it waits.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'nameCard.change'
    timeout: 30000
- tapOn:
    id: 'nameCard.change'
- extendedWaitUntil:
    visible:
      id: 'nameCard.field'
    timeout: 5000
- eraseText: 200
- inputText: 'Offline Name'
- hideKeyboard
- extendedWaitUntil:
    notVisible:
      id: 'nameCard.field'
    timeout: 40000
    optional: true
- tapOn:
    id: 'nameCard.save'
- extendedWaitUntil:
    visible: '{{t:nameCard.failed}}'
    timeout: 60000
- assertVisible:
    id: 'nameCard.field'
- assertVisible: 'Offline Name'
- takeScreenshot: offline-failed
