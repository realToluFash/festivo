# sc-5519: Edit ${GUEST_ID}; the Group picker: open, Return blank, too long, Return matching ignoring case and accents, then Create.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=guests
- extendedWaitUntil: { visible: { id: 'guests.search' }, timeout: 30000 }
- tapOn: { id: 'guests.search' }
- inputText: ${NAME}
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'guests.row.${GUEST_ID}' }, timeout: 15000 }
- tapOn: { id: 'guests.row.${GUEST_ID}' }
- extendedWaitUntil: { visible: { id: 'guest.edit' }, timeout: 20000 }
- tapOn: { id: 'guest.edit' }
- extendedWaitUntil: { visible: { id: 'guest.form.group' }, timeout: 20000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: edit-top
- tapOn: { id: 'guest.form.group' }
- extendedWaitUntil: { visible: { id: 'guest.groupPicker.field' }, timeout: 10000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-open
- tapOn: { id: 'guest.groupPicker.field' }
- pressKey: Enter
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-return-blank
- tapOn: { id: 'guest.groupPicker.field' }
- inputText: 'A group name that runs on and on well past the sixty char limit'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-too-long
- eraseText: 90
- inputText: 'bride'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-typed-match
- eraseText: 20
- inputText: "BRIDE'S SIDE"
- pressKey: Enter
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-return-matched
- tapOn: { id: 'guest.form.group' }
- extendedWaitUntil: { visible: { id: 'guest.groupPicker.field' }, timeout: 10000 }
- tapOn: { id: 'guest.groupPicker.field' }
- inputText: 'Plus ones'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: picker-create-offered
- pressKey: Enter
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: form-new-group
