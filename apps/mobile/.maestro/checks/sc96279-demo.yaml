# sc-96279: /demo/kitchen-way-in in each state, from the top, at its foot, and More (or the sidebar's person). L names the layout in the screenshots. LAND=1 turns the tablet to landscape first. Needs ${METRO_URL}, ${L}.
appId: host.exp.Exponent
---
- evalScript: "${typeof LAND !== 'undefined' && LAND ? http.get(HELPER_URL + '/landscape').body : ''}"
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/demo/kitchen-way-in?state=own_course
- extendedWaitUntil: { visible: { id: never.there }, timeout: 5000, optional: true }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: own_course-${L}-demo
- scroll
- waitForAnimationToEnd: { timeout: 2000 }
- takeScreenshot: own_course-${L}-foot-demo
- runFlow:
    when: { visible: 'More' }
    commands:
      - tapOn: 'More'
      - waitForAnimationToEnd: { timeout: 3000 }
      - takeScreenshot: own_course-${L}-more-demo
      - back
