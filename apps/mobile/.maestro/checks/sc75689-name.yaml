# sc-75689: ${EVENT_ID}'s Event name opened as Can edit, then taken off the event: Save says the event is no longer available, no Try again, what was typed stays, and a second Save says the same.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: add
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.details.name'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'events.details.name'
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.field'
    timeout: 20000
- tapOn:
    id: 'event.edit.name.field'
- inputText: ' typed'
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: remove
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil:
    visible: '{{t:eventEdit.eventGone}}'
    timeout: 15000
- assertNotVisible: '{{t:eventEdit.notSaved}}'
- assertVisible: '.* typed'
- takeScreenshot: forbidden
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil:
    visible: '{{t:eventEdit.eventGone}}'
    timeout: 15000
- assertNotVisible: '{{t:eventEdit.notSaved}}'
- takeScreenshot: forbidden-again
- runScript:
    file: ../scripts/event-gone-elsewhere.js
    env:
      ACTION: add
