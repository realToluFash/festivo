# sc-92312: Today on its side at the device's text size (set outside the flow); the live cover at the top, then one scroll. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 7000, optional: true }
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- takeScreenshot: top
- swipe: { start: '50%, 75%', end: '50%, 45%', duration: 1200 }
- waitForAnimationToEnd
- takeScreenshot: mid
