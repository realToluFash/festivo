# sc-72486: the Only our organisation Ask, opened from the domain's switch while it is off, then kept off. Pass METRO_URL and DOMAIN.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.only
    direction: DOWN
    timeout: 15000
- tapOn:
    id: emailDomains.${DOMAIN}.only
- extendedWaitUntil:
    visible:
      id: emailDomains.only.schedule
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc72486-only-ask
- tapOn:
    id: emailDomains.only.cancel
