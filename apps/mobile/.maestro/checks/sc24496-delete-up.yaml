# Delete organisation: name typed, keys up, API stopped, Delete tapped. The whole notice ends in view, keys up. sc-24496.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.delete
- tapOn:
    id: organisation.ownership.delete
- extendedWaitUntil:
    visible:
      id: organisation.delete.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.delete.name
    centerElement: true
- tapOn:
    id: organisation.delete.name
- inputText: ${ORG_NAME}
- waitForAnimationToEnd
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: organisation.delete.send
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: organisation.delete.send
- extendedWaitUntil:
    visible: '.*{{t:ownership.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertVisible: '(?i)(shift|delete)'
