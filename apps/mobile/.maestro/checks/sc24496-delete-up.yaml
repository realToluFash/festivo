# Delete organisation: name typed, keys up, API stopped, Delete tapped. The whole notice ends in view, keys up. sc-24496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: ownership.delete
- tapOn:
    id: ownership.delete
- extendedWaitUntil:
    visible:
      id: ownership.delete.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: ownership.delete.name
    centerElement: true
- tapOn:
    id: ownership.delete.name
- inputText: ${ORG_NAME}
- waitForAnimationToEnd
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: ownership.delete.send
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: ownership.delete.send
- extendedWaitUntil:
    visible: '.*{{t:ownership.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertVisible: '(?i)(shift|delete)'
