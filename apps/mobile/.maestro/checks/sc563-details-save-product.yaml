# sc-563: a managed account with nothing to join presses Continue on Your organisation and lands where an account with no organisation lands (sc-2939).
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      text: 'Managed by.*'
    timeout: 30000
- tapOn: 'Continue'
- extendedWaitUntil:
    visible:
      text: '.*not in an organisation.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc563-details-save-product
