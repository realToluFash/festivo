# sc-79559: the demo board, the iPad sidebar on its side at ${SIZE}, ${AT}, ${WAITING} waiting, in ${DLANG}.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/demo/sidebar-size?size=${SIZE}&at=${AT}&waiting=${WAITING}&lang=${DLANG}
- extendedWaitUntil: { visible: { id: never.there }, timeout: 4000, optional: true }
- waitForAnimationToEnd: { timeout: 10000 }
- takeScreenshot: d-board
