# sc-3625: the Calendar reopens after a reload on the view and month chosen last (Month, December 2026), and an event row opens its page. Needs ORIENT and EVENT, an event of the signed-in organisation on 7 November 2026.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runFlow: ../return-home.yaml
- tapOn:
    id: 'frame.calendar'
- extendedWaitUntil:
    visible:
      id: 'calendar.month'
    timeout: 30000
- tapOn:
    id: 'calendar.view.month'
- extendedWaitUntil:
    visible:
      id: 'calendar.grid'
    timeout: 20000
- runFlow: ../checks/sc3625/to-november.yaml
- tapOn:
    id: 'calendar.next'
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar.day.2026-12-09'
- assertNotVisible:
    id: 'calendar.day.2026-11-14'
- takeScreenshot: picked
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'frame.calendar'
    timeout: 30000
- tapOn:
    id: 'frame.calendar'
- extendedWaitUntil:
    visible:
      id: 'calendar.grid'
    timeout: 30000
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar.day.2026-12-09'
- assertNotVisible:
    id: 'calendar.day.2026-11-14'
- takeScreenshot: kept
- tapOn:
    id: 'calendar.previous'
- waitForAnimationToEnd
- tapOn:
    id: 'calendar.day.2026-11-07'
- extendedWaitUntil:
    visible:
      id: 'calendar.row.event-${EVENT}'
    timeout: 10000
- tapOn:
    id: 'calendar.row.event-${EVENT}'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 20000
- takeScreenshot: event-page
