# Roles, a held role's remove panel offers no Owner as the role its people move to (sc-29235). ROLE_ID names the role.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible:
      id: roles.role.owner
    timeout: 30000
- scrollUntilVisible:
    element:
      id: roles.role.${ROLE_ID}
- tapOn:
    id: roles.role.${ROLE_ID}
- scrollUntilVisible:
    element:
      id: roles.remove
- tapOn:
    id: roles.remove
- extendedWaitUntil:
    visible:
      id: roles.replacement.read_only
    timeout: 10000
- assertNotVisible:
    id: roles.replacement.owner
- takeScreenshot: role-remove-panel-no-owner
- scrollUntilVisible:
    element:
      id: roles.remove.confirm
- assertNotVisible:
    id: roles.replacement.owner
- takeScreenshot: role-remove-panel-no-owner-bottom
