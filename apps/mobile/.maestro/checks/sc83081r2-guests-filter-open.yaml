# sc-83081: an event's Guests on a tablet with its filter open, left open for a network change outside Maestro.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn: { text: '(Events|Eventos|Événements)' }
- extendedWaitUntil: { visible: { text: 'Drafts.*' }, timeout: 20000 }
- tapOn: { text: 'Drafts.*' }
- extendedWaitUntil: { visible: { text: 'Ada & Tunde wedding' }, timeout: 20000 }
- tapOn: { text: 'Ada & Tunde wedding' }
- extendedWaitUntil: { visible: { text: '(Guests|Invitados).*' }, timeout: 20000 }
- tapOn: { text: '(Guests|Invitados).*' }
- extendedWaitUntil: { visible: { id: 'guests.filter' }, timeout: 20000 }
- waitForAnimationToEnd
- tapOn: { id: 'guests.filter' }
- extendedWaitUntil: { visible: { id: 'guests.filter.menu' }, timeout: 10000 }
- waitForAnimationToEnd
- takeScreenshot: open
