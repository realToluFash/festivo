# From Today's band, open Where are you working?, close it on its scrim, and scroll Today to the band again. sc-40298.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'tab-today|frame.home'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switcher
- tapOn:
    point: '50%,78%'
- extendedWaitUntil:
    notVisible:
      id: 'switcher.heading'
    timeout: 10000
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: cover
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: band
