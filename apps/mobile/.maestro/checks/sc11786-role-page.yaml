# sc-11786: the page of the role ${ROLE_ID}, which seven people hold.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible:
      id: 'roles.role.owner'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'roles.role.${ROLE_ID}'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'roles.role.${ROLE_ID}'
- extendedWaitUntil:
    visible:
      id: 'roles.area.events.*'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: role-page
