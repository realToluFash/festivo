# sc-30894: the approve confirm at the largest text scrolls as a whole and closes. Needs ${METRO_URL}; ${REQUEST}, a request waiting.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'members.recovery.${REQUEST}.approve'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'members.recovery.${REQUEST}.approve'
- extendedWaitUntil:
    visible:
      id: 'members.recovery.ask'
    timeout: 10000
- takeScreenshot: ask-top
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 600
- takeScreenshot: ask-scrolled
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 600
- scrollUntilVisible:
    element:
      id: 'members.recovery.cancel'
    direction: DOWN
    timeout: 20000
- takeScreenshot: ask-foot
- tapOn:
    id: 'members.recovery.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'members.recovery.ask'
    timeout: 10000
- takeScreenshot: ask-closed
