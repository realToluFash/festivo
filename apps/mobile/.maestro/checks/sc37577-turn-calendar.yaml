# sc-37577: the calendar menu opened at ${FROM}, the tablet turned to ${TO} with it open: shots straight after the turn and once settled.
appId: host.exp.Exponent
---
- setOrientation: ${FROM}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible:
      id: 'calendar.show'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'calendar.show'
- extendedWaitUntil:
    visible:
      id: 'calendar.showMenu'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: before-turn
- setOrientation: ${TO}
- takeScreenshot: just-turned
- takeScreenshot: just-turned-2
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settled
