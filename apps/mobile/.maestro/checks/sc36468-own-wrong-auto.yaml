# sc-36468: own screen, wrong error, then the code goes to a text by auto; the error follows (or keeps its words).
appId: host.exp.Exponent
---
- runScript:
    file: ../sc36468-fresh-phone.js
    env:
      MODE: alt
      FAIL: '0'
- openLink: ${METRO_URL}/--/verify-phone?phone=${output.phoneId}
- extendedWaitUntil:
    visible: '{{t:verifyPhone.introWhatsApp}}'
    timeout: 30000
- tapOn:
    id: 'verifyPhone.code'
- inputText: '000000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'verifyPhone.submit'
    timeout: 10000
- tapOn:
    id: 'verifyPhone.submit'
- extendedWaitUntil:
    visible: '{{t:verifyPhone.wrongWhatsApp}}'
    timeout: 10000
- takeScreenshot: before
- extendedWaitUntil:
    visible: '{{t:verifyPhone.introFallback}}'
    timeout: 80000
- waitForAnimationToEnd
- assertVisible: '{{t:verifyPhone.wrong}}'
- assertNotVisible: '{{t:verifyPhone.wrongWhatsApp}}'
- takeScreenshot: after
