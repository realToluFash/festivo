# Add domain: example.org with the keys hidden by the back gesture (Android), refused. Keys never open. sc-9674.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.domain.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- tapOn:
    id: organisation.domain.add
- extendedWaitUntil:
    visible:
      id: organisation.domain.field
    timeout: 10000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: organisation.domain.field
      - eraseText: 80
- inputText: 'example.org'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- pressKey: back
- waitForAnimationToEnd
- takeScreenshot: keys-hidden
- assertNotVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: organisation.domain.send
    centerElement: true
- tapOn:
    id: organisation.domain.send
- extendedWaitUntil:
    visible: '(?:Add a domain your own address is at|Añada el dominio de su propia dirección|Ajoutez le domaine de votre propre adresse|Adicione o domínio do seu próprio endereço).*'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertNotVisible: '(?i)(shift|delete)'
