# sc-38005: Approve with the API stopped: the confirm's failed line, then Cancel. Needs ${METRO_URL}, ${HELPER_URL}; request 22222222-2222-4222-8222-222222222221 waiting.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222221.approve'
    centerElement: true
- tapOn:
    id: 'members.recovery.22222222-2222-4222-8222-222222222221.approve'
- waitForAnimationToEnd
- evalScript: "${http.get(HELPER_URL + '/api?to=stopped').body}"
- tapOn:
    id: 'members.recovery.turnOff'
- extendedWaitUntil:
    visible:
      id: 'members.recovery.cancel'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: failed
- evalScript: "${http.get(HELPER_URL + '/api?to=up').body}"
- tapOn:
    id: 'members.recovery.cancel'
