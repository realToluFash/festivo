# sc-3780 retest: ${EVENT_ID}'s hero and Coming up after a Reply by save, before and after the screen opens again.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: reopened
