# sc-92464: Settings at the top, one tap on the organisation pill, the switcher it opens. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil: { visible: { text: 'Organisation: .*' }, timeout: 15000 }
- runFlow: ../developer-menu-close.yaml
- takeScreenshot: before
- tapOn: { text: 'Organisation: .*' }
- waitForAnimationToEnd
- takeScreenshot: opened
