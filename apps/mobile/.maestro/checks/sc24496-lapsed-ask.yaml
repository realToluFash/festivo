# Transfer ownership, two-factor on: member chosen, password typed, Make the owner tapped, so the code step shows. The first half of the lapsed code proof. sc-24496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: ${PASSWORD}
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: organisation.transfer.send
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible:
      id: organisation.transfer.code
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: code-asked
