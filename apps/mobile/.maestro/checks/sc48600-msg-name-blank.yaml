# sc-48600: the product's nameBlank on ${EVENT_ID}. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=name
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.field'
    timeout: 30000
- tapOn:
    id: 'event.edit.name.field'
- eraseText: 120
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: nameBlank-product
- tapOn:
    id: 'event.edit.name.cancel'
- tapOn:
    id: 'event.edit.name.discard'
