# Sign-in rules, scrolled to What changed, newest first, for reading its rows.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible: '{{t:settings.signInRules}}'
    timeout: 30000
- scrollUntilVisible:
    element: '{{t:signInRules.stand.changedTitle}}'
    direction: DOWN
- takeScreenshot: sign-in-rules-changes-top
- scroll
- takeScreenshot: sign-in-rules-changes
