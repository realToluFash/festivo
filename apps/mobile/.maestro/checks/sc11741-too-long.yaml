# sc-11741: a message over 500 characters, on a working link and on one replaced since the screen opened. Pass API, TOKEN and ORG.
appId: host.exp.Exponent
---
- evalScript: "${output.link = json(http.request(API + '/api/orgs/' + ORG + '/request-link', {method: 'PUT', headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json'}, body: '{}'}).body).url.split('/join/')[1]}"
- openLink: ${METRO_URL}/--/join/${output.link}
- extendedWaitUntil:
    visible:
      id: 'requestToJoin.ask'
    timeout: 30000
- tapOn:
    id: 'requestToJoin.message'
- inputText: ''
- hideKeyboard
- tapOn:
    id: 'requestToJoin.ask'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'requestToJoin.ask'
- takeScreenshot: too-long-live
- evalScript: "${output.replaced = http.post(API + '/api/orgs/' + ORG + '/request-link/replace', {headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json'}, body: '{}'}).status}"
- assertTrue: ${output.replaced == 200}
- tapOn:
    id: 'requestToJoin.ask'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'requestToJoin.ask'
- assertNotVisible:
    id: 'requestToJoin.home'
- takeScreenshot: too-long-replaced
