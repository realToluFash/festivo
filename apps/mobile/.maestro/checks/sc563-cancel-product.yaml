# sc-563: the Owner cancels a scheduled Only our organisation; it asks nothing and the row is off again. Pass DOMAIN: a proved email domain with Only our organisation scheduled.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.only.cancel
    direction: DOWN
    timeout: 15000
# The last row cannot reach the middle: scroll to the page's end, clear of the tab bar, and back up if it overshot.
- scroll
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.only.cancel
    direction: UP
    timeout: 10000
- tapOn:
    id: emailDomains.${DOMAIN}.only.cancel
- extendedWaitUntil:
    visible:
      id: emailDomains.${DOMAIN}.only
    timeout: 15000
- scrollUntilVisible:
    element:
      id: emailDomains.card
    direction: UP
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc563-cancel-product
