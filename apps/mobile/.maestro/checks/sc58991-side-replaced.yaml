# sc-58991, tablet side by side: Replace link… → Replace link, then Link replaced {date} and its line in the details pane. Pass METRO_URL, EVENT_ID, GUEST_ID, ORIENT.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc58991/open-guest.yaml
- runFlow:
    file: ../checks/sc58991/side-down.yaml
    env:
      TARGET: guest.replace
- tapOn:
    id: 'guest.replace'
- tapOn:
    id: 'guest.replace.do'
- extendedWaitUntil:
    visible:
      id: 'guest.replaced'
    timeout: 15000
- runFlow:
    file: ../checks/sc58991/side-down.yaml
    env:
      TARGET: guest.replace
- waitForAnimationToEnd
- takeScreenshot: replaced
