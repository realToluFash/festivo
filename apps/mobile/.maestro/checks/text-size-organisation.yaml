# organisation, top to bottom, at whatever text size the simulator is set to. sc-13281.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: organisation-1
- scroll
- takeScreenshot: organisation-2
- scroll
- takeScreenshot: organisation-3
- scroll
- takeScreenshot: organisation-4
