# sc-83081 on a phone: Notifications loaded and scrolled to Show more, left there for a step outside Maestro (the stack's database stopped). Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/notifications
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 30000 }
- extendedWaitUntil: { visible: { id: 'notifications\.item\..*' }, timeout: 20000 }
- scrollUntilVisible:
    { element: { id: 'notifications.showMore' }, timeout: 30000, centerElement: true }
- waitForAnimationToEnd
- takeScreenshot: at-show-more
