# sc-1593: the events of the organisation ${ORG}, in order, at the orientation given.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 30000
- tapOn:
    id: 'home.switchOrganisation'
- scrollUntilVisible:
    element:
      id: 'switcher.${ORG}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'switcher.${ORG}'
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.row.${EVENT}'
    timeout: 30000
- takeScreenshot: list
- scroll
- takeScreenshot: list-scrolled
