# sc-49861: ${EVENT_ID}'s Event name opened as Can edit, then the role is Can view: Save says the role's refusal, no Try again, what was typed stays, and a second Save says the same.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.details.name'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'events.details.name'
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.field'
    timeout: 20000
- tapOn:
    id: 'event.edit.name.field'
- inputText: ' typed'
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_view
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil:
    visible: 'Nothing was changed. Your role does not include the permission this needs.'
    timeout: 15000
- assertNotVisible: '.*Try again.*'
- assertVisible: '.* typed'
- takeScreenshot: forbidden
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil:
    visible: 'Nothing was changed. Your role does not include the permission this needs.'
    timeout: 15000
- assertNotVisible: '.*Try again.*'
- takeScreenshot: forbidden-again
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
