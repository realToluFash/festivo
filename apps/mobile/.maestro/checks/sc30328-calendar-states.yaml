# sc-30328: the 14 Calendar demo states sc-30328 covers, one screenshot each, for side-by-side with Calendar-B-Lanes-*.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/demo/calendar?state=populated
- waitForAnimationToEnd:
    timeout: 6000
- runFlow: ../developer-menu-close.yaml
- extendedWaitUntil:
    visible:
      id: 'org.switch'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: populated
