# sc-30413: each product screen beside the app demo's route, for the side-by-side pairs.
# Each step waits for words only the new screen has, so a slow route never pairs with the last one.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible: 'This week'
    timeout: 20000
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: today-product
- openLink: ${METRO_URL}/--/demo/today
- extendedWaitUntil:
    visible: 'Good morning.*'
    timeout: 20000
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: today-demo
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible: '.*happening now.*'
    timeout: 20000
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: events-upcoming-product
- openLink: ${METRO_URL}/--/demo/events
- extendedWaitUntil:
