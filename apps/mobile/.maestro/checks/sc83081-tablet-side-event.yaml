# sc-83081, the tablet on its side: an event's page (EVENT) open, its bell to be tapped outside Maestro. Needs ${METRO_URL}, EVENT.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events/${EVENT}
- extendedWaitUntil: { visible: { id: 'events.page' }, timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: event
