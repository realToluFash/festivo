# sc-4015: the app demo's Kitchen station, state refusedNone, top and one scroll, for the side-by-side pair.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/kitchen-station?state=refusedNone
