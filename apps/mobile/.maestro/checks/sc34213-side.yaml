# sc-34213, a tablet on its side (ORIENT as in sc31724-side-*): after saving Oluwafolakemi Bello the page's card, the Settings list's card and the sidebar's foot all say OB and no Folake Adeyemi or FA is left; then Cher and C. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/demo/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.name'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: before
- tapOn:
    id: 'account.name'
- extendedWaitUntil:
    visible:
      id: 'account.name.field'
    timeout: 10000
- eraseText: 120
- inputText: 'Oluwafolakemi Bello'
- tapOn:
    id: 'account.name.save'
- extendedWaitUntil:
    notVisible:
      id: 'account.name.screen'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'Oluwafolakemi Bello'
- assertVisible: 'OB'
- assertNotVisible: 'Folake Adeyemi'
- assertNotVisible: 'FA'
- takeScreenshot: saved-ob
- tapOn:
    id: 'account.name'
- extendedWaitUntil:
    visible:
      id: 'account.name.field'
    timeout: 10000
- eraseText: 120
- inputText: 'Cher'
- tapOn:
    id: 'account.name.save'
- extendedWaitUntil:
    notVisible:
      id: 'account.name.screen'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'Cher'
- assertVisible: 'C'
- assertNotVisible: 'Oluwafolakemi Bello'
- assertNotVisible: 'OB'
- assertNotVisible: 'Folake Adeyemi'
- takeScreenshot: saved-c
