# sc-611: an entry opened: detail.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.filter.type
- tapOn:
    id: audit.menu.type.event_access
- extendedWaitUntil:
    notVisible:
      id: audit.menu.type
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: audit.entry.${E_DETAIL}
    centerElement: true
    timeout: 30000
- tapOn:
    id: audit.entry.${E_DETAIL}
- extendedWaitUntil:
    visible:
      id: audit.detail.when
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-detail-product
