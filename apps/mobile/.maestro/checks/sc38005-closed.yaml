# sc-38005: the request is answered elsewhere while the Approve confirm is open: the closed sheet and its Close. Needs ${METRO_URL}, ${API_URL}, ${TOKEN}; request 22222222-2222-4222-8222-222222222222 waiting.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.recovery.22222222-2222-4222-8222-222222222222.approve'
    centerElement: true
- tapOn:
    id: 'members.recovery.22222222-2222-4222-8222-222222222222.approve'
- waitForAnimationToEnd
# Somebody else answers first: the owner, through the API, with the TOKEN the batch passes.
- evalScript: "${http.post(API_URL + '/api/auth/recovery-requests/22222222-2222-4222-8222-222222222222/turn-down', {headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json'}, body: '{}'}).status}"
- tapOn:
    id: 'members.recovery.turnOff'
- extendedWaitUntil:
    visible:
      id: 'members.recovery.close'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: closed
- tapOn:
    id: 'members.recovery.close'
- waitForAnimationToEnd
- takeScreenshot: after-close
