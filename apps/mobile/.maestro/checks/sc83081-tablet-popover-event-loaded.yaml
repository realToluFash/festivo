# sc-83081 on a tablet at its current orientation: the bell's popover opened from an event's page (EVENT) and loaded, left open for a step outside Maestro (a network or stack change). Needs ${METRO_URL}, EVENT and EVENT_BELL (the bell's point).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}
- extendedWaitUntil: { visible: { id: 'events.page' }, timeout: 20000 }
- waitForAnimationToEnd
- tapOn: { point: '${EVENT_BELL}' }
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 20000 }
- extendedWaitUntil: { visible: { id: 'notifications\.item\..*' }, timeout: 20000 }
- waitForAnimationToEnd
- takeScreenshot: loaded
