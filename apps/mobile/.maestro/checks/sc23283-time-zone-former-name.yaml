# sc-23283: Time zone found by a former city name (Calcutta), then a no-match search, then Cancel and Discard back to Your account.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.name'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'account.zone'
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: time-zone-value
- tapOn:
    id: 'account.zone'
- tapOn:
    id: 'account.zone.field'
- inputText: 'Calcutta'
- extendedWaitUntil:
    visible:
      id: 'account.zone.Asia/Kolkata'
    timeout: 10000
- takeScreenshot: time-zone-calcutta
- eraseText: 30
- inputText: 'Qqzzx'
- extendedWaitUntil:
    notVisible:
      id: 'account.zone.Asia/Kolkata'
    timeout: 10000
- takeScreenshot: time-zone-no-match
- tapOn:
    id: 'account.zone.cancel'
# Typed text makes Cancel ask before it discards it.
- extendedWaitUntil:
    visible:
      id: 'account.zone.discard'
    timeout: 5000
- tapOn:
    id: 'account.zone.discard'
- extendedWaitUntil:
    visible:
      id: 'account.zone'
    timeout: 10000
- assertNotVisible:
    id: 'account.zone.screen'
