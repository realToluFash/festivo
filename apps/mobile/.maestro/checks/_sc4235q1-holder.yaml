# sc-4235 (qa1): a full code's holder (08034440721, already in at CAP) signs back in after Continue and lands on You're in; then a verified alternative number (08034440702) at CODE comes back to the event step with everything kept. Run after _sc4235q1-again. Pass CODE, CAP.
appId: host.exp.Exponent
---
- runFlow: ../batch/sign-out.yaml
- openLink: ${METRO_URL}/--/d/${CAP}
- extendedWaitUntil:
    visible:
      id: 'redeem.event.send'
    timeout: 30000
- runFlow:
    file: sc4235/fill.yaml
    env: { NAME: 'Cap Holder', NUMBER: '08034440721' }
- runFlow:
    file: sc4235/code.yaml
    env: { DIGITS: '4440721' }
- extendedWaitUntil:
    visible:
      id: 'redeem.in.open'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 01-holder-back-in
- runFlow:
    file: sc4235/_q1-out.yaml
    env: { SHOT: '02-signed-out' }
- tapOn:
    id: 'redeem.enter.code'
- inputText: ${CODE}
- hideKeyboard
- tapOn:
    id: 'redeem.enter.continue'
- extendedWaitUntil:
    visible:
      id: 'redeem.event.send'
    timeout: 20000
- runFlow:
    file: sc4235/fill.yaml
    env: { NAME: 'Rita Alt', NUMBER: '08034440702' }
- runFlow:
    file: sc4235/code.yaml
    env: { DIGITS: '4440702' }
- extendedWaitUntil:
    visible:
      id: 'redeem.event.number'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 03-alternative-keyboard
- tapOn: 'Kemi and Tayo'
- takeScreenshot: 04-alternative
