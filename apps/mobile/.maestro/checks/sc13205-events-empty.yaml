# sc-13205: ${ORG}, an organisation with no events, for a role that can create them.
appId: host.exp.Exponent
---
- runFlow:
    file: ../switch-organisation.yaml
    env:
      ORG: ${ORG}
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.none.new'
    timeout: 30000
- takeScreenshot: empty
