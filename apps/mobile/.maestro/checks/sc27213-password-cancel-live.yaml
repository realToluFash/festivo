# sc-27213: after a Cancel tapped right after Current password, the step is closed, or still open with a Cancel that closes it on the next tap. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'password.change'
- extendedWaitUntil:
    visible:
      id: 'password.current'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'password.current'
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- tapOn:
    id: 'password.cancel'
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: after-first-cancel
- tapOn:
    id: 'password.cancel'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: after-second-cancel
- tapOn:
    id: 'password.cancel'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: after-third-cancel
- assertVisible:
    id: 'password.change'
