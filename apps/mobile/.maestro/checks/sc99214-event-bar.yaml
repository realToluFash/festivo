# sc-99214: an event's phone bar at whatever width and text size the device has: Overview, then each tab with one tap, then More's sheet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV}
- extendedWaitUntil:
    visible:
      id: event.nav.more
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: overview
- tapOn:
    id: event.nav.guests
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: guests
- runFlow:
    when:
      visible:
        id: event.nav.menu
    commands:
      - tapOn:
          id: event.nav.menu
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: menu
- runFlow:
    when:
      visible:
        id: event.nav.messages
    commands:
      - tapOn:
          id: event.nav.messages
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: messages
- tapOn:
    id: event.nav.more
- extendedWaitUntil:
    visible:
      id: event.nav.moreSheet
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: more
