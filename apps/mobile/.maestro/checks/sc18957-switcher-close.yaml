# Your organisations closes on a tap on the scrim, read as Close. sc-18957.
# The tap is on the side margin, as in return-home.yaml: the top edge is the status bar, and on an iPad a full card reaches above 8%.
appId: host.exp.Exponent
---
- tapOn:
    id: 'frame.organisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '{{t:switcher.close}}'
- tapOn:
    point: '3%,50%'
- extendedWaitUntil:
    notVisible:
      id: 'switcher.heading'
    timeout: 10000
- takeScreenshot: closed
- runFlow: ../open-create-organisation.yaml
- takeScreenshot: create-sheet
