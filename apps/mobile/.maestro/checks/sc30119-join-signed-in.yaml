# sc-30119: a join link opened signed in: Ask to join and the message field's label. Pass LINK, the token after /join/.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/join/${LINK}
- extendedWaitUntil:
    visible:
      id: requestToJoin.ask
    timeout: 30000
- scrollUntilVisible:
    element:
      id: requestToJoin.message
    centerElement: true
- takeScreenshot: join-signed-in
