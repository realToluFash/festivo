# sc-23267, the tablet in landscape: Create an organisation from the switcher opens, Cancel, with nothing entered, closes it, and it opens and closes again.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- takeScreenshot: reopen-first-open
- tapOn:
    id: 'createWalk.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- takeScreenshot: reopen-closed
- runFlow: ../open-create-organisation.yaml
- assertVisible:
    id: 'createWalk.name'
- takeScreenshot: reopen-second-open
- tapOn:
    id: 'createWalk.cancel'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- setOrientation: PORTRAIT
