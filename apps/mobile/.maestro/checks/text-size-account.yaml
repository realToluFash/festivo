# account, top to bottom, at whatever text size the simulator is set to. sc-13281.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: account-1
- scroll
- takeScreenshot: account-2
- scroll
- takeScreenshot: account-3
- scroll
- takeScreenshot: account-4
