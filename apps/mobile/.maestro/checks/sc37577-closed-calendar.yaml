# sc-37577: the calendar screen at ${ORIENT}, its menu shut, for measuring its button.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible:
      id: 'calendar.show'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: closed-calendar
