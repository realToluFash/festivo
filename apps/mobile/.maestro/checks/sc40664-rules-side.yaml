# sc-40664: Sign-in rules on a tablet (side): Where you stand, then What changed, each title whole.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible: '{{t:settings.signInRules}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: rules-side
- scrollUntilVisible:
    element: '{{t:signInRules.stand.changedTitle}}'
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: rules-side-changes
- setOrientation: PORTRAIT
