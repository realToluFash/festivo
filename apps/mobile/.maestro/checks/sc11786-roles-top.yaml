# sc-11786: a role's page scrolled to its foot, back with Roles, then New role opens at its top.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible:
      id: 'roles.role.owner'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'roles.role.${ROLE_ID}'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'roles.role.${ROLE_ID}'
- extendedWaitUntil:
    visible:
      id: 'roles.area.events.*'
    timeout: 15000
- repeat:
    while:
      notVisible:
        id: 'roles.remove'
    times: 10
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 25%
- takeScreenshot: role-foot
- tapOn:
    id: 'frame.back'
- extendedWaitUntil:
    visible:
      id: 'roles.role.owner'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'roles.new'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'roles.new'
- extendedWaitUntil:
    visible:
      id: 'roles.name'
    timeout: 15000
- takeScreenshot: role-new-top
