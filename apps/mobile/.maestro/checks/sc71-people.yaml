# sc-71: People on the event, the outside tag and the pending rows, then the outsider's role sheet. Needs ${ORIENT}, ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=people
- extendedWaitUntil: { visible: { id: 'people.row.*' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: people
- tapOn: { text: '.*bisi@lagoslights\.example.*' }
- extendedWaitUntil: { visible: { id: 'people.roleSheet' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: roleSheet
- tapOn: { id: 'people.remove' }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: remove
