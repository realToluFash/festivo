# In landscape: lands from Set a new password on whichever step the account owes (Your organisation, You're invited, or the one-offer step) and pictures Password changed against the step's foot, keys up and down. sc-37983.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN_ORG}
- extendedWaitUntil: { visible: { id: 'recovery.password' }, timeout: 30000 }
- tapOn: { id: 'recovery.password' }
- inputText: 'a-brand-new-password-37983'
- tapOn: { id: 'recovery.save' }
- extendedWaitUntil: { visible: '{{t:any:recovery.changed}}', timeout: 30000 }
- takeScreenshot: orgl-01-first
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: orgl-02-settled
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2000, optional: true }
- takeScreenshot: orgl-02b-landscape-keys-up
- tapOn: { id: 'completeProfile.organisation' }
- inputText: 'Acme'
- takeScreenshot: orgl-02c-landscape-typed
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: orgl-03-keys-down
- assertVisible: '{{t:any:recovery.changed}}'
- tapOn: '{{t:any:toast.close}}'
- takeScreenshot: orgl-04-closed
- setOrientation: PORTRAIT
- runFlow: ../sign-out-from-complete-profile.yaml
