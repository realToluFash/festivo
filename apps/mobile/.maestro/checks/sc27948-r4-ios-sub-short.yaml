# sc-27948 retest r4: on the phone, a slow strip drag short of half springs Subscribe back; a drag lower scrolls its body and leaves the sheet in place; a drag up does not raise it, so its strip still closes it from where it was.
appId: host.exp.Exponent
---
- runFlow: sc27948/open-subscribe.yaml
- swipe:
    start: '201,72'
    end: '201,260'
    duration: 2000
- waitForAnimationToEnd
- takeScreenshot: after-short
- assertVisible:
    id: 'calendarFeed.close'
- swipe:
    start: '201,750'
    end: '201,150'
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: after-body-scroll
- assertVisible:
    id: 'calendarFeed.reset'
- assertVisible:
    id: 'calendarFeed.panel'
- swipe:
    start: '201,90'
    end: '201,20'
    duration: 1500
- waitForAnimationToEnd
- takeScreenshot: after-up
- assertVisible:
    id: 'calendarFeed.panel'
- swipe:
    start: '201,72'
    end: '201,820'
    duration: 3000
- waitForAnimationToEnd
- assertNotVisible:
    id: 'calendarFeed.panel'
