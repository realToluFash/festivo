# sc-22103: opened from Happening now, now the top of Upcoming (sc-30413), All dates, two areas, Back to Overview, Back to Events still on Upcoming. Needs ${METRO_URL}, ${NOW}.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc22103/to-upcoming.yaml
- scrollUntilVisible:
    element:
      id: 'events.now.${NOW}'
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.now.${NOW}'
- runFlow: ../checks/sc22103/alldates-areas-back.yaml
- extendedWaitUntil:
    notVisible:
      id: 'events.page'
    timeout: 15000
- takeScreenshot: landed
- scrollUntilVisible:
    element:
      id: 'events.now.${NOW}'
    direction: UP
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: 'events.page'
- takeScreenshot: back-events-upcoming
