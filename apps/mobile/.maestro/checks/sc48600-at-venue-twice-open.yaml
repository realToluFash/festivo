# sc-48600: a ?at=venue link arriving while that same Venue edit is already open leaves the Venue edit open, with no error. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 20000
- assertNotVisible: '.*Render Error.*'
- takeScreenshot: at-venue-twice-open
- tapOn:
    id: 'event.edit.venue.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: at-venue-twice-closed
