# sc-72486: the page of the member ${M3}, for the Also a member of line (1500 other organisations). Pass METRO_URL and M3.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.card'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.row.${M3}'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'members.row.${M3}'
- waitForAnimationToEnd
- takeScreenshot: sc72486-member-1500
