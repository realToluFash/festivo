# sc-88028: a request link opened signed out, the title under the tile at the current text size. Pass LINK. Signs out: run it last.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- openLink: ${METRO_URL}/--/join/${LINK}
- extendedWaitUntil:
    visible:
      id: 'requestToJoin.close'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: sc88028-join-signed-out-top
- scrollUntilVisible:
    element:
      id: 'requestToJoin.signIn'
    direction: DOWN
    timeout: 30000
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: sc88028-join-signed-out-ways-in
- swipe:
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: sc88028-join-signed-out-foot
