# sc-49445: Members' card sentence and People filter trigger, menu closed, at the current orientation.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: members.filter
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: trigger
