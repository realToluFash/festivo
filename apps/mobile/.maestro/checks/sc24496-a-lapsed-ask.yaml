# Android: Transfer ownership, two-factor on, Make the owner swiped above the keys by hand and tapped, so the code step shows. The first half of the lapsed code proof. sc-24496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
    timeout: 60000
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: ${PASSWORD}
- waitForAnimationToEnd
- swipe:
    start: 50%, 44%
    end: 50%, 23%
    duration: 600
- swipe:
    start: 50%, 44%
    end: 50%, 23%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible:
      id: organisation.transfer.code
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: code-asked
