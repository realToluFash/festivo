# sc-28122: Change password, tap current password, keys up: Save new password and Cancel above the keys; Cancel with keys up closes to Change password, five in five. Show tapped on both first, as iOS hides a secure field's keys from screenshots. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'password.change'
      - waitForAnimationToEnd:
          timeout: 3000
      - scrollUntilVisible:
          element:
            id: 'password.current'
          direction: UP
          timeout: 10000
      - tapOn:
          id: 'password.current.reveal'
      - tapOn:
          id: 'password.new.reveal'
      - waitForAnimationToEnd:
          timeout: 1000
      - tapOn:
          id: 'password.current'
      - inputText: 'shown'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: pw-current-keys-up
      - tapOn:
          id: 'password.cancel'
          waitToSettleTimeoutMs: 0
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: pw-current-after-cancel
      - assertNotVisible:
          id: 'password.cancel'
      - assertVisible:
          id: 'password.change'
