# Notifications on an iPad on its side, opened by link (a tap on the bell on its side lands on Expo Go's tools button): the band after a refused Mark all read, then Refreshing… while Try again is held (sc-27096). Needs unread items. The harness stops and holds the API, and pictures the held moment (/shot), through batch/helper.js.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- setOrientation: LANDSCAPE_RIGHT
- openLink: ${METRO_URL}/--/notifications
- extendedWaitUntil:
    visible:
      id: notifications.markAllRead
    timeout: 30000
- runFlow: ../developer-menu-close.yaml
- runFlow:
    when:
      visible:
        id: notifications.pushAsk.notNow
    commands:
      - tapOn:
          id: notifications.pushAsk.notNow
- waitForAnimationToEnd
- takeScreenshot: side-online
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: notifications.markAllRead
- extendedWaitUntil:
    visible:
      id: offline.band
    timeout: 25000
- takeScreenshot: side-band
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- tapOn:
    id: offline.retry
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /shot?name=held-1
- takeScreenshot: side-refreshing
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /shot?name=held-2
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    notVisible:
      id: offline.band
    timeout: 25000
- takeScreenshot: side-after
- setOrientation: PORTRAIT
