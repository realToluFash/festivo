# sc-49805: ${GUEST_ID}'s Edit, the Needs section opened to Allergies (Lupin ticked) and Diet (Halal, Kosher).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=guests
- extendedWaitUntil:
    visible:
      id: 'guests.row.${GUEST_ID}'
    timeout: 30000
- tapOn:
    id: 'guests.row.${GUEST_ID}'
- extendedWaitUntil:
    visible:
      id: 'guest.edit'
    timeout: 20000
- tapOn:
    id: 'guest.edit'
- extendedWaitUntil:
    visible:
      id: 'guest.form.fullName'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'guest.form.needs.toggle'
    direction: DOWN
- tapOn:
    id: 'guest.form.needs.toggle'
- scrollUntilVisible:
    element:
      id: 'guest.form.needs.allergies'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: form-allergies
- scrollUntilVisible:
    element:
      id: 'guest.form.needs.diet'
    direction: DOWN
    centerElement: true
- takeScreenshot: form-diet
- back
- back
