# sc-29152: the design demo's Settings in B Confetti, /security. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/security
- extendedWaitUntil:
    visible:
      text: 'Two-factor authentication'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: security
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: security-scrolled
