# sc-49170: Members opened by its link at the organisation's size; what shows 3 s and 15 s after the title shows (measured from the title, not from the link opening).
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible: '{{t:membersScreen.title}}'
    timeout: 30000
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 3000, optional: true }
- takeScreenshot: open-3s
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 12000, optional: true }
- takeScreenshot: open-15s
