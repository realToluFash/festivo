# Choose a password: keys hidden (dismiss), Save password tapped with the API stopped, refused. Keys stay down. sc-13408.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.code.field'
    timeout: 15000
- runScript:
    file: ../scripts/latest-code.js
- tapOn:
    id: 'security.code.field'
- inputText: ${output.code}
- tapOn:
    id: 'security.code.continue'
- extendedWaitUntil:
    visible:
      id: 'security.choose.password'
    timeout: 15000
- tapOn:
    id: 'security.choose.password'
- inputText: 'a-long-new-password-2026'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: keys-hidden
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'security.choose.save'
- waitForAnimationToEnd
- takeScreenshot: at-tap
- assertNotVisible: '(?i)(shift|delete)'
- extendedWaitUntil:
    visible: '{{t:passwordCard.failedBody}}'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertNotVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
