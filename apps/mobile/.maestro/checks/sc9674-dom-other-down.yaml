# Add domain: example.org with the keys hidden, refused. Keys never open. sc-9674.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: companyDomains.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- repeat:
    times: 3
    commands:
      - tapOn:
          id: companyDomains.domain
      - eraseText: 80
- inputText: 'example.org'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- tapOn:
    point: '2%,45%'
- waitForAnimationToEnd
- takeScreenshot: keys-hidden
- assertNotVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: companyDomains.add
    centerElement: true
- tapOn:
    id: companyDomains.add
- extendedWaitUntil:
    visible: 'Add a domain your own address is at.*'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertNotVisible: '(?i)(shift|delete)'
