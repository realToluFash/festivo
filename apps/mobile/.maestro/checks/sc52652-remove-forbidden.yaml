# sc-52652: an event with a cover; Remove photo, then the role drops to Can view: Use this photo's refusal shows in the top notice, not beside Upload a photo.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
- runFlow: sc52652/open.yaml
- scrollUntilVisible:
    element:
      id: 'event.edit.cover.remove'
    direction: DOWN
- tapOn:
    id: 'event.edit.cover.remove'
- extendedWaitUntil:
    visible:
      id: 'event.edit.cover.upload'
    timeout: 10000
- takeScreenshot: removed
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_view
- tapOn:
    id: 'event.edit.cover.save'
- scrollUntilVisible:
    element: '{{t:eventEdit.forbidden}}'
    direction: UP
    timeout: 15000
- assertVisible:
    id: 'event.edit.cover.upload'
- takeScreenshot: removed-forbidden
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
