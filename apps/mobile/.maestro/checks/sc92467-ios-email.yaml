# sc-92467 regression: email opens with keys up and takes typing with no tap.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.email.add'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'account.email.add'
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'account.email.add'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: opened
- inputText: 'qa3x@soirely.test'
- takeScreenshot: typed
