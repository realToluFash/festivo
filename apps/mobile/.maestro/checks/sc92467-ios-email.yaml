# sc-92467, iPhone and iPad: Add email opens with the keys up and takes typing with no tap, first opening only. The short form of sc91027-email.yaml for the iOS pass of this story; that check holds the Cancel and Discard openings. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible:
      id: 'account.email.add'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'account.email.add'
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'account.email.add'
- extendedWaitUntil:
    visible:
      id: 'account.email.add.field'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: opened
- inputText: 'qa3x@soirely.test'
- assertVisible:
    id: 'account.email.add.field'
    text: '.*qa3x@soirely\.test.*'
- takeScreenshot: typed
