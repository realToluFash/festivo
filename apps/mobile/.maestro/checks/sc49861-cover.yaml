# sc-49861: ${EVENT_ID}'s Cover photo opened as Can edit, a photo picked and uploaded, then the role is Can view: Use this photo says the role's refusal, no Try again, the picked photo stays, and a second press says the same.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.details.cover'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'events.details.cover'
- extendedWaitUntil:
    visible:
      id: 'event.edit.cover.upload'
    timeout: 20000
- tapOn:
    id: 'event.edit.cover.upload'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'never.there'
    timeout: 3000
    optional: true
- takeScreenshot: picker
- tapOn:
    point: '16%,61%'
- extendedWaitUntil:
    visible:
      id: 'event.edit.cover.change'
    timeout: 30000
- extendedWaitUntil:
    visible: 'never.there'
    timeout: 4000
    optional: true
- takeScreenshot: picked
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_view
- tapOn:
    id: 'event.edit.cover.save'
- extendedWaitUntil:
    visible: 'Nothing was changed. Your role does not include the permission this needs.'
    timeout: 15000
- assertNotVisible: '.*Try again.*'
- assertVisible:
    id: 'event.edit.cover.change'
- takeScreenshot: forbidden
- tapOn:
    id: 'event.edit.cover.save'
- extendedWaitUntil:
    visible: 'Nothing was changed. Your role does not include the permission this needs.'
    timeout: 15000
- assertNotVisible: '.*Try again.*'
- takeScreenshot: forbidden-again
- runScript:
    file: ../scripts/event-role-elsewhere.js
    env:
      ROLE: can_edit
