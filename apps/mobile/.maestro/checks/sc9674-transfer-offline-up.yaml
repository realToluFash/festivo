# Transfer ownership with the API stopped and the keys up: the error shows, keys stay up. sc-9674.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.ownership.transfer
    centerElement: true
- tapOn:
    id: organisation.ownership.transfer
- scrollUntilVisible:
    element:
      id: organisation.transfer.${MEMBER}
    centerElement: true
- tapOn:
    id: organisation.transfer.${MEMBER}
- scrollUntilVisible:
    element:
      id: organisation.transfer.password
    centerElement: true
- tapOn:
    id: organisation.transfer.password
- inputText: not-my-password
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: organisation.transfer.send
    centerElement: true
- tapOn:
    id: organisation.transfer.send
- extendedWaitUntil:
    visible: '.*{{t:ownership.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertVisible: '(?i)(shift|delete)'
