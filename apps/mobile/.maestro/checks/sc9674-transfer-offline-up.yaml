# Transfer ownership with the API stopped and the keys up: the error shows, keys stay up. sc-9674.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: ownership.transfer
    centerElement: true
- tapOn:
    id: ownership.transfer
- scrollUntilVisible:
    element:
      id: ownership.owner.${MEMBER}
    centerElement: true
- tapOn:
    id: ownership.owner.${MEMBER}
- scrollUntilVisible:
    element:
      id: ownership.password
    centerElement: true
- tapOn:
    id: ownership.password
- inputText: not-my-password
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: ownership.transfer.send
    centerElement: true
- tapOn:
    id: ownership.transfer.send
- extendedWaitUntil:
    visible: '.*{{t:ownership.failed}}.*'
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: refused
- assertVisible: '(?i)(shift|delete)'
