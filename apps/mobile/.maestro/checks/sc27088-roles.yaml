# sc-27088, Android only: Settings > roles shows the offline band, the automatic reread is given up with the band still up, Try again's own load shows Refreshing…, then the band goes once Soirely answers.
appId: host.exp.Exponent
---
- runFlow:
    file: ../checks/sc27088/band-refreshing.yaml
    env:
      SCREEN: roles
      REFRESHING: 'roles.refreshing'
- assertVisible:
    id: 'roles.new'
- takeScreenshot: reloaded
