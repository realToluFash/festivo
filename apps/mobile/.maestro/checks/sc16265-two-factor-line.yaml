# Settings > Organisation, read-only under the two-factor rule alone: its line and Turn on two-factor, no role line.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:orgGeneral.intro}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.turnOn'
    timeout: 20000
- takeScreenshot: sc16265-two-factor-line
- assertNotVisible:
    id: 'organisation.link'
- assertNotVisible:
    id: 'organisation.save'
- assertNotVisible: 'Your role.*'
