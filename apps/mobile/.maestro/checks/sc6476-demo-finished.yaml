# sc-6476: the app's design demo in state finished, the demo half of its side-by-side pair. Needs ${METRO_URL}, ${ORIENT}, ${HELPER_URL}, ${ROT} (the harness path `/portrait` or `/landscape`, agreeing with ORIENT).
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runScript:
    file: ../batch/helper.js
    env:
      ASK: ${ROT}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4?state=finished
- extendedWaitUntil:
    visible:
      id: 'event.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'event.thankYou'
    timeout: 8000
- takeScreenshot: demo-finished
