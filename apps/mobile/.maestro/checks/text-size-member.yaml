# member, top to bottom, at whatever text size the simulator is set to. sc-13281.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible: '{{t:membersScreen.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'members.row.*'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'members.row.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'members.person.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: member-1
- scroll
- takeScreenshot: member-2
- scroll
- takeScreenshot: member-3
- scroll
- takeScreenshot: member-4
