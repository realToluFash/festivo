# sc-48825: Members' card and its faces' chip (LANDSCAPE_LEFT), for the product beside its demo.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible: '{{t:membersScreen.title}}'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*(people|personnes|personas|pessoas).*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: members-chip
