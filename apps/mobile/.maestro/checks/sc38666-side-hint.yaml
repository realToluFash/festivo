# sc-38666: on a phone on its side, keys up, a name typed: one short swipe down the strip shows the hint under the field's left edge, then the next shows Continue.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- runFlow: ../open-create-organisation.yaml
- inputText: 'Lagos Supper Club'
- swipe: { start: '50%, 33%', end: '50%, 28%', duration: 600 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: h01-one-swipe
- swipe: { start: '50%, 33%', end: '50%, 28%', duration: 600 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: h02-two-swipes
- tapOn: { id: 'createWalk.cancel', optional: true }
- setOrientation: PORTRAIT
