# The app demo's switcher, managed with two invitations, closed then listed then each opened. sc-73668.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/demo/today?switcher=managed-listed
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: demo-listed
- tapOn:
    id: 'switcher.tile.*celebraciones.*|switcher.tile.*alameda.*'
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: demo-celebraciones
