# The night in the app, on an event of ${EV} with nothing on and Start now on Next, a second track over, then presses with the API stopped: waiting 1 and 2, Reconnecting at a minute, and the replay on Try now (sc-59333). Run once per language, each with its own event, since the presses change it.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/events/${EV}/night
- extendedWaitUntil:
    visible:
      id: night.next
    timeout: 30000
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- takeScreenshot: start-top
- scroll
- takeScreenshot: start-later
- scrollUntilVisible:
    element:
      id: night.picker
    direction: UP
- tapOn:
    id: night.picker
- tapOn: 'Jardin'
- waitForAnimationToEnd
- takeScreenshot: jardin-over
- tapOn:
    id: night.picker
- tapOn: 'Salle principale'
- waitForAnimationToEnd
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'night\.start\..*'
- waitForAnimationToEnd
- takeScreenshot: offline-waiting1
- tapOn:
    id: 'night\.done\..*'
- waitForAnimationToEnd
- takeScreenshot: offline-waiting2
- extendedWaitUntil:
    visible: '.*(1 min old|hace 1 min|il y a 1 min|há 1 min).*'
    timeout: 120000
- takeScreenshot: offline-reconnecting
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- tapOn:
    id: night.try
    optional: true
- waitForAnimationToEnd
- takeScreenshot: back-online
