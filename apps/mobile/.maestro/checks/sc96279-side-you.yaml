# sc-96279: on the tablet on its side, ${EVENT_ID}'s sidebar person button (the account's name) opens Your account and Sign out. P prefixes the screenshots. Needs ${METRO_URL}, ${EVENT_ID}, ${P}.
appId: host.exp.Exponent
---
- evalScript: "${http.get(HELPER_URL + '/landscape').body}"
- waitForAnimationToEnd: { timeout: 3000 }
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil: { visible: { id: 'outside.overview' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { text: 'QA Tester', index: 0 }
- extendedWaitUntil: { visible: { id: 'frame.side.you' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${P}-you
