# sc-1404: the run view for an event on a phone or tablet: the top, then each track the segmented control picks.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}/run
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 9000, optional: true }
- waitForAnimationToEnd
- takeScreenshot: run-top
- tapOn: { text: 'Main hall', optional: true }
- waitForAnimationToEnd
- takeScreenshot: main-hall
- scroll
- takeScreenshot: main-hall-2
- scroll
- takeScreenshot: main-hall-3
- scrollUntilVisible: { element: { text: 'Studio' }, direction: UP, timeout: 10000, optional: true }
- tapOn: { text: 'Studio', optional: true }
- waitForAnimationToEnd
- takeScreenshot: studio
- tapOn: { text: 'Garden.*', optional: true }
- waitForAnimationToEnd
- takeScreenshot: garden
- scroll
- takeScreenshot: garden-2
