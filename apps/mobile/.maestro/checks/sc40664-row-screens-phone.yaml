# sc-40664 regression, on a phone: the screens built on the shared summary row (Sign-in rules, Settings, Organisation, Security), upright then on its side.
# A phone shows no side list, and Sign out and the device list sit below the fold, so Settings is waited on by its account card and Security by its card's title (the account has two-factor off).
appId: host.exp.Exponent
---
# ${UPRIGHT} then ${SIDE}: PORTRAIT then LANDSCAPE_LEFT, or the reverse on a landscape-native tablet such as Soirely_QA2_Tablet (sc-23471).
# Each wait is on something only the opened page shows, never a title the side list or the frame also shows.
- setOrientation: ${UPRIGHT}
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible:
      id: 'signInRules.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rules-upright
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings-upright
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:orgGeneral.details}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: organisation-upright
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible: '{{t:security.off}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-upright
- setOrientation: ${SIDE}
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible:
      id: 'signInRules.card'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rules-side
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings-side
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:orgGeneral.details}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: organisation-side
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible: '{{t:security.off}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: security-side
- setOrientation: ${UPRIGHT}
