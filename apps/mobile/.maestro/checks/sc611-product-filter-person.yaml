# sc-611: the person menu open.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/audit-log
- extendedWaitUntil:
    visible:
      id: audit.card
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: audit.filter.person
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: audit-filter_person-product
