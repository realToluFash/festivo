# sc-40661 es: Mexico finds México.
appId: host.exp.Exponent
---
- runFlow: ../sc40661-to-country-search.yaml
- eraseText: 80
- inputText: 'Mexico'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: s40661-es-Mexico
- assertVisible: { id: 'createWalk.country.MX' }
- assertNotVisible: { id: 'createWalk.countries.noMatch' }
- eraseText: 80
- inputText: 'zzz'
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: s40661-es-zzz
- assertVisible: { id: 'createWalk.countries.noMatch' }
