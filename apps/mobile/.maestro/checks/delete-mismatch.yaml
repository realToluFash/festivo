# Settings > Organisation, deleting it with the name typed wrong: the mismatch line under the field.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.ownership.delete'
    timeout: 60000
- tapOn:
    id: 'organisation.ownership.delete'
- extendedWaitUntil:
    visible:
      id: 'organisation.delete.name'
    timeout: 15000
- tapOn:
    id: 'organisation.delete.name'
- inputText: 'QA Organisatio'
- hideKeyboard
- tapOn:
    id: 'organisation.delete.send'
- waitForAnimationToEnd
- assertVisible: '{{t:ownership.deleteMismatch}}'
- takeScreenshot: delete-mismatch
