# sc-48600 Focus: leaves ${EVENT_ID}'s page open at its Details rows, for a TalkBack or VoiceOver pass by hand. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil: { visible: '.*Adaeze.*', timeout: 30000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: event-page
