# Name open on Account, Full name cleared, keys still up on the field. sc-23943.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'nameCard.change'
    timeout: 30000
- tapOn:
    id: 'nameCard.change'
- tapOn:
    id: 'nameCard.field'
- eraseText: 80
- takeScreenshot: name-blank-typed
