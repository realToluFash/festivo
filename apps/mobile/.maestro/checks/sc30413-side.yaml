# sc-30413: the pairs and the loaded Calendar on a tablet on its side. The batch's reset turns the tablet upright before each check, so the turn is inside this one.
appId: host.exp.Exponent
---
# On a landscape-native tablet Maestro's PORTRAIT is rotation 0, which draws it on its side (sc-23471).
- setOrientation: PORTRAIT
- waitForAnimationToEnd: { timeout: 4000 }
- runFlow: sc30413-pairs.yaml
- runFlow: sc30413-calendar-month.yaml
