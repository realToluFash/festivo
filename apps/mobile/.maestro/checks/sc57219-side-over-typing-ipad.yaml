# sc-57219, iPad in landscape: as sc57219-side-over-typing, but the keys are put away with the iPad keyboard's own hide key, which Maestro's hideKeyboard does not reach there. TOKEN.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/join/${TOKEN}
- extendedWaitUntil:
    visible:
      id: requestToJoin.message
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: requestToJoin.message
- inputText: ''
- tapOn:
    id: requestToJoin.ask
- waitForAnimationToEnd
- tapOn:
    point: 97%,95%
- waitForAnimationToEnd
- takeScreenshot: over-left
- tapOn:
    id: requestToJoin.message
- inputText: 'bb'
- waitForAnimationToEnd
- takeScreenshot: over-typing
- assertVisible: '.*(?:Keep your message to 500|Raccourcissez votre message|Encurte a mensagem|Acorte su mensaje).*'
- setOrientation: PORTRAIT
