# sc-13956: ${EV_OK}, a draft with a host; its notice, the Make live sheet, and the event made live.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EV_OK}
- extendedWaitUntil:
    visible:
      id: 'events.card'
    timeout: 30000
- takeScreenshot: draft-row
- tapOn:
    id: 'events.card.step'
- extendedWaitUntil:
    visible:
      id: 'events.makeLiveYes'
    timeout: 10000
- takeScreenshot: confirm
- tapOn:
    id: 'events.makeLiveYes'
- extendedWaitUntil:
    visible:
      id: 'events.phase.live'
    timeout: 15000
- takeScreenshot: made-live
