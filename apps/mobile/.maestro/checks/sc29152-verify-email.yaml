# sc-29152: the design demo's Settings in B Confetti, /account?state=verifyEmail. Needs ${METRO_URL}; run under EXPO_PUBLIC_SCHEME=violet.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/account?state=verifyEmail
- extendedWaitUntil:
    visible:
      id: 'demo.verify.code'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: verify-email
- swipe:
    start: 85%, 80%
    end: 85%, 30%
- waitForAnimationToEnd
- takeScreenshot: verify-email-scrolled
