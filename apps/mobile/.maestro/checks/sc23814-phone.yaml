# sc-23814 regression, iPhone: Events > ${EVENT} > the bell; the header's Back, then the swipe, return to ${EVENT}'s page.
appId: host.exp.Exponent
---
- runFlow: ../return-home.yaml
- tapOn:
    id: 'frame.events'
- scrollUntilVisible:
    element:
      id: 'events.row.${EVENT}'
    timeout: 20000
- tapOn:
    id: 'events.row.${EVENT}'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 20000
- tapOn:
    id: 'frame.bell'
- extendedWaitUntil:
    visible:
      id: 'frame.back'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: notifications.pushAsk.notNow
    commands:
      - tapOn:
          id: notifications.pushAsk.notNow
- assertNotVisible:
    id: 'notifications.back'
- takeScreenshot: phone-notifications
- tapOn:
    id: 'frame.back'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: phone-after-back
- tapOn:
    id: 'frame.bell'
- extendedWaitUntil:
    visible:
      id: 'frame.back'
    timeout: 15000
- waitForAnimationToEnd
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 400
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: phone-after-swipe
