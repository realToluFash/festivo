# sc-48600: the product's showLatest on ${EVENT_ID}: after a 412 on Name, Show the latest asks before replacing what was typed. Needs ${METRO_URL}, ${EVENT_ID}, ${EMAIL}, ${PASSWORD}, ${API_URL}, ${WEB_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=name
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.field'
    timeout: 30000
- tapOn:
    id: 'event.edit.name.field'
- inputText: ' mine'
- runScript:
    file: ../scripts/change-event-elsewhere.js
    env:
      ELSEWHERE_NAME: Adaeze & Tunde’s wedding
- tapOn:
    id: 'event.edit.name.save'
- extendedWaitUntil:
    visible:
      id: 'event.edit.name.latest'
    timeout: 10000
- tapOn:
    id: 'event.edit.name.latest'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: showLatest-product
- tapOn:
    id: 'event.edit.name.latest.show'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: showLatest-shown-product
