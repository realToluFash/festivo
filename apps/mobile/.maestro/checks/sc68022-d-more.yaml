# sc-68022: in the demo on a phone, More then People reads ‹ Overview, and ‹ Overview lands on Overview, lit.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/events/evt-wed-4
- extendedWaitUntil: { visible: { id: 'tab-more' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: d-overview
- tapOn: { id: 'tab-more' }
- extendedWaitUntil: { visible: { id: 'event.more.people' }, timeout: 10000 }
- takeScreenshot: d-more-sheet
- tapOn: { id: 'event.more.people' }
- extendedWaitUntil: { visible: '(Back to|Voltar a|Volver a|Retour à) Overview', timeout: 15000 }
- waitForAnimationToEnd: { timeout: 5000 }
- assertNotVisible: '(Back to|Voltar a|Volver a|Retour à) More'
- takeScreenshot: d-people-from-more
- tapOn: '(Back to|Voltar a|Volver a|Retour à) Overview'
- extendedWaitUntil: { visible: { id: 'tab-overview', selected: true }, timeout: 15000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: d-back-overview-from-more
