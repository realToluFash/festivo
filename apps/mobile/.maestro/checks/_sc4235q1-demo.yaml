# sc-4235 (qa1): the app demo's redeem states the product is compared against, each opened directly.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/redeem?state=event
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-event
- openLink: ${METRO_URL}/--/demo/redeem?state=code
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-code
- openLink: ${METRO_URL}/--/demo/redeem?state=in
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-in
- openLink: ${METRO_URL}/--/demo/redeem?state=second-number
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-second-number
- openLink: ${METRO_URL}/--/demo/redeem?state=signed-out
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: demo-signed-out
