# Today's header on the tablet, for the organisation pill beside the tabs. sc-38149.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'tab-today|frame.home'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'tab-today|home.openSettings'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: pill
