# sc-29875: Today's Now from the run of show, the cover and then the folded band. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible: '{{t:todayScreen.tab.today}}'
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: cover
- swipe:
    start: 50%, 75%
    end: 50%, 25%
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: band
