# sc-34869: the Settings hub title and the tab bar under it. Any device, needs ${METRO_URL}, no ${ORIENT}.
appId: host.exp.Exponent
---
- runFlow: ../return-home.yaml
- tapOn:
    id: 'home.openSettings'
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: hub
