# Today scrolled until the band shows, left there for its hierarchy and screen-reader label. sc-40298.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'tab-today|frame.home'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: band
