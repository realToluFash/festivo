# sc-65714: the app demo's Sign-in rules with the two-factor due notice, for the side-by-side pair beside the product. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/settings/sign-in-rules?state=twoFactorDue
- extendedWaitUntil:
    {
      visible: '.*(Members|Settings|Sign-in rules|Organisation|Delete|Paused|paused).*',
      timeout: 30000,
    }
- waitForAnimationToEnd: { timeout: 8000 }
- takeScreenshot: demo-rules-top
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- waitForAnimationToEnd
- takeScreenshot: demo-rules-foot
