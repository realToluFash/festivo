# sc-6476: End now with the field left empty ends the event as before. Needs ${METRO_URL}, ${EV_END}, ${ORIENT}, ${HELPER_URL}, ${ROT} (the harness path `/portrait` or `/landscape`, agreeing with ORIENT).
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- runScript:
    file: ../batch/helper.js
    env:
      ASK: ${ROT}
- waitForAnimationToEnd:
    timeout: 3000
- openLink: ${METRO_URL}/--/events/${EV_END}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'events.end'
    timeout: 30000
- tapOn:
    id: 'events.end'
- waitForAnimationToEnd
- tapOn:
    id: 'events.endYes'
- waitForAnimationToEnd
- takeScreenshot: endedEmpty
- scrollUntilVisible:
    element:
      id: 'event.thankYou'
    direction: UP
    timeout: 20000
- takeScreenshot: endedEmptyCard
