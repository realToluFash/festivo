# sc-72486: Only our organisation while on: the card and row, then switched off by the Owner and the turned-off card. Pass METRO_URL and DOMAIN; the switch starts on.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/data-and-control/email-domains
- extendedWaitUntil:
    visible:
      id: emailDomains.card
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sc72486-on-top
- scrollUntilVisible:
    element:
      id: emailDomains.${DOMAIN}.onlyRow
    direction: DOWN
    timeout: 15000
- takeScreenshot: sc72486-on-row
- tapOn:
    id: emailDomains.${DOMAIN}.only
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: emailDomains.card
    direction: UP
    timeout: 10000
- takeScreenshot: sc72486-turned-off-top
