# sc-22284: somebody else adds 6 hosts to a Draft while its Make live sheet is open; Make live with a name in Host 1 then shows notSavedChanged and hostsNow over them.
appId: host.exp.Exponent
---
- runScript:
    file: ../scripts/sc22284-draft.js
    env:
      NAME: Gala 6
- openLink: ${METRO_URL}/--/events/${output.event}
- extendedWaitUntil:
    visible:
      id: 'events.makeLive'
    timeout: 30000
- tapOn:
    id: 'events.makeLive'
- extendedWaitUntil:
    visible:
      id: 'events.makeLiveHost'
    timeout: 10000
- runScript:
    file: ../scripts/sc22284-hosts.js
    env:
      COUNT: '6'
- inputText: Tolu Fash
- tapOn:
    id: 'events.makeLiveYes'
- extendedWaitUntil:
    visible:
      id: 'events.makeLiveHostsNow'
    timeout: 15000
- assertVisible: '{{t:eventLive.notSavedChanged}}'
- assertVisible: '{{t:eventLive.hostsNow}}'
- takeScreenshot: hosts-now-6
- tapOn:
    id: 'events.makeLiveNo'
