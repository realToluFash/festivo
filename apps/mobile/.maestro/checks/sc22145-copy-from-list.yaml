# sc-22145: a copy opened any other way is an ordinary event page, whose back (the header's on a phone, ‹ Events on a tablet in portrait) goes to the list.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.tab.drafts'
    timeout: 30000
- takeScreenshot: list
- tapOn:
    id: 'events.tab.drafts'
- scrollUntilVisible:
    element:
      id: 'events.row.${COPY}'
    timeout: 15000
- tapOn:
    id: 'events.row.${COPY}'
- waitForAnimationToEnd
- takeScreenshot: copy-from-list
- runFlow:
    when:
      visible:
        id: 'frame.back'
    commands:
      - tapOn:
          id: 'frame.back'
- runFlow:
    when:
      visible:
        id: 'events.back'
    commands:
      - tapOn:
          id: 'events.back'
- waitForAnimationToEnd
- takeScreenshot: after-back
