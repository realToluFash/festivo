# Create an organisation: Continue on Where is it based? with no country chosen is refused; choosing one clears it. Device region no listed country. sc-30447.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'QA Second Ltd'
- hideKeyboard:
    optional: true
- tapOn:
    id: 'createWalk.primary'
- extendedWaitUntil:
    visible: '{{t:createOrganisation.whereTitle}}'
    timeout: 10000
- hideKeyboard:
    optional: true
- takeScreenshot: create-at-rest
- tapOn:
    id: 'createWalk.primary'
- waitForAnimationToEnd
- takeScreenshot: create-country-refused
- assertVisible: '{{t:forms.countryBlank}}'
- tapOn:
    id: 'createWalk.search'
- inputText: 'Portugal'
- tapOn:
    id: 'createWalk.country.PT'
- hideKeyboard:
    optional: true
- waitForAnimationToEnd
- takeScreenshot: create-country-chosen
- assertNotVisible: '{{t:forms.countryBlank}}'
