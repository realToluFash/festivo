# Add domain with the API stopped and the keys up: the error shows, keys stay up. sc-9674.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.card
    timeout: 30000
- scrollUntilVisible:
    element:
      id: organisation.domain.add
    centerElement: true
- swipe:
    start: '50%,40%'
    end: '50%,60%'
- waitForAnimationToEnd
- tapOn:
    id: organisation.domain.add
- extendedWaitUntil:
    visible:
      id: organisation.domain.field
    timeout: 10000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: organisation.domain.field
      - eraseText: 80
- inputText: 'example.org'
- waitForAnimationToEnd
- takeScreenshot: keys-up
- assertVisible: '(?i)(shift|delete)'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: organisation.domain.send
    centerElement: true
- tapOn:
    id: organisation.domain.send
- scrollUntilVisible:
    element: '.*{{t:companyDomains.failed}}.*'
    direction: UP
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: organisation.domain.field
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: refused
- assertVisible: '(?i)(shift|delete)'
- inputText: x
- assertVisible:
    id: organisation.domain.field
    text: 'example.orgx'
