# sc-22103: Delete event on a happening event opened from Happening now while Upcoming shows: Events, the notice, the tab kept (${LIVE} on Upcoming). Needs ${METRO_URL}, ${GONE_NOW}, ${NOW_NAME}, ${LIVE}.
appId: host.exp.Exponent
---
- runFlow: ../checks/sc22103/to-upcoming.yaml
- scrollUntilVisible:
    element:
      id: 'events.now.${GONE_NOW}'
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'events.now.${GONE_NOW}'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.delete'
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'events.delete'
- extendedWaitUntil:
    visible:
      id: 'events.deleteGo'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: 'events.deleteName'
    commands:
      - tapOn:
          id: 'events.deleteName'
      - inputText: ${NOW_NAME}
- takeScreenshot: confirm
- tapOn:
    id: 'events.deleteGo'
- extendedWaitUntil:
    notVisible:
      id: 'events.page'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: landed
- extendedWaitUntil:
    visible: '{{t:eventDelete.deleted}}'
    timeout: 20000
- takeScreenshot: deleted
- swipe:
    start: 1%, 50%
    end: 80%, 50%
    duration: 400
- waitForAnimationToEnd
- assertNotVisible:
    id: 'events.page'
- takeScreenshot: after-swipe
- scrollUntilVisible:
    element:
      id: 'events.row.${LIVE}'
    centerElement: true
    timeout: 20000
- takeScreenshot: upcoming-kept
