# sc-70353: the number's role sheet first, then each address's, each sheet's heading and roles in full.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=people
- extendedWaitUntil: { visible: { id: 'people.row.${P_AMAKA}' }, timeout: 30000 }
- scrollUntilVisible:
    {
      element: { id: 'people.row.${P_MOBILE}' },
      direction: DOWN,
      timeout: 10000,
      centerElement: true,
    }
- tapOn: { id: 'people.row.${P_MOBILE}' }
- extendedWaitUntil: { visible: { id: 'people.role.done' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: role-mobile
- tapOn: { id: 'people.role.done' }
- waitForAnimationToEnd: { timeout: 5000 }
- scrollUntilVisible:
    {
      element: { id: 'people.row.${P_AMAKA}' },
      direction: DOWN,
      timeout: 10000,
      centerElement: true,
    }
- tapOn: { id: 'people.row.${P_AMAKA}' }
- extendedWaitUntil: { visible: { id: 'people.role.done' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: role-amaka
- tapOn: { id: 'people.role.done' }
- waitForAnimationToEnd: { timeout: 5000 }
- scrollUntilVisible:
    {
      element: { id: 'people.row.${P_DOTTED}' },
      direction: DOWN,
      timeout: 10000,
      centerElement: true,
    }
- tapOn: { id: 'people.row.${P_DOTTED}' }
- extendedWaitUntil: { visible: { id: 'people.role.done' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: role-dotted
- tapOn: { id: 'people.role.done' }
- waitForAnimationToEnd: { timeout: 5000 }
- scrollUntilVisible:
    {
      element: { id: 'people.row.${P_UNBROKEN}' },
      direction: DOWN,
      timeout: 10000,
      centerElement: true,
    }
- tapOn: { id: 'people.row.${P_UNBROKEN}' }
- extendedWaitUntil: { visible: { id: 'people.role.done' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: role-unbroken
- tapOn: { id: 'people.role.done' }
- waitForAnimationToEnd: { timeout: 5000 }
- scrollUntilVisible:
    { element: { id: 'people.row.${P_UNBROKEN}' }, direction: DOWN, timeout: 10000 }
- takeScreenshot: rows-bottom
