# sc-20824: Events' New event with ${NAME}, a wedding, today 12:00 to tomorrow (TOMORROW, the day's number) 12:00 through the pickers; Create event shows its sending state, the new event's page opens within 3 seconds, and Back from it shows Events, not New event.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.new'
    timeout: 30000
- tapOn:
    id: 'events.new'
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 20000
- tapOn:
    id: 'eventForm.name'
- inputText: ${NAME}
- hideKeyboard
- tapOn:
    id: 'eventForm.type'
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: eventForm.type.wedding
- scrollUntilVisible:
    element:
      id: 'eventForm.start.date'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'eventForm.start.date'
- extendedWaitUntil:
    visible:
      id: 'eventForm.start.done'
    timeout: 10000
- tapOn:
    id: 'eventForm.start.done'
- waitForAnimationToEnd
- tapOn:
    id: 'eventForm.start.time'
- extendedWaitUntil:
    visible:
      id: 'eventForm.start.done'
    timeout: 10000
- tapOn:
    id: 'eventForm.start.done'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'eventForm.end.date'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'eventForm.end.date'
- extendedWaitUntil:
    visible:
      id: 'eventForm.end.done'
    timeout: 10000
- tapOn:
    text: '${TOMORROW}'
    optional: true
- tapOn:
    id: 'eventForm.end.done'
- waitForAnimationToEnd
- tapOn:
    id: 'eventForm.end.time'
- extendedWaitUntil:
    visible:
      id: 'eventForm.end.done'
    timeout: 10000
- tapOn:
    id: 'eventForm.end.done'
- waitForAnimationToEnd
- takeScreenshot: filled
- scrollUntilVisible:
    element:
      id: 'eventForm.send'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'eventForm.send'
- takeScreenshot: creating
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 3000
- assertVisible: '.*${NAME}.*'
- takeScreenshot: created
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'events.new'
    timeout: 10000
- assertNotVisible:
    id: 'eventForm.name'
- takeScreenshot: back-to-events
