# Your organisations, from the frame's organisation, at whatever text size the simulator is set to. sc-13496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- tapOn:
    id: 'frame.organisation'
- extendedWaitUntil:
    visible: '{{t:switcher.asks}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switcher-1
- scrollUntilVisible:
    element:
      id: 'switcher.tile.create'
    direction: DOWN
    timeout: 30000
- takeScreenshot: switcher-2
