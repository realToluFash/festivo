# The Settings list, top to bottom, at whatever text size the simulator is set to. sc-13496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible: '{{t:settings.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: list-1
- scroll
- takeScreenshot: list-2
- scroll
- takeScreenshot: list-3
- scroll
- takeScreenshot: list-4
