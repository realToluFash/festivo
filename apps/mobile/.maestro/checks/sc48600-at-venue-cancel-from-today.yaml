# sc-48600: an edit a link opened from outside the app closes, on Cancel, onto the event's page under it, never back to Today (pm, 15 Nov). Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    notVisible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: before-link
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 30000
- assertNotVisible: '.*ShellContext.*'
- takeScreenshot: at-venue-open
- tapOn:
    id: 'event.edit.venue.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: at-venue-cancel-lands-page
