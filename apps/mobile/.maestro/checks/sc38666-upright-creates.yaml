# sc-38666 unchanged: Create an organisation upright on a phone, keys up then down (label above, 52 nav, Continue pinned), then a name, Nigeria chosen at the country step and Create, landing on the new organisation's Today.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- runFlow: ../open-create-organisation.yaml
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: u38666-01-keys-up
- inputText: 'Upright Supper Club'
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: u38666-02-keys-down
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { visible: { id: 'createWalk.back' }, timeout: 10000 }
- takeScreenshot: u38666-03-country
- scrollUntilVisible: { element: { id: 'createWalk.country.NG' }, direction: DOWN, timeout: 10000 }
- tapOn: { id: 'createWalk.country.NG' }
- waitForAnimationToEnd: { timeout: 2000 }
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { visible: '{{t:createOrganisation.readyTitle}}', timeout: 10000 }
- takeScreenshot: u38666-04-ready
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 6000, optional: true }
- takeScreenshot: u38666-05-landed
