# sc-13861: a saved cover that loads shows the photo, read by its description (${DESC}), on the row in Events and on the event's page, with no default (${TYPE}) standing in. EVENT is the event's id.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'frame.events'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'events.row.${EVENT}'
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: '.*${DESC}.*'
    timeout: 15000
- assertNotVisible:
    id: 'cover-default-${TYPE}'
    childOf:
      id: 'events.row.${EVENT}'
- takeScreenshot: list
- tapOn:
    id: 'events.row.${EVENT}'
- scrollUntilVisible:
    element:
      id: 'events.page.cover'
    direction: UP
    timeout: 10000
- assertNotVisible:
    id: 'cover-default-${TYPE}'
    childOf:
      id: 'events.page.cover'
- takeScreenshot: page
