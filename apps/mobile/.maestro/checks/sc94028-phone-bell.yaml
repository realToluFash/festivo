# sc-94028: on the phone at the device's text size (set outside the flow), the bell's Notifications screen with nothing in it, top then scrolled to its foot. Vars: METRO_URL.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 5000, optional: true }
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- tapOn: 'Notifica(tions|ciones|ções)'
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 15000 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1500, optional: true }
- takeScreenshot: phone
- scrollUntilVisible:
    { element: { id: 'notifications.settings' }, direction: DOWN, timeout: 8000, optional: true }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: phone-foot
