# sc-1593: in ${ORG}, where the role's Events level is Nothing, Home and Settings only, and a link to the event ${EVENT} reads not found.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.switchOrganisation'
    timeout: 30000
- tapOn:
    id: 'home.switchOrganisation'
- scrollUntilVisible:
    element:
      id: 'switcher.${ORG}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'switcher.${ORG}'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'frame.settings'
    timeout: 20000
- assertNotVisible:
    id: 'frame.events'
- takeScreenshot: nav
- openLink: ${METRO_URL}/--/events/${EVENT}
- extendedWaitUntil:
    visible:
      id: 'events.notFound'
    timeout: 30000
- takeScreenshot: link
