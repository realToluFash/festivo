# sc-24385, the tablet on its side: a note with no venue name or address: Venue to be confirmed, the note, then Add the venue. Needs ${METRO_URL}, ${NOVENUE}.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /landscape # the harness turns it (sc-50565)
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/events/${NOVENUE}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'events.addVenue'
    centerElement: true
    timeout: 20000
- assertVisible:
    id: 'events.arrivalNote'
- takeScreenshot: venue
