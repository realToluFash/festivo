# sc-22145: Duplicate {event} on iOS: refusals, the Times in {zone} sheet with Done, Create draft lands on the copy, the edge swipe returns to the original.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- extendedWaitUntil:
    visible: '{{t:eventDuplicate.copied}}'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: form-top
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: form-foot
- tapOn:
    id: 'eventDuplicate.create'
- waitForAnimationToEnd
- takeScreenshot: refused-empty
- tapOn:
    id: 'eventDuplicate.start.date'
- waitForAnimationToEnd
- takeScreenshot: date-sheet
- tapOn:
    id: 'eventDuplicate.start.done'
- waitForAnimationToEnd
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: 'eventDuplicate.create'
- waitForAnimationToEnd
- takeScreenshot: refused-no-time
- tapOn:
    id: 'eventDuplicate.start.time'
- waitForAnimationToEnd
- takeScreenshot: time-sheet
- tapOn:
    id: 'eventDuplicate.start.done'
- waitForAnimationToEnd
- takeScreenshot: start-chosen
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: 'eventDuplicate.create'
- takeScreenshot: created
- extendedWaitUntil:
    visible:
      id: 'events.page.duplicate'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: copy-page
- swipe:
    start: 1%, 50%
    end: 85%, 50%
    duration: 400
- waitForAnimationToEnd
- takeScreenshot: after-edge-swipe
