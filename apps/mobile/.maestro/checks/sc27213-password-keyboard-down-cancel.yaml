# sc-27213: Change password, tap Current password (secure), type one character to show the keyboard is up, hide the keyboard, then Cancel: the screen closes. Three times. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'security.password'
      - extendedWaitUntil:
          visible:
            id: 'security.change.current'
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: 'security.change.current'
          waitToSettleTimeoutMs: 0
          retryTapIfNoChange: false
      - inputText: 'x'
      - takeScreenshot: typed
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: keyboard-down
      - tapOn:
          id: 'security.change.cancel'
          waitToSettleTimeoutMs: 0
      # Typed text makes Cancel ask before it discards it; the ask showing is the tap landing.
      - extendedWaitUntil:
          visible:
            id: 'security.change.discard.discard'
          timeout: 5000
      - tapOn:
          id: 'security.change.discard.discard'
      - extendedWaitUntil:
          visible:
            id: 'security.password'
          timeout: 5000
      - assertNotVisible:
          id: 'security.change.save'
- takeScreenshot: closed
