# sc-96668: Sign in with email's password refusal, for a both-linked member of a Google-or-Apple-only organisation, names Google first, in every language. Pass ORIENT (PORTRAIT or LANDSCAPE_LEFT), MEMBER_EMAIL and MEMBER_PASSWORD. It signs the batch's session out: run it alone with --cold.
appId: host.exp.Exponent
---
- runFlow: ../sign-out.yaml
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'signIn.email|welcome.email'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: 'welcome.email'
    commands:
      - takeScreenshot: welcome
      - tapOn:
          id: 'welcome.email'
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${MEMBER_EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- inputText: ${MEMBER_PASSWORD}
- tapOn:
    id: 'signIn.submit'
- extendedWaitUntil:
    visible: '.*{{t:signIn.providerOnlyTitle}}.*'
    timeout: 20000
- assertVisible: '.*(Use Google or Apple instead\.|Use Google o Apple\.|Utilisez plutôt Google ou Apple\.|Em vez disso, utilize Google ou Apple\.)'
- assertNotVisible: '.*Use Apple (or|o) Google.*|.*plutôt Apple ou Google.*|.*utilize Apple ou Google.*'
- waitForAnimationToEnd
- takeScreenshot: password-both
