# sc-3780: ${EVENT_ID}'s Reply by part, its date picker open.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Reply by.*'
- tapOn:
    text: 'Reply by.*'
- tapOn:
    id: 'event.edit.replyBy.date'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: picker
