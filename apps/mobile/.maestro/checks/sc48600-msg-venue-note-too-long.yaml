# sc-48600: the product's venueNoteTooLong on ${EVENT_ID}. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=venue
- extendedWaitUntil:
    visible:
      id: 'event.edit.venue.save'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'event.edit.venue.note'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'event.edit.venue.note'
- inputRandomText:
    length: 505
- tapOn:
    id: 'event.edit.venue.save'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: venueNoteTooLong-product
- tapOn:
    id: 'event.edit.venue.cancel'
- tapOn:
    id: 'event.edit.venue.discard'
