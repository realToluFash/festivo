# sc-75211: the demo's Filter menu at the device's size with Anniversary and Party chosen, each level from its top, in English and French.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/demo/filter-size?lang=en&picks=twoTypes&level=top
- extendedWaitUntil: { visible: { id: 'demo.filterSize.menu' }, timeout: 30000 }
- waitForAnimationToEnd
- takeScreenshot: demo-en-top
- openLink: ${METRO_URL}/--/demo/filter-size?lang=en&picks=twoTypes&level=type
- extendedWaitUntil: { visible: { id: 'demo.filterSize.menu' }, timeout: 30000 }
- waitForAnimationToEnd
- takeScreenshot: demo-en-type
