# Create an organisation: with a name typed, Cancel asks first and Keep editing leaves the walk as it was, the name still there; Cancel then Discard closes it; and on an iPad a tap on the scrim asks the same.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createWalk.name'
- inputText: 'Escape Typed'
- hideKeyboard:
    optional: true
- tapOn:
    id: 'createWalk.cancel'
- extendedWaitUntil:
    visible:
      id: 'createWalk.ask'
    timeout: 10000
- takeScreenshot: create-discard-asked
- tapOn:
    id: 'createWalk.keep'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk.ask'
    timeout: 10000
- assertVisible:
    id: 'createWalk'
- assertVisible: 'Escape Typed'
- takeScreenshot: create-after-keep
- tapOn:
    id: 'createWalk.cancel'
- tapOn:
    id: 'createWalk.discard'
- extendedWaitUntil:
    notVisible:
      id: 'createWalk'
    timeout: 10000
- takeScreenshot: create-after-cancel
- runFlow: ../open-create-organisation.yaml
- runFlow:
    when:
      visible:
        id: 'createWalk.scrim'
    commands:
      - tapOn:
          id: 'createWalk.name'
      - inputText: 'Scrim Typed'
      - hideKeyboard:
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: create-before-scrim
      - tapOn:
          point: '50%,8%'
      - extendedWaitUntil:
          visible:
            id: 'createWalk.ask'
          timeout: 10000
      - tapOn:
          id: 'createWalk.discard'
      - extendedWaitUntil:
          notVisible:
            id: 'createWalk'
          timeout: 10000
      - takeScreenshot: create-after-scrim
- runFlow: ../return-home.yaml
