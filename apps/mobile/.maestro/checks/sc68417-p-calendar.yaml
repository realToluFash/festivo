# sc-68417: the top of Calendar, unchanged at every size.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/calendar
- extendedWaitUntil:
    visible:
      id: 'calendar.today'
    timeout: 30000
- extendedWaitUntil:
    notVisible: '{{t:calendar.loading}}'
    timeout: 30000
- takeScreenshot: p-calendar
