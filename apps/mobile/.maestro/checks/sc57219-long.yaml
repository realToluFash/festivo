# sc-57219: 500 letters in one run; label clear, then drag to the first line. TOKEN.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/join/${TOKEN}
- extendedWaitUntil:
    visible:
      id: requestToJoin.message
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: requestToJoin.message
- inputText: ''
- waitForAnimationToEnd
- takeScreenshot: long-typed
- swipe:
    from:
      id: requestToJoin.message
    direction: DOWN
- swipe:
    from:
      id: requestToJoin.message
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: long-first-line
- swipe:
    from:
      id: requestToJoin.message
    direction: UP
- swipe:
    from:
      id: requestToJoin.message
    direction: UP
- swipe:
    from:
      id: requestToJoin.message
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: long-last-line
