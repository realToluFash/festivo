# Organisation: Name changed, keys hidden, scrolled to Save changes and tapped. Saved. ends wholly in view, keys down. sc-24496.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: organisation.edit
    timeout: 30000
- tapOn:
    id: organisation.edit
- extendedWaitUntil:
    visible:
      id: organisation.name
    timeout: 30000
- tapOn:
    id: organisation.name
- eraseText: 80
- inputText: QA Saved Org
- hideKeyboard
- waitForAnimationToEnd
- assertNotVisible: '(?i)(shift|delete)'
- scrollUntilVisible:
    element:
      id: organisation.details.save
    centerElement: true
- tapOn:
    id: organisation.details.save
- extendedWaitUntil:
    visible: '.*{{t:orgGeneral.saved}}.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: answered
- assertNotVisible: '(?i)(shift|delete)'
