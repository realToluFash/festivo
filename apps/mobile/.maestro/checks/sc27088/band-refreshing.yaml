# Android only. ${SCREEN} shows the offline band; the automatic reread when the phone comes
# back is given up with the band still up, and the band goes only after Try again's own load,
# once Soirely answers.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/${SCREEN}
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: ${REFRESHING}
    timeout: 20000
- assertNotVisible:
    id: 'offline.band'
- takeScreenshot: ${SCREEN}-online
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline.band'
    timeout: 8000
- takeScreenshot: ${SCREEN}-offline
- runScript:
    file: ../../batch/helper.js
    env:
      ASK: /api?to=paused
- setAirplaneMode: disabled
# Coming back online rereads by itself; the paused API holds that load until it is given up.
- extendedWaitUntil:
    visible:
      id: ${REFRESHING}
    timeout: 8000
# A second "back online" event makes a second automatic load, so this covers two.
- extendedWaitUntil:
    notVisible:
      id: ${REFRESHING}
    timeout: 70000
- extendedWaitUntil:
    visible:
      id: ${REFRESHING}
    timeout: 3000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: ${REFRESHING}
    timeout: 30000
- assertNotVisible:
    id: ${REFRESHING}
- assertVisible:
    id: 'offline.band'
- tapOn:
    id: 'offline.retry'
- extendedWaitUntil:
    visible:
      id: ${REFRESHING}
    timeout: 8000
- assertVisible:
    id: 'offline.band'
- takeScreenshot: ${SCREEN}-refreshing
- runScript:
    file: ../../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    notVisible:
      id: 'offline.band'
    timeout: 30000
