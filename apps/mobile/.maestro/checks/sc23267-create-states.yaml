# sc-23267: Create an organisation in its states, on an account already at its limit: opened, the keyboard up, a name over 100, and Too many new organisations for now. with its time.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- takeScreenshot: create-open
- tapOn:
    id: 'createOrganisation.name'
- takeScreenshot: create-keyboard-up
- inputText: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
- tapOn:
    id: 'createOrganisation.create'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: create-over-100
- eraseText: 150
- inputText: 'Limit Org'
- tapOn:
    id: 'createOrganisation.create'
- extendedWaitUntil:
    visible: '{{t:createOrganisation.limitedTitle}}'
    timeout: 20000
- takeScreenshot: create-limited
