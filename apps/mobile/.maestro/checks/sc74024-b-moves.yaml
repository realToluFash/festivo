# sc-74024: B opens the Calendar and moves on two months.
appId: host.exp.Exponent
---
- runFlow: ../return-home.yaml
- tapOn:
    id: 'tab-calendar|frame.calendar'
- extendedWaitUntil:
    visible:
      id: 'calendar.next'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: b-first
- copyTextFrom:
    id: 'calendar.month'
- evalScript: ${output.first = maestro.copiedText}
- repeat:
    times: 2
    commands:
      - tapOn:
          id: 'calendar.next'
      - waitForAnimationToEnd
- copyTextFrom:
    id: 'calendar.month'
- assertTrue: ${maestro.copiedText != output.first}
- takeScreenshot: b-moved
