# sc-43907 (sc-9950's Country): on a phone whose only language names no offered country (Shqip (Kosovë)), A few details opens with Country blank; Organisation name typed, scrolled so Continue shows; the run then turns TalkBack on and taps Continue. Needs an account with no profile, signed in.
appId: host.exp.Exponent
---
- extendedWaitUntil: { visible: { id: 'completeProfile.organisation' }, timeout: 30000 }
- runFlow:
    when:
      visible: { id: 'completeProfile.name' }
    commands:
      - tapOn: { id: 'completeProfile.name' }
      - eraseText: 60
      - inputText: 'QA Kosovo'
- tapOn: { id: 'completeProfile.organisation' }
- eraseText: 60
- inputText: 'Prishtina Events'
- hideKeyboard
- scrollUntilVisible:
    element: { id: 'completeProfile.save' }
    direction: DOWN
- takeScreenshot: ready
