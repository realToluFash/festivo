# sc-11786: Remove {role}? on the role ${ROLE_ID}, which seven people hold. Misses Remove role… under the tab bar since #1100; use sc23173-role-remove.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible:
      id: 'roles.role.owner'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'roles.role.${ROLE_ID}'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'roles.role.${ROLE_ID}'
- extendedWaitUntil:
    visible:
      id: 'roles.area.events.*'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'roles.remove'
    direction: DOWN
- tapOn:
    id: 'roles.remove'
- extendedWaitUntil:
    visible:
      id: 'roles.remove.keep'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: role-remove
