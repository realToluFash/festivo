# Needs an organisation with at least one event. sc-27686: the offline band keeps the rule's place as the phone turns on its side and back.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil:
    visible:
      id: 'events.summary'
    timeout: 30000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- swipe:
    start: 50%, 55%
    end: 50%, 88%
    duration: 400
- extendedWaitUntil:
    visible:
      id: 'offline.band'
    timeout: 60000
- assertVisible:
    id: 'offline.retry'
- takeScreenshot: before
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'offline.retry'
- takeScreenshot: side
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'offline.retry'
- takeScreenshot: back
