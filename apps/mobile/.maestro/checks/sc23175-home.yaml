# sc-23175: Home, then Your organisations: the frame's tile, the switcher's tiles and any invitation rows. ORIENT=PORTRAIT|LANDSCAPE_LEFT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: home
- tapOn:
    id: 'frame.organisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switcher
