# Settings > Account > Add an email address, on a tablet where the keys leave the button clear: an address the app passes and the API refuses (a..b@ire.events), and the refusal under the field. Adds nothing. sc-20577.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- extendedWaitUntil:
    visible: '{{t:account.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'contacts.email.add'
    timeout: 30000
- tapOn:
    id: 'contacts.email.add'
- tapOn:
    id: 'contacts.email.field'
- inputText: 'a..b@ire.events'
- tapOn:
    id: 'contacts.email.send'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'contacts.email.send'
    timeout: 10000
- assertVisible: '{{t:forms.emailShape}}'
- takeScreenshot: refused
