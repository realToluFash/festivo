# sc-23301: Home's card in [fd] (heading, role, signed in as, Open Settings and Switch organisation), then the switcher opened from the card and closed on the scrim, then a pick of ${OTHER} updating the card, back to ${ORG}, and Open Settings opening Settings. ORIENT=PORTRAIT|LANDSCAPE_LEFT.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'home.openSettings'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: home
- tapOn:
    id: 'home.switchOrganisation'
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switcher
- tapOn:
    point: '3%,50%'
- extendedWaitUntil:
    notVisible:
      id: 'switcher.heading'
    timeout: 10000
- takeScreenshot: switcher-closed
- tapOn:
    id: 'home.switchOrganisation'
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: switcher.${OTHER}
- extendedWaitUntil:
    notVisible:
      id: 'switcher\..+'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switched
- assertVisible: '.*Ọmọlúàbí.*'
- tapOn:
    id: 'home.switchOrganisation'
- runFlow:
    file: ../scroll-tap.yaml
    env:
      ID: switcher.${ORG}
- extendedWaitUntil:
    notVisible:
      id: 'switcher\..+'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: switched-back
- tapOn:
    id: 'home.openSettings'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: settings
- assertNotVisible:
    id: 'home.openSettings'
