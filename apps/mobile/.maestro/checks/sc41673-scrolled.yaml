- swipe: { start: '50%, 21%', end: '50%, 32%', duration: 400 }
- swipe: { start: '50%, 21%', end: '50%, 32%', duration: 400 }
- swipe: { start: '50%, 21%', end: '50%, 32%', duration: 400 }
- swipe: { start: '50%, 21%', end: '50%, 32%', duration: 400 }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 800, optional: true }
- takeScreenshot: s1-top
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
- swipe: { start: '50%, 32%', end: '50%, 21%', duration: 400 }
