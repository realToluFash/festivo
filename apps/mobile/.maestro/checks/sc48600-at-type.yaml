# sc-48600: /events/${EVENT_ID}/edit?at=type opens the event's page with the type edit open, never the ShellContext Render Error. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=type
- extendedWaitUntil:
    visible:
      id: 'event.edit.type.save'
    timeout: 30000
- assertNotVisible: '.*ShellContext.*'
- takeScreenshot: at-type
- tapOn:
    id: 'event.edit.type.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: at-type-closed
