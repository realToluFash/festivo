# Settings' empty tablet pane says what Account holds, in landscape. sc-22839.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/settings
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: '{{t:settings.choose}}'
- assertVisible: '.*{{t:settings.chooseLine}}.*'
- takeScreenshot: choose-landscape
- setOrientation: PORTRAIT
