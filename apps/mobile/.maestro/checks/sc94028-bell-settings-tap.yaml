# sc-94028: the bell's empty panel, Mark all read tapped (greyed, nothing happens), then Notification settings opened with one tap. Vars: METRO_URL.
appId: host.exp.Exponent
---
- setOrientation: PORTRAIT
- openLink: ${METRO_URL}/--/
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 5000, optional: true }
- runFlow: ../developer-menu-close.yaml
- waitForAnimationToEnd
- tapOn: 'Notifica(tions|ciones|ções)'
- extendedWaitUntil: { visible: { id: 'notifications.markAllRead' }, timeout: 15000 }
- tapOn: { id: 'notifications.markAllRead' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 1000, optional: true }
- takeScreenshot: after-mark
- tapOn: { id: 'notifications.settings' }
- extendedWaitUntil: { visible: { id: 'never.there' }, timeout: 2500, optional: true }
- takeScreenshot: settings-opened
