# sc-29914: the product's People at ${ORIENT}: populated, role sheet, Add people; the empty event; Members and the Change role picker for ${MEMBER}.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EV}?area=people
- extendedWaitUntil: { visible: { id: 'people.row.${PERSON}' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: people
- tapOn: { id: 'people.row.${PERSON}' }
- extendedWaitUntil: { visible: { id: 'people.roleSheet' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: role
- tapOn: { id: 'people.role.done' }
- waitForAnimationToEnd: { timeout: 3000 }
- tapOn: { id: 'people.add.open' }
- extendedWaitUntil: { visible: { id: 'people.add.role' }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: add
- tapOn: { id: 'people.add.cancel' }
- openLink: ${METRO_URL}/--/events/${EMPTY}?area=people
- waitForAnimationToEnd: { timeout: 8000 }
- extendedWaitUntil: { visible: '.*{{t:eventPeople.nobody}}.*', timeout: 20000 }
- takeScreenshot: nobody
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil: { visible: { id: 'members.card' }, timeout: 30000 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: members
- scrollUntilVisible:
    { element: { id: 'members.row.${MEMBER}' }, direction: DOWN, centerElement: true }
- tapOn: { id: 'members.row.${MEMBER}' }
- extendedWaitUntil: { visible: { id: 'members.changeRole' }, timeout: 10000 }
- tapOn: { id: 'members.changeRole' }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: picker
- repeat: { times: 2, commands: [{ swipe: { start: '50%, 75%', end: '50%, 35%' } }] }
- takeScreenshot: picker-down
