# sc-32801: an event's Overview Needs you card on the app, for each seeded event (E1..E7 by id) and beside the app demo's states.
appId: host.exp.Exponent
---
- runFlow: ../return-home.yaml
- openLink: ${METRO_URL}/--/events/${E5}
- extendedWaitUntil:
    visible:
      text: 'QA5.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: e5-product-top
- scrollUntilVisible:
    element:
      id: 'event.needsYou'
    direction: DOWN
    visibilityPercentage: 30
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: e5-product
