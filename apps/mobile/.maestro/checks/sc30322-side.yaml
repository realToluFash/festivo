# sc-30322: on a tablet on its side, the drop-down from the sidebar head, opened there and turned to there while open.
appId: host.exp.Exponent
---
- setOrientation: LANDSCAPE_LEFT
- openLink: ${METRO_URL}/--/demo/events?switcher=populated
- extendedWaitUntil:
    visible:
      id: 'switcher.heading'
    timeout: 30000
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: opened-on-side
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'zzzz-never'
    timeout: 4000
    optional: true
- takeScreenshot: turned-upright
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: 'zzzz-never'
    timeout: 4000
    optional: true
- assertVisible:
    id: 'switcher.heading'
- takeScreenshot: turned-side-after-4s
- setOrientation: PORTRAIT
