# sc-30413: Events' tabs, empty tabs, first run and Today's moments, each beside the app demo's state. Needs the owner of QA Organisation, QA Plan Org (one live event this week), QA Quiet Org (one in December), QA Draft Org (one draft) and QA Empty Org.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil: { visible: 'Drafts.*', timeout: 20000 }
- tapOn: 'Drafts.*'
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: events-drafts-product
- tapOn: 'Past.*'
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: events-past-product
- openLink: ${METRO_URL}/--/demo/events
- extendedWaitUntil: { visible: 'Drafts.*', timeout: 20000 }
- tapOn: 'Drafts.*'
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: events-drafts-demo
- tapOn: 'Past.*'
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: events-past-demo
- openLink: ${METRO_URL}/--/events
- extendedWaitUntil: { visible: 'Search events', timeout: 30000 }
- tapOn: 'Today'
- extendedWaitUntil: { visible: { id: 'home.switchOrganisation' }, timeout: 30000 }
- runFlow: ../open-switcher.yaml
- tapOn: 'QA Plan Org'
- waitForAnimationToEnd: { timeout: 6000 }
