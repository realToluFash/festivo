# sc-28178 subflow: joins ORG, made for this batch, and switches to it. Leaves its id in
# output.joined.
appId: host.exp.Exponent
---
- runScript:
    file: ../../batch/helper.js
    env:
      ASK: /membership?change=join&org=${ORG}
- evalScript: ${output.joined = output.helper.id}
# A move reads the organisations again, so the switcher lists the one just joined.
- tapOn:
    id: 'frame.events'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../../switch-organisation.yaml
    env:
      ORG: ${output.joined}
