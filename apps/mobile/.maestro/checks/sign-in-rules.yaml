# Sign-in rules, opened by its link. On an iPad the heading names the organisation, as
# « Règles de connexion de QA Organisation ».
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/sign-in-rules
- extendedWaitUntil:
    visible: '{{t:settings.signInRules}}|{{t:signInRules.readTitle}}'
    timeout: 30000
- takeScreenshot: sign-in-rules
