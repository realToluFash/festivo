# sc-100878: a fresh walk, and Continue from step 1 with no country picked, opens at the top of the list.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn: { id: 'createWalk.name' }
- inputText: 'QA Fresh Ltd'
- tapOn: { id: 'createWalk.primary' }
- extendedWaitUntil: { visible: '{{t:createOrganisation.whereTitle}}', timeout: 10000 }
- waitForAnimationToEnd
- assertVisible: '{{t:createOrganisation.whereTitle}}'
- assertVisible: '{{t:createOrganisation.fromDevice}}'
- takeScreenshot: f-fresh
- tapOn: { id: 'createWalk.back' }
- waitForAnimationToEnd
- tapOn: { id: 'createWalk.primary' }
- waitForAnimationToEnd
- extendedWaitUntil: { visible: '{{t:createOrganisation.whereTitle}}', timeout: 10000 }
- assertVisible: '{{t:createOrganisation.whereTitle}}'
- assertVisible: '{{t:createOrganisation.fromDevice}}'
- takeScreenshot: f-forward-none
