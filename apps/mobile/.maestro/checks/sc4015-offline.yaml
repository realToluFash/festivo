# sc-4015: on ${EVENT_ID}'s station, waits while the stack is stopped from outside, keeps 12 taps on Jollof rice, then waits while another disher's change lands and the stack starts, for Waiting to send, the strip's count and Not sent.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/station
- extendedWaitUntil:
    visible:
      id: 'station.title'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'station.ready.jollof rice'
    direction: DOWN
    centerElement: true
- takeScreenshot: online
- extendedWaitUntil:
    visible: 'QA_NEVER_THERE'
    timeout: 30000
    optional: true
- takeScreenshot: stopped
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- tapOn:
    id: 'station.preparing.jollof rice'
- tapOn:
    id: 'station.eta.jollof rice.5'
- tapOn:
    id: 'station.ready.jollof rice'
- waitForAnimationToEnd
- takeScreenshot: kept
- scrollUntilVisible:
    element:
      id: 'station.title'
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: kept-top
- extendedWaitUntil:
    visible:
      id: 'station.notSent'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: notsent
- scrollUntilVisible:
    element:
      id: 'station.title'
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: notsent-top
- scrollUntilVisible:
    element:
      id: 'station.left.jollof rice'
    direction: DOWN
    optional: true
- takeScreenshot: notsent-card
