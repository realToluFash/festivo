# sc-48600: /events/${EVENT_ID}/edit?at=currency opens the event's page with the currency edit open, never the ShellContext Render Error. Needs ${METRO_URL}, ${EVENT_ID}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT_ID}/edit?at=currency
- extendedWaitUntil:
    visible:
      id: 'event.edit.currency.save'
    timeout: 30000
- assertNotVisible: '.*ShellContext.*'
- takeScreenshot: at-currency
- tapOn:
    id: 'event.edit.currency.cancel'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 10000
- takeScreenshot: at-currency-closed
