# sc-27088, Android only: Organisation's Edit details keeps a typed name across offline and a refused Save, and still shows it once the phone is online and Soirely answers. It does not wait on the page's rereads, so it does not prove a reread leaves the field alone. The band and Try again sit under the edit screen, so sc27088-organisation checks those.
appId: host.exp.Exponent
onFlowComplete:
  - setAirplaneMode: disabled
  - runScript:
      file: ../batch/helper.js
      env:
        ASK: /api?to=up
---
# organisation.card is drawn before the read answers, so only the band proves the page had
# loaded. The band sits on the page, under Edit details, so it is waited for before the edit
# screen opens. A try that went offline too early leaves no band and nothing reads again, so
# each try reloads the bundle to remount the screen.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../batch/reset.yaml
      - openLink: ${METRO_URL}/--/settings/organisation
      - extendedWaitUntil:
          visible:
            id: 'organisation.card'
          timeout: 30000
      - assertNotVisible: 'Offline Org Name'
      - extendedWaitUntil:
          notVisible:
            id: 'organisation.refreshing'
          timeout: 20000
      - setAirplaneMode: enabled
      # As sc63653-export-offline: an emulator can take well over 8s to report the network gone.
      - extendedWaitUntil:
          visible:
            id: 'offline.band'
          timeout: 45000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- tapOn:
    id: 'organisation.edit'
- extendedWaitUntil:
    visible:
      id: 'organisation.name'
    timeout: 10000
- tapOn:
    id: 'organisation.name'
- eraseText: 120
- inputText: 'Offline Org Name'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'organisation.details.save'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: 'organisation.details.save'
    enabled: true
- tapOn:
    id: 'organisation.details.save'
- extendedWaitUntil:
    visible: '{{t:orgGeneral.failed}}'
    timeout: 60000
- takeScreenshot: save-refused
- assertVisible: 'Offline Org Name'
- setAirplaneMode: disabled
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- scrollUntilVisible:
    element:
      id: 'organisation.name'
    direction: UP
    timeout: 15000
- assertVisible: 'Offline Org Name'
- takeScreenshot: name-kept
