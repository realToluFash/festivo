# sc-27088, Android only: Organisation keeps a typed name across offline, a refused Save, the automatic reread being given up, and a pressed Try again.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible:
      id: 'organisation.name'
    timeout: 30000
- assertNotVisible: 'Offline Org Name'
- tapOn:
    id: 'organisation.name'
- eraseText: 120
- inputText: 'Offline Org Name'
- hideKeyboard
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline.band'
    timeout: 8000
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=stopped
- scrollUntilVisible:
    element:
      id: 'organisation.save'
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: 'organisation.save'
    enabled: true
- tapOn:
    id: 'organisation.save'
- extendedWaitUntil:
    visible: '{{t:orgGeneral.failed}}'
    timeout: 60000
- takeScreenshot: save-refused
- assertVisible: 'Offline Org Name'
# Paused, so the reread on coming back online is held until it is given up, band still up.
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'organisation.refreshing'
    timeout: 8000
# A second "back online" event makes a second automatic load, so this covers two.
- extendedWaitUntil:
    notVisible:
      id: 'organisation.refreshing'
    timeout: 70000
- extendedWaitUntil:
    visible:
      id: 'organisation.refreshing'
    timeout: 3000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: 'organisation.refreshing'
    timeout: 30000
- assertVisible:
    id: 'offline.band'
# Tapped while the API is still paused, so the load that follows is Try again's own.
- tapOn:
    id: 'offline.retry'
- extendedWaitUntil:
    visible:
      id: 'organisation.refreshing'
    timeout: 8000
- assertVisible:
    id: 'offline.band'
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    notVisible:
      id: 'offline.band'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.name'
    direction: UP
    timeout: 15000
- assertVisible: 'Offline Org Name'
- takeScreenshot: name-kept
