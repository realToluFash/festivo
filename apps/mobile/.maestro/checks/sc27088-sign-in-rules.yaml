# sc-27088, Android only: Settings > sign-in-rules shows the offline band, the automatic reread is given up with the band still up, Try again's own load shows Refreshing…, then the band goes once Soirely answers.
appId: host.exp.Exponent
---
- runFlow:
    file: sc27088/band-refreshing.yaml
    env:
      SCREEN: sign-in-rules
      REFRESHING: 'signInRules.refreshing'
- assertVisible: '{{t:signInRules.inForceTitle}}'
- takeScreenshot: reloaded
