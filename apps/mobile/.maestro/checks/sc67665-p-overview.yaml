# sc-67665: the app's overview on an event, on the iPad, for the frame beside People's.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/${EVENT_ID}?area=overview
- waitForAnimationToEnd: { timeout: 8000 }
- extendedWaitUntil: { visible: '.*Events.*', timeout: 30000 }
- takeScreenshot: p-overview
