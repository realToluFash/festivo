# Organisation > General: a contact address with no @ is refused by the app's own check under the field. Saves nothing. sc-20577.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- extendedWaitUntil:
    visible: '{{t:settings.organisation}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'organisation.contact'
    timeout: 15000
- tapOn:
    id: 'organisation.contact'
- eraseText: 120
- inputText: 'amara.gmail.com'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'organisation.save'
    timeout: 15000
- tapOn:
    id: 'organisation.save'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'organisation.contact'
    timeout: 15000
    centerElement: true
- takeScreenshot: refused
- assertVisible: '{{t:orgGeneral.contactInvalid}}'
