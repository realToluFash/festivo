# sc-82892 on New event (Android: no hideKeyboard, which presses Back there): Add a host gives Host 2 with the cursor; Create event with both rows empty, then the Hosted by section read back; Remove Host 2 leaves one row.
appId: host.exp.Exponent
---
- setOrientation: ${ORIENT}
- openLink: ${METRO_URL}/--/events/new
- extendedWaitUntil:
    visible:
      id: 'eventForm.hosts.field.0'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'eventForm.hosts.add'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'eventForm.hosts.add'
- waitForAnimationToEnd
- takeScreenshot: added
- scrollUntilVisible:
    element:
      id: 'eventForm.send'
    direction: DOWN
- tapOn:
    id: 'eventForm.send'
- waitForAnimationToEnd
- takeScreenshot: sent
- pressKey: back
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'eventForm.hosts.field.0'
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: hosts-after-send
- tapOn:
    id: 'eventForm.hosts.remove.1'
- waitForAnimationToEnd
- takeScreenshot: one-row
