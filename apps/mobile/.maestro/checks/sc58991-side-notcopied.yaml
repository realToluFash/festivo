# sc-58991, tablet side by side: Copy invitation link with the API stopped, then the failed-copy line in the details pane. Pass METRO_URL, EVENT_ID, GUEST_ID, ORIENT, NET.
appId: host.exp.Exponent
onFlowComplete:
  - runScript:
      file: ../scripts/sc58991-net.js
      env:
        NET_URL: ${NET}/online
---
- runFlow: sc58991-open-guest.yaml
- runFlow:
    file: sc58991-side-down.yaml
    env:
      TARGET: guest.replace
- runScript:
    file: ../scripts/sc58991-net.js
    env:
      NET_URL: ${NET}/offline
- waitForAnimationToEnd
- runFlow:
    file: sc58991-side-down.yaml
    env:
      TARGET: guest.replace
- tapOn:
    id: 'guest.copy'
- extendedWaitUntil:
    visible:
      id: 'guest.notCopied'
    timeout: 30000
- runFlow:
    file: sc58991-side-down.yaml
    env:
      TARGET: guest.replace
- waitForAnimationToEnd
- takeScreenshot: notcopied
