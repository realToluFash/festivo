# sc-23282: another device's Sign out… opens Sign it out on top of Keep it signed in, and Keep it signed in keeps the row. Needs ${METRO_URL} and another session of the account, which Sign it out ends: create a fresh one before each run.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element: 'Safari on iPad'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rows
- tapOn:
    id: 'devices\.row\..+\.signOut'
    rightOf: 'Safari on iPad'
- waitForAnimationToEnd
- takeScreenshot: after-tap
- waitForAnimationToEnd
- takeScreenshot: confirm-raw
- runFlow:
    when:
      notVisible:
        id: 'devices.end'
    commands:
      - scrollUntilVisible:
          element:
            id: 'devices.end'
          direction: UP
          timeout: 15000
- takeScreenshot: confirm
- tapOn:
    id: 'devices.keep'
- waitForAnimationToEnd
- takeScreenshot: kept-focus
- scrollUntilVisible:
    element: 'Safari on iPad'
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'devices\.row\..+\.signOut'
    rightOf: 'Safari on iPad'
- scrollUntilVisible:
    element:
      id: 'devices.end'
    direction: UP
    timeout: 15000
- tapOn:
    id: 'devices.end'
- waitForAnimationToEnd
- takeScreenshot: ended
- scrollUntilVisible:
    element:
      id: 'devices.everywhere'
    timeout: 15000
    centerElement: true
- takeScreenshot: kept
- tapOn:
    id: 'devices.everywhere'
- waitForAnimationToEnd
- takeScreenshot: everywhere-raw
- scrollUntilVisible:
    element:
      id: 'devices.everywhere.keep'
    timeout: 15000
- takeScreenshot: everywhere-confirm
- tapOn:
    id: 'devices.everywhere.keep'
- takeScreenshot: everywhere-kept
