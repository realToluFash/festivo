# sc-12226: New role's page with a name typed, and Create role. Swipes at 75% across, as role-spare-page does.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible: '{{t:rolesScreen.title}}'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'roles.new'
    direction: DOWN
- tapOn:
    id: 'roles.new'
- tapOn:
    id: 'roles.name'
- inputText: 'Tablet Crew'
- takeScreenshot: role-new-typed
- hideKeyboard
- swipe:
    start: 75%, 70%
    end: 75%, 30%
- swipe:
    start: 75%, 70%
    end: 75%, 30%
- takeScreenshot: role-new-foot
