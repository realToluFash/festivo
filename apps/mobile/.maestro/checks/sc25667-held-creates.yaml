# sc-25667: Create organisation pressed with the API paused reads Creating…, a second tap sends nothing, Cancel is off and does nothing, a tap on the scrim does nothing; once the API is back the sheet closes into the new organisation with Now working in it.
appId: host.exp.Exponent
---
- runFlow: ../open-create-organisation.yaml
- tapOn:
    id: 'createOrganisation.name'
- inputText: 'Held Made'
- hideKeyboard:
    optional: true
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=paused
- tapOn:
    id: 'createOrganisation.create'
- tapOn:
    id: 'createOrganisation.create'
- takeScreenshot: held-creating
- assertVisible: '{{t:createOrganisation.creating}}'
- assertVisible:
    id: 'createOrganisation.cancel'
    enabled: false
- tapOn:
    id: 'createOrganisation.cancel'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'createOrganisation'
- takeScreenshot: held-after-cancel
- tapOn:
    point: '50%,8%'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'createOrganisation'
- takeScreenshot: held-after-scrim
- runScript:
    file: ../batch/helper.js
    env:
      ASK: /api?to=up
- extendedWaitUntil:
    notVisible:
      id: 'createOrganisation'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Held Made.*'
    timeout: 20000
- takeScreenshot: held-created-home
