# sc-22819, Android: on a tablet in portrait, the copy made by Duplicate shows the quiet back, and Android back returns to the original's page.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- tapOn:
    id: 'events.page.duplicate'
- scrollUntilVisible:
    element:
      id: 'eventDuplicate.create'
    timeout: 15000
- tapOn:
    id: 'eventDuplicate.start.time'
- tapOn: 'OK'
- tapOn:
    id: 'eventDuplicate.create'
- extendedWaitUntil:
    notVisible:
      id: 'eventDuplicate.create'
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: 'events.back'
- takeScreenshot: copy-page
- back
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: 'events.page.duplicate'
    timeout: 30000
- assertVisible:
    id: 'events.back'
- takeScreenshot: android-back-on-original
