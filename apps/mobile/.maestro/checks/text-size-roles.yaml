# roles, top to bottom, at whatever text size the simulator is set to. sc-13281.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/roles
- extendedWaitUntil:
    visible: '{{t:rolesScreen.title}}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: roles-1
- scroll
- takeScreenshot: roles-2
- scroll
- takeScreenshot: roles-3
- scroll
- takeScreenshot: roles-4
