# sc-3905: the app's All dates and Coming up for ${EVENT} show Picks close with no Open the menu link. Needs ${METRO_URL}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${EVENT}/dates
- extendedWaitUntil:
    visible:
      id: 'timeline.allDates.page'
    timeout: 90000
- waitForAnimationToEnd
- assertVisible: '(?:Picks close|Fin del plazo de elección|Clôture des choix|Fim do prazo de escolha)'
- assertNotVisible: '(?:Open the menu|Abrir el menú|Ouvrir le menu|Abrir o menu).*'
- takeScreenshot: alldates
- openLink: ${METRO_URL}/--/events/${EVENT}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 90000
- scrollUntilVisible:
    element:
      id: 'timeline.comingUp'
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: '(?:Picks close|Fin del plazo de elección|Clôture des choix|Fim do prazo de escolha)'
- takeScreenshot: comingup
- assertNotVisible: '(?:Open the menu|Abrir el menú|Ouvrir le menu|Abrir o menu).*'
