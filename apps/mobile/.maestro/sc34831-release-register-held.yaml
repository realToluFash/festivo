# Release build: from the welcome screen, starts a sign-up and leaves it waiting on its email code (pendingRegistration). sc-34831.
appId: com.soirely.app
---
- launchApp:
    appId: com.soirely.app
- openLink: soirely://register
- runFlow:
    when:
      visible: 'Open in .*Soirely.*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'register.name'
    timeout: 60000
- tapOn:
    id: 'register.name'
- eraseText: 120
- inputText: ${NAME}
- tapOn:
    id: 'register.email'
- eraseText: 120
- inputText: ${EMAIL}
- pressKey: Enter
- eraseText: 120
- inputText: ${PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Save Password?'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: 'Save Password?'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible:
      id: 'verifyEmail.code'
    timeout: 30000
