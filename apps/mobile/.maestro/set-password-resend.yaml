# Presses Send a new code on Code from the email, waiting out its countdown first. sc-13138.
#
#   node .qa/bin/qa-env.mjs maestro set-password-resend --android
appId: host.exp.Exponent
---
- scrollUntilVisible:
    element:
      id: 'security.code.resend'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'security.code.resend'
      enabled: true
    timeout: 75000
- tapOn:
    id: 'security.code.resend'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: set-password-resend
