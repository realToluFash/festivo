# Adds the web, already open in iPhone Safari, to the home screen, and ends on the home screen with its icon (sc-23302).
# Open the page first: xcrun simctl openurl "<udid>" http://127.0.0.1:15173/
appId: com.apple.mobilesafari
---
- tapOn:
    point: '85%,93%'
- waitForAnimationToEnd
- tapOn:
    text: 'Share'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: safari-share-sheet
- swipe:
    start: '50%,80%'
    end: '50%,25%'
- waitForAnimationToEnd
- takeScreenshot: safari-share-sheet-up
- tapOn:
    text: 'Add to Home Screen'
- waitForAnimationToEnd
- tapOn:
    text: 'Add to Home Screen'
    optional: true
# The sheet is Safari's remote view, which the hierarchy does not show, so it is waited for rather than found.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: safari-add-to-home-screen
# The sheet's Add button has no text match while the keyboard is up, so it is tapped where it sits.
- tapOn:
    point: '88%,12%'
- waitForAnimationToEnd
- pressKey: home
- waitForAnimationToEnd
- takeScreenshot: web-home-screen-icon
