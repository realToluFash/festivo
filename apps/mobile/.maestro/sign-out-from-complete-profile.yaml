# Signs out from Complete your profile, which the batch's sign-out.yaml does not reach. sc-18648.
#
# Sign out can stop under the iPhone's bottom edge, which Maestro counts as visible, so
# scrollUntilVisible leaves it there. One more scroll lifts it clear, since the language row
# sits below it. sc-21193.
appId: host.exp.Exponent
---
- scrollUntilVisible:
    element:
      id: 'completeProfile.signOut'
- scroll
- waitForAnimationToEnd
- tapOn:
    id: 'completeProfile.signOut'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
