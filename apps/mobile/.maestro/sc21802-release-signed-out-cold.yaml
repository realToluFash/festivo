# sc-21802, release build: signed in, Settings' Sign out, the app stopped and launched again shows the signed-out landing page, not Home. Pass EMAIL, PASSWORD.
appId: com.soirely.app
---
- runFlow: release-sign-in.yaml
- tapOn:
    id: 'home.openSettings'
- runFlow: settings-sign-out-tap.yaml
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
- stopApp: com.soirely.app
- launchApp:
    appId: com.soirely.app
- extendedWaitUntil:
    visible:
      id: 'home.openSignIn'
    timeout: 60000
- assertNotVisible:
    id: 'home.openSettings'
- takeScreenshot: release-signed-out-relaunched
