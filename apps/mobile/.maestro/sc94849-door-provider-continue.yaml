# sc-94849: from the door code's provider-only refusal, continue with PROVIDER_ID (signIn.google or signIn.apple) as USERNAME in the local sign-in sandbox, and land back on the door code signed in (or on the two-factor step).
appId: host.exp.Exponent
---
- tapOn:
    id: ${PROVIDER_ID}
- takeScreenshot: 03-busy
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- extendedWaitUntil:
    visible: '.*own account.*'
    timeout: 30000
- tapOn:
    text: 'owner-a'
    optional: true
- runFlow:
    when:
      notVisible: '.*qa3.*'
    commands:
      - tapOn:
          point: '28%,21%'
- inputText: ${USERNAME}
- tapOn:
    text: 'Sign in'
    index: 0
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: '(redeem.joinAs|twoFactor.code)'
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: 04-back
