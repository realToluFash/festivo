# Opens a reset link's code step (two-factor on) with the signed-out app in LANGUAGE (its chip
# on the sign-in screen: English, Español, Français, Português). Pass LANGUAGE and TOKEN.
# sc-22740.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'signIn.email|home.openSignIn'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'home.openSignIn'
    commands:
      - tapOn:
          id: 'home.openSignIn'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 20000
- scrollUntilVisible:
    element: '${LANGUAGE}'
- tapOn: '${LANGUAGE}'
- openLink: ${METRO_URL}/--/reset-password?token=${TOKEN}
- extendedWaitUntil:
    visible:
      id: 'twoFactor.code'
    timeout: 30000
