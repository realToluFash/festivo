# B Confetti's cover in LANGUAGE: the welcome's line, the signed-out notice and No connection's title, each
# photographed as ${TAG}-welcome, ${TAG}-signed-out and ${TAG}-unreachable, for confetti clearance. sc-29078.
#
#   node .qa/bin/qa-env.mjs maestro sc29078-confetti-clearance LANGUAGE=Français TAG=fr-377 --android
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/welcome
- extendedWaitUntil:
    visible:
      id: 'welcome.email'
    timeout: 90000
- tapOn:
    id: 'language.open'
- tapOn:
    id: 'language\.(en|es|fr|pt)'
    text: '${LANGUAGE}'
- tapOn:
    id: 'language.done'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${TAG}-welcome
- openLink: ${METRO_URL}/--/welcome?signedOut=1
- extendedWaitUntil:
    visible:
      id: 'welcome.notice'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${TAG}-signed-out
- openLink: ${METRO_URL}/--/unreachable
- extendedWaitUntil:
    visible:
      id: 'unreachable.retry'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${TAG}-unreachable
