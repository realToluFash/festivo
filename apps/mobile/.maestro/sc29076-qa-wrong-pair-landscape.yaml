# Landscape, wrong pair, keys up: the refused line and Forgot your password? scroll into sight and Forgot can be tapped. sc-29076.
#
#   Landscape first (on a landscape-native tablet: adb shell wm user-rotation lock 0). Then:
#   node .qa/bin/qa-env.mjs maestro sc29076-qa-wrong-pair-landscape --android EMAIL=… PASSWORD=… SHOT=…
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/
- extendedWaitUntil:
    visible:
      id: 'welcome.email'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-welcome
- tapOn:
    id: 'welcome.email'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 30000
- inputText: ${EMAIL}
- pressKey: Enter
- inputText: 'wrong-password-123'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'That email and password do not match.*'
    timeout: 10000
- takeScreenshot: ${SHOT}
- tapOn:
    id: 'signIn.password'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-keys-up
# From above the keys: in landscape the screen's centre is on the keyboard.
- swipe:
    start: 50%, 35%
    end: 50%, 10%
    duration: 600
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-forgot-in-sight
- tapOn:
    id: 'signIn.forgot'
- extendedWaitUntil:
    visible: 'Reset your password'
    timeout: 10000
- takeScreenshot: ${SHOT}-reset
