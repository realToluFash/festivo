# Settings > Organisation > Ownership and leaving: Transfer ownership open, a new owner
# picked and a password typed, not yet sent. On a signed-in phone. sc-12511.
#
# MEMBERSHIP is a second member's membership id; ownership-leave-open.yaml says how to make one.
#
#   node .qa/bin/qa-env.mjs maestro ownership-transfer-ready --android MEMBERSHIP=… TYPED=…
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- scrollUntilVisible:
    element:
      id: 'organisation.ownership.transfer'
    timeout: 60000
- tapOn:
    id: 'organisation.ownership.transfer'
- scrollUntilVisible:
    element:
      id: 'organisation.transfer.cancel'
    timeout: 30000
- tapOn:
    id: 'organisation.transfer.${MEMBERSHIP}'
- tapOn:
    id: 'organisation.transfer.password'
- eraseText: 120
- inputText: ${TYPED}
# On iOS Return, which sends nothing from this field and puts the keyboard away:
# hideKeyboard fails on an iPhone (sc-19584). On Android Enter can type into the field
# (sc-18648), so it hides the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: 'organisation.transfer.cancel'
    timeout: 30000
- takeScreenshot: ownership-transfer-ready
