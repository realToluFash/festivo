# Types CODE on Enter your code, whose sixth digit sends it, and waits to be signed in. sc-19634.
appId: host.exp.Exponent
---
- tapOn:
    id: 'twoFactor.code'
- inputText: ${CODE}
- extendedWaitUntil:
    visible:
      id: 'home\.openSettings|completeProfile\..*|noOrganisation'
    timeout: 30000
- takeScreenshot: ${SHOT}
