# sc-45141: open an event's Dates part for editing. Needs ${METRO_URL}, ${LIVE}.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/events/${LIVE}
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 90000
- scrollUntilVisible:
    element:
      text: 'Dates · .*'
    centerElement: true
    timeout: 20000
- tapOn:
    text: 'Dates · .*'
- waitForAnimationToEnd
- tapOn:
    text: 'Africa/Lagos'
- waitForAnimationToEnd
