# Settings > Security > Password > Set a password, on a signed-in account with no password. sc-13138.
#
#   node .qa/bin/qa-env.mjs maestro set-password-open --android
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'password.set'
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'password.set'
- extendedWaitUntil:
    visible:
      id: 'password.setCode'
    timeout: 15000
- takeScreenshot: set-password-open
