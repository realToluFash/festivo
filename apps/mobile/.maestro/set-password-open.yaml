# Settings > Security > Password > Set a password, on an app already open and signed in to an account with no password.
# No relaunch: on the iPhone a cold start drops the link and opens on Today (sc-36253). sc-13138.
#
#   node .qa/bin/qa-env.mjs maestro set-password-open --android
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- scrollUntilVisible:
    element:
      id: 'security.password'
    timeout: 60000
    centerElement: true
- tapOn:
    id: 'security.password'
- extendedWaitUntil:
    visible:
      id: 'security.code.field'
    timeout: 15000
- takeScreenshot: set-password-open
