# Control for sc-8508: the Password card's current-password field on the same run.
appId: host.exp.Exponent
---
- runFlow: sign-in-only.yaml
- waitForAnimationToEnd:
    timeout: 5000
- openLink: ${METRO_URL}/--/settings/security
- tapOn:
    text: 'Not Now'
    optional: true
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
- tapOn:
    id: 'password.change'
- scrollUntilVisible:
    element:
      id: 'password.current'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'password.current'
- waitForAnimationToEnd
- inputText: 'abc12345'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-typed
- scrollUntilVisible:
    element:
      id: 'password.current'
    direction: UP
    centerElement: true
- takeScreenshot: ${SHOT}-field
