# After request-link-hold.yaml: reopen the app and sign in with EMAIL and PASSWORD, from Sign in, and land on the held request. sc-19752.
# Pass EMAIL, PASSWORD and STOP (true: the app was force-quit since the hold, so the device's copy is taken).
appId: host.exp.Exponent
---
- runFlow:
    when:
      true: ${STOP == 'true'}
    file: request-link-reopen.yaml
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 90000
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- inputText: ${PASSWORD}
# The Go key on iOS, hideKeyboard and the tap on Android, as batch/sign-in-form.yaml does (sc-19584, sc-18648).
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
      - runFlow:
          when:
            visible: 'Save Password?'
          commands:
            - tapOn: 'Not Now'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: 'signIn.submit'
- extendedWaitUntil:
    notVisible:
      id: 'signIn.submit'
    timeout: 30000
# Only the request page has Ask to join: Home or the dead-link page here means the held link was lost.
- scrollUntilVisible:
    element:
      id: 'requestToJoin.ask'
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: request-link-held-signed-in
