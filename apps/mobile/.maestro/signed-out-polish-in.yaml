# The signed-out screens in English then the language CODE, named NAME. sc-28812.
#
#   node .qa/bin/qa-env.mjs maestro signed-out-polish-in CODE=pt NAME=Português [--ipad | --se | --android [--tablet]]
appId: host.exp.Exponent
---
- runFlow: sign-in-screen-english.yaml
- takeScreenshot: polish-sign-in-en
- scrollUntilVisible:
    element:
      id: 'signIn.register'
    direction: DOWN
- takeScreenshot: polish-sign-in-en-foot
- tapOn:
    id: 'language.open'
- extendedWaitUntil:
    visible:
      id: 'language.done'
    timeout: 10000
- assertVisible: 'Language'
- assertVisible: 'Your language follows you to every device.'
- takeScreenshot: polish-sheet-en
- tapOn:
    id: 'language.done'
- assertNotVisible:
    id: 'language.done'
- assertVisible: 'English'
- tapOn:
    id: 'language.open'
- tapOn:
    id: 'language.${CODE}'
- assertNotVisible:
    id: 'language.done'
- assertVisible: '${NAME}'
- takeScreenshot: polish-sign-in-${CODE}
- tapOn:
    id: 'language.open'
- extendedWaitUntil:
    visible:
      id: 'language.done'
    timeout: 10000
- takeScreenshot: polish-sheet-${CODE}
- tapOn:
    id: 'language.done'
- tapOn:
    id: 'signIn.register'
- extendedWaitUntil:
    visible:
      id: 'register.name'
    timeout: 10000
- takeScreenshot: polish-register-${CODE}
- back
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 10000
- tapOn:
    id: 'signIn.forgot'
- extendedWaitUntil:
    visible:
      id: 'recovery.email'
    timeout: 10000
- takeScreenshot: polish-forgot-${CODE}
- back
- runFlow: sign-in-screen-english.yaml
