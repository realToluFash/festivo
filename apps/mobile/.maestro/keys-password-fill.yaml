# Change your password open, a wrong current password and a valid new one typed, keys up on New password. sc-13408.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/security
- extendedWaitUntil:
    visible:
      id: 'password.change'
    timeout: 30000
- tapOn:
    id: 'password.change'
- tapOn:
    id: 'password.current'
- inputText: 'wrong-current-password-1'
- tapOn:
    id: 'password.new'
- inputText: 'brand-new-password-123'
- takeScreenshot: mobile-13408-password-fill
