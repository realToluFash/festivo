# Settings > Organisation > Ownership and leaving: "Leave ‹organisation›?" open, not yet sent.
# On a signed-in phone, as a member who is not the only owner. sc-12511.
#
# A second member, made through the api (sc-12999):
#   1. qa-env account --ready for it; --json stops it at "A few details".
#   2. As the owner, POST /api/orgs/{organisationId}/members/invite {email, roleId}, with
#      roleId from GET /api/orgs/{organisationId}/roles; without roleId it answers 422.
#   3. As the second account, POST /api/invitations/{invitationId}/accept.
#   4. Its member's `id` (the membership's, not `user.id`) from
#      GET /api/orgs/{organisationId}/members, then
#      ownership-transfer-ready MEMBERSHIP=… TYPED=<owner's password>.
#   5. Then sign the phone in as the second account for this flow; the owner is still
#      the only owner, and gets the "only owner" notice instead.
#
#   node .qa/bin/qa-env.mjs maestro ownership-leave-open --android
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/organisation
- scrollUntilVisible:
    element:
      id: 'ownership.leave'
    timeout: 60000
- tapOn:
    id: 'ownership.leave'
- scrollUntilVisible:
    element:
      id: 'ownership.leave.stay'
    timeout: 30000
- takeScreenshot: ownership-leave-open
