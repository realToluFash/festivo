# Stops Expo Go and opens the app again from launch, leaving it where launch goes. sc-29923.
#   node .qa/bin/qa-env.mjs maestro sc29923-relaunch SHOT=…
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}
- extendedWaitUntil:
    visible:
      id: 'register.password'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
