# Home, from whatever the step before left open. `openLink` reaches a route without closing
# what sits over it or leaving another tab, so this closes the sheets and taps Home itself.
# Every shared flow starts here, so each can follow any other inside one flow.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/
- runFlow:
    when:
      visible:
        id: 'createOrganisation'
    commands:
      - tapOn:
          id: 'createOrganisation.cancel'
      - waitForAnimationToEnd
# The switcher's scrim closes it. Its edge clears the sheet by 20 points on any device.
- runFlow:
    when:
      visible:
        id: 'switcher\..+'
    commands:
      - tapOn:
          point: '50%,2%'
      - extendedWaitUntil:
          notVisible:
            id: 'switcher\..+'
          timeout: 10000
- runFlow:
    when:
      notVisible:
        id: 'home.openSettings'
    commands:
      - tapOn:
          id: 'frame.home'
- extendedWaitUntil:
    visible:
      id: 'home.openSettings'
    timeout: 30000
