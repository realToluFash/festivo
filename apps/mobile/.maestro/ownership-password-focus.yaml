# Probe: tap the password field once and leave the screen there, to read the hierarchy. sc-7715.
appId: host.exp.Exponent
---
- runFlow: sign-in-only.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: 'Not Now'
    optional: true
- openLink: ${METRO_URL}/--/settings/organisation
- tapOn:
    text: 'Not Now'
    optional: true
- scrollUntilVisible:
    element:
      id: 'ownership.transfer'
    timeout: 60000
- tapOn:
    id: 'ownership.transfer'
- scrollUntilVisible:
    element:
      id: 'ownership.owner.${MEMBER}'
    timeout: 15000
- tapOn:
    id: 'ownership.owner.${MEMBER}'
- scrollUntilVisible:
    element:
      id: 'ownership.password'
    centerElement: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-before-tap
- tapOn:
    id: 'ownership.password'
- takeScreenshot: ${SHOT}-just-tapped
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-settled
