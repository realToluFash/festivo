# Account opened, Find your time zone open, QUERY typed in its search. sc-19656.
#
# Waits on the Time zone row by id, not on the title: a flow run alone is not localised, and the
# row draws only once the account has loaded.
#
#   node .qa/bin/qa-env.mjs maestro time-zone-typed QUERY=…
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- scrollUntilVisible:
    element:
      id: 'account.zone'
    timeout: 30000
# Settled first, or on iOS the tap lands where the row was mid-scroll and Time zone never opens.
- waitForAnimationToEnd
- tapOn:
    id: 'account.zone'
# The flow fails here, rather than typing into nothing, when Time zone never opens. sc-32521.
- extendedWaitUntil:
    visible:
      id: 'account.zone.field'
    timeout: 15000
- tapOn:
    id: 'account.zone.field'
- inputText: ${QUERY}
