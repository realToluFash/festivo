# Account opened, Find your time zone open, QUERY typed in its search. sc-19656.
#
# Waits on the card by id, not on the title: a flow run alone is not localised, and the card
# draws only once the account has loaded.
#
#   node .qa/bin/qa-env.mjs maestro time-zone-typed QUERY=…
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/settings/account
- scrollUntilVisible:
    element:
      id: 'timeZone.change'
    timeout: 30000
# Settled first, or on iOS the tap lands where Change was mid-scroll and the sheet never opens.
- waitForAnimationToEnd
- tapOn:
    id: 'timeZone.change'
# The flow fails here, rather than typing into nothing, when the sheet never opens. sc-32521.
- extendedWaitUntil:
    visible:
      id: 'timeZone.search'
    timeout: 15000
- tapOn:
    id: 'timeZone.search'
- inputText: ${QUERY}
