# Types CODE at Code from the email and sends it; leaves the answer on screen. sc-13138.
# On Android, eraseText does not clear this field, so a second CODE is typed after the first:
# clear it with adb key events between runs.
#
#   node .qa/bin/qa-env.mjs maestro set-password-code --android CODE=…
appId: host.exp.Exponent
---
- tapOn:
    id: 'security.code.field'
- eraseText: 12
- inputText: ${CODE}
# On iOS Return, which sends the form: hideKeyboard fails on an iPhone (sc-19584). On
# Android Enter can type into the field instead (sc-18648), so it taps. No retry.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - tapOn:
          id: 'security.code.continue'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: set-password-code
