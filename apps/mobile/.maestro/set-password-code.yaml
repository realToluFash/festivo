# Types CODE at Code from the email and presses Continue; leaves the answer on screen. sc-13138.
# On Android, eraseText does not clear this field, so a second CODE is typed after the first:
# clear it with adb key events between runs.
#
#   node .qa/bin/qa-env.mjs maestro set-password-code --android CODE=…
appId: host.exp.Exponent
---
- tapOn:
    id: 'password.setCode'
- eraseText: 12
- inputText: ${CODE}
- hideKeyboard
- tapOn:
    id: 'password.setContinue'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: set-password-code
