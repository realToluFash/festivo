# Release build, signed in: launch it again and open Settings from the floating bar, left open. sc-37298.
appId: com.soirely.app
---
- stopApp: com.soirely.app
- launchApp:
    appId: com.soirely.app
- extendedWaitUntil:
    visible:
      id: 'home.openSettings'
    timeout: 60000
- tapOn:
    id: 'home.openSettings'
- extendedWaitUntil:
    visible:
      id: 'settings.account'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
