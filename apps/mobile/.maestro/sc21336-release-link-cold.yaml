# sc-21336, release build: signed in as EMAIL, the app stopped, then opened by ${EVENT_ID}'s Edit details link (soirely://events/<id>/edit); ' Cold' typed, Save changes opens the event's page with the new name and Saved; back does not show Edit details.
appId: com.soirely.app
---
- launchApp:
    appId: com.soirely.app
- extendedWaitUntil:
    visible: 'Sign in|.*signed in to.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Sign in'
    commands:
      - tapOn: 'Sign in'
      - extendedWaitUntil:
          visible:
            id: 'signIn.email'
          timeout: 30000
- runFlow:
    when:
      visible:
        id: 'signIn.email'
    commands:
      - tapOn:
          id: 'signIn.email'
      - inputText: ${EMAIL}
      - scrollUntilVisible:
          element:
            id: 'signIn.password'
          direction: DOWN
          centerElement: true
      - tapOn:
          id: 'signIn.password'
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - runFlow:
          when:
            visible:
              id: 'signIn.submit'
            platform: Android
          commands:
            - hideKeyboard
            - tapOn:
                id: 'signIn.submit'
- extendedWaitUntil:
    visible:
      id: 'home.openSettings'
    timeout: 60000
- stopApp: com.soirely.app
- openLink: soirely://events/${EVENT_ID}/edit
- extendedWaitUntil:
    visible:
      id: 'eventForm.name'
    timeout: 60000
- takeScreenshot: release-cold-opened
- tapOn:
    id: 'eventForm.name'
- inputText: ' Cold'
- tapOn: 'Event name'
- scrollUntilVisible:
    element:
      id: 'eventForm.send'
    direction: DOWN
- tapOn:
    id: 'eventForm.send'
- extendedWaitUntil:
    visible:
      id: 'events.page'
    timeout: 3000
- assertNotVisible:
    id: 'eventForm.name'
- takeScreenshot: release-cold-saved
- assertVisible: '(Saved|Modifications enregistrées)'
- assertVisible: '.*Cold.*'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'frame.back'
- waitForAnimationToEnd
- takeScreenshot: release-cold-back
- assertNotVisible:
    id: 'eventForm.name'
