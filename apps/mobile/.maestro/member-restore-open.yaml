# Settings > Members > Suspended > a suspended member's page, scrolled to its Restore button, not tapped. sc-11042.
#
#   node .qa/bin/qa-env.mjs maestro member-restore-open --android EMAIL=… PASSWORD=… LANGUAGE=… MEMBER=<membership id> SHOT=…
appId: host.exp.Exponent
---
- runFlow: sign-in-in.yaml
- extendedWaitUntil:
    notVisible:
      id: 'signIn.submit'
    timeout: 30000
- waitForAnimationToEnd
- openLink: ${METRO_URL}/--/settings/members
- extendedWaitUntil:
    visible:
      id: 'members.filter.suspended'
    timeout: 30000
- tapOn:
    id: 'members.filter.suspended'
- scrollUntilVisible:
    element:
      id: 'members.row.${MEMBER}'
- tapOn:
    id: 'members.row.${MEMBER}'
- scrollUntilVisible:
    element:
      id: 'members.restore'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-before
