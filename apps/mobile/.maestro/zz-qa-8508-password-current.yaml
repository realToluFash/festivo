# sc-8508 regression: the Password card's current-password field takes input; a shot where the keys lift it, then Show once it is clear of the header.
appId: host.exp.Exponent
---
- runFlow: sign-in-only.yaml
- waitForAnimationToEnd:
    timeout: 5000
- openLink: ${METRO_URL}/--/settings/security
- tapOn:
    text: 'Not Now'
    optional: true
- scrollUntilVisible:
    element:
      id: 'password.change'
    timeout: 30000
- tapOn:
    id: 'password.change'
- scrollUntilVisible:
    element:
      id: 'password.current'
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'password.current'
- waitForAnimationToEnd
- inputText: 'curpass-abc'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-current-lifted
- scrollUntilVisible:
    element:
      id: 'password.current.reveal'
    direction: UP
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'password.current.reveal'
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}-current-revealed
