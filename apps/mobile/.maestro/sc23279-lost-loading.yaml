# Signs in to the code step, holds 20 seconds (pause the api container meanwhile: docker compose
# pause api), opens Lost your authenticator and your recovery codes?, and checks the screen says
# Loading… (testID pending) under ‹ Enter your code while lost two-factor opens. Pass EMAIL and
# PASSWORD of a two-factor account. sc-23279.
appId: host.exp.Exponent
---
- runFlow:
    file: sign-in-code-step-open.yaml
    env:
      LANGUAGE: English
- extendedWaitUntil:
    visible:
      id: 'never-there'
    timeout: 20000
    optional: true
- tapOn:
    id: 'twoFactor.lostBoth'
- extendedWaitUntil:
    visible:
      id: 'pending'
    timeout: 10000
- assertVisible: 'Loading.*'
- assertVisible:
    id: 'lostTwoFactor.backToCode'
- takeScreenshot: mobile-lost-loading
