# Sign in with the language chosen first, by its chip (English, Español, Français, Português). sc-2939.
# A run inherits whatever language the last one left, so the flow says which it wants.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 60000
- scrollUntilVisible:
    element: '${LANGUAGE}'
- tapOn: '${LANGUAGE}'
- tapOn:
    id: 'signIn.email'
- eraseText: 120
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- eraseText: 120
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'signIn.submit'
