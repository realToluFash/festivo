# Signs in with EMAIL and PASSWORD (two-factor on) in LANGUAGE and stops on the code step.
# sc-22740.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
- extendedWaitUntil:
    visible:
      id: 'signIn.email|home.openSignIn'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'home.openSignIn'
    commands:
      - tapOn:
          id: 'home.openSignIn'
- extendedWaitUntil:
    visible:
      id: 'signIn.email'
    timeout: 20000
- scrollUntilVisible:
    element: '${LANGUAGE}'
- tapOn: '${LANGUAGE}'
- tapOn:
    id: 'signIn.email'
- eraseText: 60
- inputText: ${EMAIL}
- tapOn:
    id: 'signIn.password'
- inputText: ${PASSWORD}
- tapOn:
    id: 'signIn.submit'
- extendedWaitUntil:
    visible:
      id: 'twoFactor.code'
    timeout: 30000
