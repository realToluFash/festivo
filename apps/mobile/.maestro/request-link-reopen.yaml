# Force-quit Expo Go and reopen the app on Sign in, so a held link can only come from the device's store. sc-19752.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    stopApp: true
- openLink: ${METRO_URL}/--/sign-in
# On iOS the cold launch lands on the app root under the developer menu: close it and open Sign in again.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Go home|Sign in'
          timeout: 90000
      - waitForAnimationToEnd
      - runFlow: expo-go-menu.yaml
      - openLink: ${METRO_URL}/--/sign-in
