server {
    listen 80;
    root /usr/share/nginx/html;

    # Written by the entrypoint before nginx starts, because the policy has to
    # name the API and Mercure origins and those are per-deployment. nginx
    # refuses to start if the file is absent, which is the direction this should
    # fail in: a served page with no policy looks exactly like a served page.
    include /etc/nginx/soirely-security-headers.conf;

    # A single-page application: every unknown path is the application's to
    # route, not a 404 from the server. Without this, a guest opening an
    # invitation link directly gets nginx's 404 rather than the page.
    location / {
        # Repeated in every location on purpose. A location that adds a header
        # of its own discards every add_header inherited from the server block,
        # so the two cache rules below would otherwise serve the application's
        # only JavaScript with no policy attached to it.
        include /etc/nginx/soirely-security-headers.conf;

        try_files $uri $uri/ /index.html;
    }

    # Never cached, in contrast to everything else here. This file is the one
    # thing that differs between deployments, and a cached copy from the
    # previous one points the browser at the previous API.
    location = /config.json {
        include /etc/nginx/soirely-security-headers.conf;

        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Android verifies App Links against this file, and must get JSON or a 404,
    # never the application's index.html from the fallback above.
    location = /.well-known/assetlinks.json {
        include /etc/nginx/soirely-security-headers.conf;

        default_type application/json;
        try_files $uri =404;
    }

    # Content-hashed by the build, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/soirely-security-headers.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
