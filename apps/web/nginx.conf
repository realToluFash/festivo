# A guest's page carries their link's token in its path (sc-1526): it sends no
# referrer, is never indexed, and its token never reaches the access log. The
# summary's unsubscribe page (sc-4331) holds its token after the #, which never
# reaches the server, and is kept out of referrers and indexes all the same.
map $request_uri $soirely_referrer_policy {
    ~^/i/                no-referrer;
    ~^/unsubscribe/      no-referrer;
    default strict-origin-when-cross-origin;
}

map $request_uri $soirely_robots {
    ~^/i/                "noindex, nofollow";
    ~^/unsubscribe/      "noindex, nofollow";
    default "";
}

map $request_uri $soirely_logged_uri {
    ~^/i/   /i/-;
    default $request_uri;
}

map $http_referer $soirely_logged_referer {
    ~/i/    -;
    default $http_referer;
}

# Added to the stock map rather than replacing it: a types block inside a
# location would drop js and css from that location's map.
types {
    font/ttf ttf;
}

log_format soirely '$remote_addr - $remote_user [$time_local] "$request_method $soirely_logged_uri $server_protocol" '
                   '$status $body_bytes_sent "$soirely_logged_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log soirely;

    # Written by the entrypoint before nginx starts, because the policy has to
    # name the API and Mercure origins and those are per-deployment. nginx
    # refuses to start if the file is absent, which is the direction this should
    # fail in: a served page with no policy looks exactly like a served page.
    include /etc/nginx/soirely-security-headers.conf;

    # A single-page application: every unknown path is the application's to
    # route, not a 404 from the server. Without this, a guest opening an
    # invitation link directly gets nginx's 404 rather than the page.
    location / {
        # Repeated in every location on purpose. A location that adds a header
        # of its own discards every add_header inherited from the server block,
        # so the two cache rules below would otherwise serve the application's
        # only JavaScript with no policy attached to it.
        include /etc/nginx/soirely-security-headers.conf;

        try_files $uri $uri/ /index.html;
    }

    # A guest's link answers a chat app with its event's card (sc-89272): chat
    # apps read the head as sent and run no JavaScript, so the API writes the
    # title and the Open Graph tags into the page here. The token goes to the
    # API in a header, never a path, so no log keeps it. If the API does not
    # answer, the page is served with today's title.
    # The capture is the token's base64url alphabet: a decoded line break would
    # otherwise become a header of its own. nginx writes a failed subrequest's
    # error with the main request's line, and applies a location's error_log only
    # to the main request, so the threshold is raised here, not in /_link-card.
    location ~ ^/i/(?<soirely_guest_link>[A-Za-z0-9_-]+)$ {
        error_log /var/log/nginx/error.log crit;
        include /etc/nginx/soirely-security-headers.conf;

        ssi on;
        sub_filter_once on;
        sub_filter '<title>Soirely</title>' '<!--# block name="soirely_title" --><title>Soirely</title><!--# endblock --><!--# include virtual="/_link-card" stub="soirely_title" -->';
        try_files /index.html =404;
    }

    location = /_link-card {
        internal;
        include /etc/nginx/soirely-api.conf;

        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header X-Guest-Link $soirely_guest_link;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass $soirely_api/api/guest-links/card;
    }

    # Never cached, in contrast to everything else here. This file is the one
    # thing that differs between deployments, and a cached copy from the
    # previous one points the browser at the previous API.
    location = /config.json {
        include /etc/nginx/soirely-security-headers.conf;

        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Android verifies App Links against this file, and must get JSON or a 404,
    # never the application's index.html from the fallback above.
    location = /.well-known/assetlinks.json {
        include /etc/nginx/soirely-security-headers.conf;

        default_type application/json;
        try_files $uri =404;
    }

    # iOS fetches this without an extension and needs it as JSON (sc-86888).
    location = /.well-known/apple-app-site-association {
        include /etc/nginx/soirely-security-headers.conf;

        default_type application/json;
        try_files $uri =404;
    }

    # Content-hashed by the build, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/soirely-security-headers.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
