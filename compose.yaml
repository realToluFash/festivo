# The local stack.
#
# `docker compose up -d` from the repository root. Every service declares a
# healthcheck and dependents wait on it being healthy rather than on the
# container merely having started — "it started" and "it can answer" are
# different facts, and the gap between them is where flaky local setups live.

name: soirely

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soirely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soirely}
      POSTGRES_DB: ${POSTGRES_DB:-soirely}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The database name is named explicitly: pg_isready succeeds against the
      # cluster before the database itself is created on first boot.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-soirely} -d ${POSTGRES_DB:-soirely}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:v0.16
    environment:
      # Two different keys on purpose. The API publishes with one; clients
      # subscribe with the other. One shared key would let any subscriber
      # publish, which on this product means any guest's browser could forge a
      # service-floor update.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_KEY:-dev-publisher-key-change-me}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_KEY:-dev-subscriber-key-change-me}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:-http://localhost:5173 http://localhost:8081 http://localhost:19006}
        subscriptions
      # Caddy writes a cert store it cannot reach as a read-only user otherwise.
      SERVER_NAME: ':80'
    ports:
      - '${MERCURE_PORT:-3000}:80'
    volumes:
      - mercure-data:/data
      - mercure-config:/config
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
      MERCURE_PUBLISH_URL: ${MERCURE_PUBLISH_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_PUBLISHER_KEY: ${MERCURE_PUBLISHER_KEY}
      # FrankenPHP serves plain HTTP here; TLS terminates upstream in deployment.
      SERVER_NAME: ':80'
    volumes:
      # The whole directory, vendor included. An anonymous volume over /app/vendor
      # looks tidier and is a trap: Docker reuses the existing volume rather than
      # taking the rebuilt image's, so a newly required package is missing inside
      # the container while being present on the host, and the error names the
      # class rather than the cause. Composer runs through a container that writes
      # to the host (scripts/php-tool.mjs), so the host vendor is always current.
      - ./services/api:/app
    ports:
      - '${API_PORT:-8080}:80'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Local provider sinks ────────────────────────────────────────────────────
  # Nothing here reaches a real provider. Switching to one is a change to
  # environment variables only — see .env.example.

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  smocker:
    image: thiht/smocker:0.18.5
    ports:
      - '${SMOCKER_MOCK_PORT:-8086}:8080'
      - '${SMOCKER_UI_PORT:-8088}:8081'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8081/version']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Loads the SMS mock definitions, then exits. `docker compose up smocker-init`
  # re-loads them after editing infra/smocker/mocks.yml.
  smocker-init:
    image: curlimages/curl:8.11.0
    depends_on:
      smocker:
        condition: service_healthy
    volumes:
      - ./infra/smocker:/mocks:ro
    entrypoint:
      - sh
      - -c
      - 'curl -fsS -XPOST --header "Content-Type: application/x-yaml"
        --data-binary "@/mocks/mocks.yml"
        "http://smocker:8081/mocks?reset=true" && echo "SMS mocks loaded"'
    restart: 'no'

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      # The container reads its config from this variable, not from a file.
      JSON_CONFIG_PATH: /config/oidc.json
      PORT: 8080
    volumes:
      - ./infra/oidc:/config:ro
    ports:
      - '${OIDC_PORT:-8089}:8080'
    # No healthcheck: this image is distroless — no shell, no wget, no curl — so
    # any check would fail forever while the service answered normally, and a
    # permanently red status is worse than none. Check it from the host instead:
    #   curl -sf localhost:8089/google/.well-known/openid-configuration
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mercure-data:
  mercure-config:
