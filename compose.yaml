# The local stack.
#
# `docker compose up -d` from the repository root. Every service declares a
# healthcheck and dependents wait on it being healthy rather than on the
# container merely having started — "it started" and "it can answer" are
# different facts, and the gap between them is where flaky local setups live.

name: soirely

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soirely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soirely}
      POSTGRES_DB: ${POSTGRES_DB:-soirely}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The database name is named explicitly: pg_isready succeeds against the
      # cluster before the database itself is created on first boot.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-soirely} -d ${POSTGRES_DB:-soirely}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine3.21
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:v0.16.3
    environment:
      # Two different keys on purpose. The API publishes with one; clients
      # subscribe with the other. One shared key would let any subscriber
      # publish, which on this product means any guest's browser could forge a
      # service-floor update.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_KEY:-dev-publisher-key-change-me}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_KEY:-dev-subscriber-key-change-me}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:-http://localhost:5173 http://localhost:8081 http://localhost:19006}
        subscriptions
        heartbeat 15s
      # Caddy writes a cert store it cannot reach as a read-only user otherwise.
      SERVER_NAME: ':80'
    ports:
      - '${MERCURE_PORT:-3000}:80'
    volumes:
      - mercure-data:/data
      - mercure-config:/config
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      target: dev
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOCALES_FILE: /locales.json
      EVENT_STATES_FILE: /event-states.json
      ADDRESS_ENDPOINT: ${ADDRESS_ENDPOINT}
      ADDRESS_USER_AGENT: ${ADDRESS_USER_AGENT}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT}
      STORAGE_KEY: ${STORAGE_KEY}
      STORAGE_SECRET: ${STORAGE_SECRET}
      STORAGE_BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE}
      STORAGE_BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC}
      STORAGE_REGION: ${STORAGE_REGION}
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Soirely <no-reply@soirely.com>}
      SMS_API_BASE: ${SMS_API_BASE:-http://smocker:8080}
      SMS_ACCOUNT_SID: ${SMS_ACCOUNT_SID:-ACdevelopment00000000000000000000}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-development-token}
      SMS_FROM: ${SMS_FROM:-+447700900999}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-1}
      PHONE_CODES_SMS_ONLY_COUNTRIES: ${PHONE_CODES_SMS_ONLY_COUNTRIES:-US}
      WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-http://smocker:8080/whatsapp/v21.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-development}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-development-token}
      WHATSAPP_CODE_TEMPLATE: ${WHATSAPP_CODE_TEMPLATE:-soirely_code}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-development-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-development-app-secret}
      OAUTH_GOOGLE_ISSUERS: ${OAUTH_GOOGLE_ISSUERS:-http://localhost:8089/google,http://oidc:8080/google}
      OAUTH_GOOGLE_JWKS_URI: ${OAUTH_GOOGLE_JWKS_URI:-http://oidc:8080/google/jwks}
      OAUTH_GOOGLE_CLIENT_IDS: ${OAUTH_GOOGLE_CLIENT_IDS:-soirely-web,soirely-app}
      OAUTH_GOOGLE_TOKEN_URI: ${OAUTH_GOOGLE_TOKEN_URI:-http://oidc:8080/google/token}
      OAUTH_GOOGLE_WEB_CLIENT_ID: ${OAUTH_GOOGLE_WEB_CLIENT_ID:-soirely-web}
      OAUTH_GOOGLE_WEB_CLIENT_SECRET: ${OAUTH_GOOGLE_WEB_CLIENT_SECRET:-development-secret}
      OAUTH_APPLE_ISSUERS: ${OAUTH_APPLE_ISSUERS:-http://localhost:8089/apple,http://oidc:8080/apple,https://appleid.apple.com}
      OAUTH_APPLE_JWKS_URIS: ${OAUTH_APPLE_JWKS_URIS:-http://oidc:8080/apple/jwks,https://appleid.apple.com/auth/keys}
      OAUTH_APPLE_CLIENT_IDS: ${OAUTH_APPLE_CLIENT_IDS:-soirely-web,soirely-app,com.soirely.app,host.exp.Exponent}
      OAUTH_APPLE_TOKEN_URI: ${OAUTH_APPLE_TOKEN_URI:-http://oidc:8080/apple/token}
      OAUTH_APPLE_WEB_CLIENT_ID: ${OAUTH_APPLE_WEB_CLIENT_ID:-soirely-web}
      OAUTH_APPLE_WEB_CLIENT_SECRET: ${OAUTH_APPLE_WEB_CLIENT_SECRET:-development-secret}
      # Must equal the return route the app sends Apple; defaults to this stack's own API port.
      OAUTH_APPLE_RETURN_URI: ${OAUTH_APPLE_RETURN_URI:-http://localhost:${API_PORT:-8080}/api/auth/oauth/apple/return}
      CORS_WEB_ORIGIN: ${CORS_WEB_ORIGIN:-http://localhost:5173}
      CORS_EXPO_WEB_ORIGIN: ${CORS_EXPO_WEB_ORIGIN:-http://localhost:8081}
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
      MERCURE_PUBLISH_URL: ${MERCURE_PUBLISH_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_PUBLISHER_KEY: ${MERCURE_PUBLISHER_KEY}
      # The assistant. Defaults to the in-process stand-in, so the stack comes
      # up assisted without a provider account and nothing here is billable.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-scripted}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-medium}
      ASSISTANT_MAX_TOKENS: ${ASSISTANT_MAX_TOKENS:-16000}
      # FrankenPHP serves plain HTTP here; TLS terminates upstream in deployment.
      SERVER_NAME: ':80'
    volumes:
      # The whole directory, vendor included. An anonymous volume over /app/vendor
      # looks tidier and is a trap: Docker reuses the existing volume rather than
      # taking the rebuilt image's, so a newly required package is missing inside
      # the container while being present on the host, and the error names the
      # class rather than the cause. Composer runs through a container that writes
      # to the host (scripts/php-tool.mjs), so the host vendor is always current.
      - ./services/api:/app
      # The locale declaration lives at the repository root because the web and
      # mobile clients read it too. Mounted read-only at a fixed path rather
      # than reached by path arithmetic from inside the application.
      - ./locales.json:/locales.json:ro
      # What each event state allows, which the clients read too (sc-3584).
      - ./event-states.json:/event-states.json:ro
    ports:
      - '${API_PORT:-8080}:80'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
      # S3, locally.
  #
  # LocalStack rather than MinIO: MinIO's images are no longer pullable from
  # Docker Hub, and an unavailable base image is a stack that cannot be brought
  # up on a new machine. Scoped to S3 so this is not the whole of AWS.
  storage:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${STORAGE_KEY:-soirely}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET:-soirely-dev-secret}
      PERSISTENCE: 1
    ports:
      - '${STORAGE_PORT:-4566}:4566'
    volumes:
      - storage-data:/var/lib/localstack
    healthcheck:
      # Accepts "available" (ready, unused) and "running" (ready, used). Matching
      # only the first reports a working stack as unhealthy the moment anything
      # touches it.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4566/_localstack/health | grep -qE
          '"s3": ?"(available|running)"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Creates the buckets and exits. Re-run after changing them:
  #   docker compose up storage-init
  storage-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      storage:
        condition: service_healthy
    environment:
      BUCKET_PRIVATE: ${STORAGE_BUCKET_PRIVATE:-soirely-private}
      BUCKET_PUBLIC: ${STORAGE_BUCKET_PUBLIC:-soirely-public}
      AWS_ACCESS_KEY_ID: ${STORAGE_KEY:-soirely}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET:-soirely-dev-secret}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
    entrypoint:
      - sh
      - -c
      - |
        E=http://storage:4566
        aws --endpoint-url $$E s3 mb s3://$${BUCKET_PRIVATE} 2>/dev/null || true
        aws --endpoint-url $$E s3 mb s3://$${BUCKET_PUBLIC} 2>/dev/null || true

        # Deny anonymous reads on the private bucket EXPLICITLY. Relying on a
        # default is how a local environment ends up more permissive than
        # production, and the difference stays invisible until something
        # private turns out to be readable by anybody holding the URL.
        aws --endpoint-url $$E s3api put-public-access-block \
          --bucket $${BUCKET_PRIVATE} \
          --public-access-block-configuration \
          BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

        # The public bucket is public on purpose: an invitation page is read by
        # a guest with no account and no credentials.
        aws --endpoint-url $$E s3api put-bucket-policy --bucket $${BUCKET_PUBLIC} --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::'$${BUCKET_PUBLIC}'/*"}]}'

        echo "buckets ready"
    restart: 'no'

  # The web client.
  #
  # Deliberately NOT depends_on the api. The bundle is static and finds the API
  # from the browser at runtime, so coupling the two means the web container
  # refuses to start exactly when the API is broken — which is when somebody
  # wants to open the status page and find out.
  web:
    build:
      # The repository root, because the image installs the workspace: the web
      # app depends on packages/api-client and packages/domain, and a context of
      # apps/web cannot see either.
      context: .
      dockerfile: apps/web/Dockerfile
      target: serve
    environment:
      # From the BROWSER, not from inside this network. `api` resolves in here
      # and nowhere in the user's browser, and that mistake produces a client
      # that works in curl and fails on screen.
      SOIRELY_API_URL: ${SOIRELY_API_URL:-http://localhost:8080}
      SOIRELY_MERCURE_URL: ${SOIRELY_MERCURE_URL:-http://localhost:3000/.well-known/mercure}
      SOIRELY_ENVIRONMENT: ${APP_ENV:-dev}
      # The local sign-in sandbox (service `oidc`) stands in for Google.
      SOIRELY_GOOGLE_AUTHORIZE_URL: ${SOIRELY_GOOGLE_AUTHORIZE_URL:-http://localhost:8089/google/authorize}
      SOIRELY_GOOGLE_CLIENT_ID: ${SOIRELY_GOOGLE_CLIENT_ID:-soirely-web}
      SOIRELY_APPLE_AUTHORIZE_URL: ${SOIRELY_APPLE_AUTHORIZE_URL:-http://localhost:8089/apple/authorize}
      SOIRELY_APPLE_CLIENT_ID: ${SOIRELY_APPLE_CLIENT_ID:-soirely-web}
    ports:
      - '${WEB_PORT:-5173}:80'
    healthcheck:
      # Checks the file the entrypoint writes, not just that nginx answers.
      # nginx serving a stale or missing config.json is the failure worth
      # catching, and "the port is open" does not catch it.
      #
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first, nginx
      # listens on IPv4 only, and the check failed forever against a container
      # serving perfectly well.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/config.json | grep -q apiBaseUrl']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Local provider sinks ────────────────────────────────────────────────────
  # Nothing here reaches a real provider. Switching to one is a change to
  # environment variables only — see .env.example.

  mailpit:
    image: axllent/mailpit:v1.21.8
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  smocker:
    image: thiht/smocker:0.18.5
    ports:
      - '${SMOCKER_MOCK_PORT:-8086}:8080'
      - '${SMOCKER_UI_PORT:-8088}:8081'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8081/version']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Loads the SMS mock definitions, then exits. `docker compose up smocker-init`
  # re-loads them after editing infra/smocker/mocks.yml.
  smocker-init:
    image: curlimages/curl:8.11.0
    depends_on:
      smocker:
        condition: service_healthy
    volumes:
      - ./infra/smocker:/mocks:ro
    entrypoint:
      - sh
      - -c
      - 'curl -fsS -XPOST --header "Content-Type: application/x-yaml"
        --data-binary "@/mocks/mocks.yml"
        "http://smocker:8081/mocks?reset=true" && echo "SMS mocks loaded"'
    restart: 'no'

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      # The container reads its config from this variable, not from a file.
      JSON_CONFIG_PATH: /config/oidc.json
      PORT: 8080
    volumes:
      - ./infra/oidc:/config:ro
    ports:
      - '${OIDC_PORT:-8089}:8080'
    # The image is distroless: no shell, no wget, no curl. It does carry a JDK,
    # and Java runs a single source file directly, so the check is a few lines
    # of Java mounted with the config. Each run starts a JVM, about a second and
    # a half, hence the longer timeout.
    healthcheck:
      test: ['CMD', 'java', '/config/Healthcheck.java']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  storage-data:
  postgres-data:
  redis-data:
  mercure-data:
  mercure-config:
