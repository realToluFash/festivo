# Checks on every pull request, scoped to what it touched.
#
# A monorepo that runs the whole estate on a one-line web change wastes minutes
# on every pull request and teaches people to stop reading the result — so each
# surface is a separate job with its own trigger and its own name. A failure
# says which surface failed from the checks list, without opening a log.
#
# Drafts ARE checked. GitHub runs `pull_request` on a draft by default and that
# default is kept deliberately: "no checks appeared" gets diagnosed as a broken
# pipeline for an afternoon before anybody thinks to look at the draft flag.

name: Pull request

on:
  pull_request:
    branches: [main]
  # So `main` has its own history of green, and a branch-protection rule has
  # results to require.
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight. Without this a branch pushed three
  # times holds three sets of runners and the newest result arrives last.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── What changed ────────────────────────────────────────────────────────────
  #
  # Computed with git rather than a third-party action. It is twenty lines, it
  # is readable in place, and it adds nothing to the set of things that can
  # reach this repository's secrets.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      packages: ${{ steps.filter.outputs.packages }}
      locales: ${{ steps.filter.outputs.locales }}
      everything: ${{ steps.filter.outputs.everything }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to exist locally.
          fetch-depth: 0

      - id: filter
        name: Decide which surfaces to check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A force-push or a first commit leaves no usable base. Everything
          # runs rather than nothing — a filter that cannot tell what changed
          # must not conclude that nothing did.
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; checking everything."
            node scripts/changed-surfaces.mjs --all < /dev/null | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          git diff --name-only "${BASE}" "${HEAD}"

          # The patterns live in the script, not here, so the test that asserts
          # them cannot drift from what CI actually does. This is the only real
          # logic in the workflow and the thing most likely to be quietly wrong:
          # a pattern matching nothing means a surface silently stops being
          # checked while the pull request still goes green.
          git diff --name-only "${BASE}" "${HEAD}" \
            | node scripts/changed-surfaces.mjs \
            | tee -a "$GITHUB_OUTPUT"

  # ── Repository-wide, and cheap ──────────────────────────────────────────────
  lint:
    name: Repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      # The web client's CSS, and the rule that keeps colour literals in the
      # generated token file rather than spreading through the stylesheet.
      - run: npm run lint:css
      - run: npm run format:check
      # Lints this workflow, including shellcheck over every `run:` block.
      - run: npm run lint:actions
      # And tests the change filter above. It always runs, because a filter that
      # stopped matching a surface would otherwise hide its own failure: the
      # surface silently goes unchecked and the pull request still goes green.
      - name: CI change filter
        run: npm run test:scripts
      # The roles' work queue, tools/queue: Python's standard library only.
      - name: Work queue
        run: npm run test:queue

  # ── Comments, because the hook that checks them can be skipped ──────────────
  #
  # The pre-commit hook runs the same script, and `--no-verify` turns it off.
  # This is the copy that cannot be bypassed.
  comments:
    name: Comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison have to exist locally.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comments added by this change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # No commit to compare against means nothing to say, and the script
        # reports that rather than passing silently.
        run: node scripts/check-comments.mjs --against "$BASE"

  # ── The API, in the same container a developer runs ─────────────────────────
  #
  # Through docker compose rather than a PHP installed on the runner. It is
  # slower than setup-php by about a minute, and it is what makes "the same
  # shape on every machine" true rather than aspirational: CI runs the exact
  # command from the README, against the exact image, with the same extensions.
  # A green CI and a red laptop is worse than a slow CI.
  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Local environment
        # `.env` is gitignored, and compose reads DATABASE_URL and the rest from
        # it. A fresh clone creates it from the example — `npm run setup` does
        # exactly this — so CI does too rather than inventing its own values,
        # which would then drift from what a developer runs against.
        run: cp .env.example .env

      - run: npm ci

      - name: PHP dependencies, onto the host
        # Onto the HOST, which looks odd for a containerised service and is
        # required: compose bind-mounts services/api over the image's /app,
        # vendor included. That is deliberate (see compose.yaml) — the host's
        # vendor is always the current one — and it means the host must have
        # one. Without this the container starts and `bin/console` reports
        # "Dependencies are missing", naming composer rather than the mount.
        run: node scripts/php-tool.mjs composer install

      - name: Bring up what the API needs
        # --wait, so the next step starts when each service can ANSWER rather
        # than when its container exists. Every healthcheck in compose exists
        # for this moment.
        #
        # storage is in here because the suite reaches it: the object-store
        # tests sign a URL and then fetch it, which is the point of them — a
        # signature the provider rejects is the failure worth catching, and a
        # mocked store cannot catch it.
        run: docker compose up -d --wait postgres redis storage

      - name: Create the buckets
        # A one-shot that exits. Without it the store is up and empty, and
        # every upload fails on a bucket that does not exist.
        run: docker compose up storage-init

      # Built from scratch, the image spends most of two minutes compiling PHP
      # extensions that change only when the Dockerfile does. The key follows
      # the two files that decide the layers; a miss falls back to the newest
      # cache, so a composer.lock change rebuilds only the composer layer.
      - name: Restore the API image's layers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/api-build-cache
          key: api-image-${{ hashFiles('services/api/Dockerfile', 'services/api/composer.lock') }}
          restore-keys: api-image-

      - name: Build the API image
        # buildx directly rather than `docker compose build`: compose asks for
        # an interactive approval before writing a cache directory, and CI has
        # nobody to give it. The tag is the name compose looks for, so the next
        # step starts this image instead of building its own. The default
        # docker driver cannot export a cache, hence the docker-container
        # builder. The cache goes to a fresh directory and is swapped in after;
        # exporting over the one it read from only ever grows.
        env:
          API_BUILD_CACHE: ${{ runner.temp }}/api-build-cache
          API_BUILD_CACHE_NEXT: ${{ runner.temp }}/api-build-cache-next
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build services/api \
            --target dev \
            --tag "$(docker compose config --format json | jq -r .name)-api" \
            --cache-from "type=local,src=${API_BUILD_CACHE}" \
            --cache-to "type=local,dest=${API_BUILD_CACHE_NEXT},mode=max" \
            --load
          rm -rf "$API_BUILD_CACHE"
          mv "$API_BUILD_CACHE_NEXT" "$API_BUILD_CACHE"

      - name: Start the API
        run: docker compose up -d api

      - name: Let the API container write what it has to write
        # The checkout is owned by the runner's user and the api container runs
        # as 1000, so anything the container creates inside the bind mount fails
        # on permissions. Two places need it, for unrelated reasons:
        #
        # mago's composer package is a PHP shim that downloads its platform
        # binary into vendor on first use, and the path is fixed inside vendor
        # with no environment variable to move it. The install step cannot warm
        # it either, because the binary is libc-specific — the composer image is
        # Alpine and fetches -musl while the api image is Debian and needs -gnu.
        #
        # The JWT keys are generated per environment, because a signing key in a
        # repository is a key every clone can mint tokens with. The directory is
        # committed (config/jwt/.gitkeep) so only the files need writing.
        #
        # Scoped to those two directories rather than to the tree, and the
        # runner is thrown away afterwards. Neither reproduces locally: Docker
        # Desktop's bind mount ignores the uid mismatch entirely.
        run: |
          chmod -R a+w services/api/vendor/carthage-software/mago
          chmod a+w services/api/config/jwt

      - name: Generate the JWT signing keypair
        run: docker compose exec -T api php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create a throwaway database and migrate it
        # Drops and recreates, so a removed migration is actually gone — the
        # only way to be sure of that.
        run: npm run test:db

      - name: Tests
        run: npm run test:api

      - name: PHP formatting
        run: npm run lint:php

      - name: Lint
        # mago's linter. Its baseline holds the issues that existed when it was
        # adopted, so this fails on a new one and not on the backlog — see
        # services/api/.build/mago/lint-baseline.toml for what is in there and
        # why.
        run: npm run lint:api

      - name: Static analysis
        # Types, inference and reachability. No baseline: this is clean, and the
        # job is what keeps it that way.
        #
        # It is the only check here that reads a signature rather than a shape.
        # It has already caught a truncated docblock that left a generic
        # unclosed, an injected dependency nothing used, and an env var passed
        # to a provider without being validated against the values the provider
        # accepts — none of which the formatter or the suite could see.
        run: npm run analyse:api

      - name: Architectural boundaries
        # mago's guard: which namespace may depend on which, from
        # docs/architecture/scopes.md. A scope reaching into another scope is
        # invisible to every other check in this file, because the code works.
        run: npm run guard:api

      - name: Why it failed
        if: failure()
        run: docker compose logs --tail 80 api postgres

  # ── The web client ──────────────────────────────────────────────────────────
  web:
    name: Web
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @soirely/web
      - run: npm run test --workspace @soirely/web
      # The build is a check in its own right: a change can lint and test and
      # still not compile, and finding that at deploy is finding it late.
      - run: npm run build --workspace @soirely/web

  # ── The mobile client ───────────────────────────────────────────────────────
  mobile:
    name: Mobile
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @soirely/mobile
      - run: npm run test --workspace @soirely/mobile
      # The web target, because it is the one a runner can build without a
      # simulator — and it bundles the same module graph, so a missing import
      # or a broken package fails here. It does NOT prove the app runs on a
      # device; nothing in CI can.
      - name: Bundle
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist

  # ── The shared packages ─────────────────────────────────────────────────────
  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @soirely/domain --workspace @soirely/api-client --workspace @soirely/i18n-lint --workspace @soirely/agent-gateway
      - run: npm run test --workspace @soirely/domain --workspace @soirely/api-client --workspace @soirely/agent-gateway

  # ── Localisation, its own status ────────────────────────────────────────────
  #
  # Separate from `packages` even though it lives there, because this is the
  # check whose failure needs to be unmistakable: every failure it catches
  # renders fluently in the wrong way, and a status reading "Packages" would
  # bury it.
  locales:
    name: Localisation
    needs: changes
    if: needs.changes.outputs.locales == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @soirely/i18n-lint

  # ── One status for branch protection to require ─────────────────────────────
  #
  # This job exists because of a trap. Requiring the per-surface statuses
  # directly does not work: a job skipped by its `if` reports as *skipped*,
  # GitHub treats a skipped required check as PENDING, and an API-only pull
  # request would therefore wait forever for a Web check that was correctly
  # never going to run.
  #
  # So protection requires this one gate instead. It always runs, and it fails
  # only when something that DID run came back failed or cancelled — skipped is
  # the expected state for most jobs on most pull requests.
  required:
    name: All checks
    if: always()
    needs: [changes, lint, comments, api, web, mobile, packages, locales]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check that ran did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "${RESULTS}"

          # `failure` and `cancelled` are the only bad outcomes. `skipped` means
          # the surface was untouched, which is the normal case.
          if echo "${RESULTS}" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::At least one check failed. See the statuses above."
            exit 1
          fi

          echo "Every check that ran passed."
