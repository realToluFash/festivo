php-version = "8.4.0"

[source]
paths = ["config/", "src/", "tests/", "migrations/"]
includes = ["vendor"]
excludes = [
    # Generated by Symfony Flex and rewritten whenever a recipe runs.
    "config/reference.php",
]

[formatter]
# 99% of lines are already under 102 characters and only 5 exceed 120, so this
# reflows almost nothing. A wider setting would let future lines grow.
print-width = 120
tab-width = 4
use-tabs = false
null-type-hint = "question"
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true
preserve-breaking-parameter-list = true

[linter]
baseline = ".build/mago/lint-baseline.toml"
integrations = ["php-standard-library", "phpunit", "symfony"]
minimum-fail-level = "note"

[linter.rules]
# Shape metrics, not defects. Every one of these fires on a convention
# writing-php states outright, so leaving them on would mean the linter and the
# skill disagree in CI.
#
# excessive-parameter-list counts promoted constructor properties, so every
# `final readonly` value object trips it — Address, SignedUpload, Ask, Turn,
# AuditEntry all did. too-many-methods fires on a test class with one method per
# case, which is how a test class is supposed to look. cyclomatic-complexity and
# kan-defect fire on the two adapters that map a third party's payload, where the
# branching is the third party's shape and not ours to simplify.
excessive-parameter-list = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
too-many-enum-cases = { enabled = false }
cyclomatic-complexity = { enabled = false }
kan-defect = { enabled = false }
halstead = { enabled = false }
excessive-nesting = { enabled = false }

# Wants 4_218_305 and 51.503_363_5. Those are an OpenStreetMap id and a
# latitude: identifiers and coordinates, where digit grouping reads as damage
# rather than as help. The rule is right about magnitudes and we have none.
readable-literal = { enabled = false }

# Wants a named argument wherever a literal is passed positionally, including
# \json_decode($s, true, 512, \JSON_THROW_ON_ERROR). 64 sites, no error any of
# them could prevent.
literal-named-argument = { enabled = false }

# ErrorCode maps three separate conditions to 503. Combining them into one arm
# to satisfy the rule would put three unrelated concepts on one line and lose
# the grouping that makes the match readable.
no-duplicate-match-arm = { enabled = false }

# $answer?->inputTokens ?? 0 behaves the same as $answer->inputTokens ?? 0, so
# the rule is correct about the semantics. We keep the operator: it says
# $answer may be null, where plain -> with ?? hides it, and the two lines above
# it are nullsafe chains the rule does not flag.
no-redundant-nullsafe = { enabled = false }

# isset() on an array key is the idiomatic check and says nothing about nulls.
# The rule stays on for object properties, where it does.
no-isset = { allow-array-checks = true }

# A test that asserts an exception is thrown catches it and does nothing. That
# is the assertion, not a swallowed error.
no-empty-catch-clause = { enabled = false }

# Asks for Psl\DateTime\DateTime, which Doctrine cannot map. Every entity that
# stores a timestamp declares DateTimeImmutable because `datetime_immutable` is
# the column type, so the rule fires on correct code and its advice cannot be
# taken. The rest of the psl-* family stays on — see the lint baseline.
psl-datetime = { enabled = false }

# Formatting preferences with no failure behind them, and php-cs-fixer already
# owns this ground.
no-shorthand-ternary = { enabled = false }
no-else-clause = { enabled = false }
prefer-early-continue = { enabled = false }
no-boolean-flag-parameter = { enabled = false }

# No baseline: the analyser is clean, and it stays that way because CI runs it.
# The linter has one, for the Psl conversion the lint-baseline.toml header
# explains.
[analyzer]
plugins = ["php-standard-library"]
minimum-fail-level = "note"
ignore = [
    # A value that arrives as mixed and is coerced through Psl\Type at the
    # boundary is still mixed everywhere the analyser looks, because the shape
    # lives in the coercion and not in a signature. These fire on every
    # json_decode and every Type\shape result, which is where our own
    # convention puts them on purpose. The reference project ignores the same
    # family for the same reason.
    "mixed-argument",
    "mixed-array-access",
    "mixed-assignment",
    "mixed-method-access",
    "mixed-operand",
    "mixed-return-statement",

    # A Doctrine column is read by SQL, by a report and by a later migration,
    # none of which the analyser can see. An audit trail's actor columns exist
    # to be queried, not to be called from PHP.
    "write-only-property",

    # preg_match's third argument is assigned by the call. There is no way to
    # declare it beforehand.
    "reference-to-undefined-variable",
]

# Architectural boundaries. docs/architecture/scopes.md says each scope owns its
# facts; until this existed, nothing stopped one reaching into another.
[guard]
mode = "perimeter"

[guard.perimeter.layers]
native = ["@native"]

external = [
    "Anthropic\\**",
    "ApiPlatform\\**",
    "AsyncAws\\**",
    "BaconQrCode\\**",
    "Doctrine\\**",
    "Elao\\**",
    "Lcobucci\\**",
    "Lexik\\**",
    "libphonenumber\\**",
    "OTPHP\\**",
    "PHPUnit\\**",
    "Psl\\**",
    "Psr\\**",
    "Symfony\\**",
]

# The vocabulary every module reads. Entities are the persisted shape and enums
# are the closed sets; both are shared on purpose.
shared = ["App\\Entity\\**", "App\\Enum\\**", "App\\Http\\**"]

# Product scopes. docs/architecture/scopes.md owns the list; each is its own
# layer so one reaching into another has to be declared rather than happen.
domain_user = ["App\\Domain\\User\\**"]
domain_organisation = ["App\\Domain\\Organisation\\**"]
domain_event = ["App\\Domain\\Event\\**"]
domain_messaging = ["App\\Domain\\Messaging\\**"]

# Capabilities. Each is its own layer so an edge between two of them has to be
# declared below rather than appearing by accident.
ai = ["App\\AI\\**"]
address = ["App\\Address\\**"]
audit = ["App\\Audit\\**"]
doctrine = ["App\\Doctrine\\**"]
health = ["App\\Health\\**"]
locale = ["App\\Locale\\**"]
storage = ["App\\Storage\\**"]
translation = ["App\\Translation\\**"]
repository = ["App\\Repository\\**"]

integrations = ["App\\Integrations\\**"]
oidc = ["App\\Integrations\\OpenIdConnect\\**"]
tests = ["App\\Tests\\**"]

# ── Capabilities ────────────────────────────────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\AI\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:ai", "@layer:audit", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Address\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:address", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Audit\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:audit"]

[[guard.perimeter.rules]]
namespace = "App\\Doctrine\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:doctrine"]

[[guard.perimeter.rules]]
namespace = "App\\Health\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:health", "@layer:storage"]

[[guard.perimeter.rules]]
namespace = "App\\Locale\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Storage\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:storage"]

[[guard.perimeter.rules]]
namespace = "App\\Translation\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:translation", "@layer:locale"]

# A repository answers questions about one scope's data, so it may use that
# scope's vocabulary — UserRepository asks EmailAddressNormaliser what "the same address"
# means rather than keeping a second copy of the rule. The edge is one way:
# nothing in Domain reaches back into Repository except through its own
# constructor injection.
[[guard.perimeter.rules]]
namespace = "App\\Repository\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:repository", "@layer:domain_user"]

# ── Product scopes ──────────────────────────────────────────────────────────────

# The details screen founds the account's organisation (sc-57), through the
# organisation scope's own step rather than by writing its tables. The account's
# language is one of SupportedLocales (sc-852), as AI's and Address's are.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\User\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_user",
    "@layer:domain_organisation",
    "@layer:repository",
    "@layer:audit",
    "@layer:locale",
]

# Organisations read the user scope's vocabulary (EmailAddressNormaliser for a
# contact address); the user scope does not reach back. A role's changes go to the
# audit trail (sc-66), as an account's do. A custom role's name is checked against
# the seeded labels in every one of SupportedLocales (sc-2301).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Organisation\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_organisation",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:locale",
]

# Events check their zone and currency as an organisation's are checked (Regions,
# AccountTimeZone), and each create goes to the audit trail (sc-1486). A venue's
# address is picked through the address lookup (sc-3589). A new date, time or zone
# re-schedules what the one clock counts from it (sc-104).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Event\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_event",
    "@layer:domain_organisation",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:storage",
    "@layer:address",
    "@layer:domain_messaging",
]

# Messaging is the one machine every scope tells people through (sc-104). It reads members as the
# organisation scope keeps them, through the access layer's grants, and a person's language as the
# user scope chooses it (AccountLanguage).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Messaging\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_messaging",
    "@layer:domain_user",
    "@layer:repository",
]

# ── Integrations ────────────────────────────────────────────────────────────────
#
# An adapter sees the port it implements and nothing else of ours. That is the
# whole point of putting it here: swapping a provider must not be able to touch
# anything beyond the interface it satisfies.

[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Anthropic\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:ai"]

# The breach corpus. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Hibp\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user"]

# The SMS provider. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Twilio\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user"]

# WhatsApp, for phone codes (sc-750). It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Meta\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user"]

# The OpenID providers. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\OpenIdConnect\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user", "@layer:oidc"]

# DNS over HTTPS, for proving a domain (sc-6640). It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Dns\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_organisation"]

[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Nominatim\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:address"]

# The one place that is allowed to name a concrete adapter. Which assistant runs
# is an environment variable, and a service id cannot be one, so the choice has
# to be made in PHP by something that can see both implementations. Keeping the
# exception this narrow is what stops it spreading: no other class under
# App\\AI\\ may import from App\\Integrations\\.
[[guard.perimeter.rules]]
namespace = "App\\AI\\Factory\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:ai",
    "@layer:integrations",
    "@layer:locale",
]

# ── Entities, enums and the Http boundary ───────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\Entity\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:doctrine"]

[[guard.perimeter.rules]]
namespace = "App\\Enum\\"
permit = ["@layer:native", "@layer:external", "@layer:shared"]

[[guard.perimeter.rules]]
namespace = "App\\Http\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:locale", "@layer:audit"]

# ── Tests see everything ────────────────────────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\Tests\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "App\\"
permit = ["@layer:native", "@layer:external", "@layer:shared"]

[[guard.perimeter.rules]]
namespace = "DoctrineMigrations\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "Symfony\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "@global"
permit = ["@all"]
