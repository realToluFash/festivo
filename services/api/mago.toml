php-version = "8.4.0"

[source]
paths = ["config/", "src/", "tests/", "migrations/"]
includes = ["vendor"]
excludes = [
    # Generated by Symfony Flex and rewritten whenever a recipe runs.
    "config/reference.php",
]

[formatter]
# 99% of lines are already under 102 characters and only 5 exceed 120, so this
# reflows almost nothing. A wider setting would let future lines grow.
print-width = 120
tab-width = 4
use-tabs = false
null-type-hint = "question"
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true
preserve-breaking-parameter-list = true

[linter]
baseline = ".build/mago/lint-baseline.toml"
integrations = ["php-standard-library", "phpunit", "symfony"]
minimum-fail-level = "note"

[linter.rules]
# Shape metrics, not defects. Every one of these fires on a convention
# writing-php states outright, so leaving them on would mean the linter and the
# skill disagree in CI.
#
# excessive-parameter-list counts promoted constructor properties, so every
# `final readonly` value object trips it — Address, SignedUpload, Ask, Turn,
# AuditEntry all did. too-many-methods fires on a test class with one method per
# case, which is how a test class is supposed to look. cyclomatic-complexity and
# kan-defect fire on the two adapters that map a third party's payload, where the
# branching is the third party's shape and not ours to simplify.
excessive-parameter-list = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
too-many-enum-cases = { enabled = false }
cyclomatic-complexity = { enabled = false }
kan-defect = { enabled = false }
halstead = { enabled = false }
excessive-nesting = { enabled = false }

# Wants 4_218_305 and 51.503_363_5. Those are an OpenStreetMap id and a
# latitude: identifiers and coordinates, where digit grouping reads as damage
# rather than as help. The rule is right about magnitudes and we have none.
readable-literal = { enabled = false }

# Wants a named argument wherever a literal is passed positionally, including
# \json_decode($s, true, 512, \JSON_THROW_ON_ERROR). 64 sites, no error any of
# them could prevent.
literal-named-argument = { enabled = false }

# ErrorCode maps three separate conditions to 503. Combining them into one arm
# to satisfy the rule would put three unrelated concepts on one line and lose
# the grouping that makes the match readable.
no-duplicate-match-arm = { enabled = false }

# $answer?->inputTokens ?? 0 behaves the same as $answer->inputTokens ?? 0, so
# the rule is correct about the semantics. We keep the operator: it says
# $answer may be null, where plain -> with ?? hides it, and the two lines above
# it are nullsafe chains the rule does not flag.
no-redundant-nullsafe = { enabled = false }

# isset() on an array key is the idiomatic check and says nothing about nulls.
# The rule stays on for object properties, where it does.
no-isset = { allow-array-checks = true }

# A test that asserts an exception is thrown catches it and does nothing. That
# is the assertion, not a swallowed error.
no-empty-catch-clause = { enabled = false }

# Asks for Psl\DateTime\DateTime, which Doctrine cannot map. Every entity that
# stores a timestamp declares DateTimeImmutable because `datetime_immutable` is
# the column type, so the rule fires on correct code and its advice cannot be
# taken. The rest of the psl-* family stays on — see the lint baseline.
psl-datetime = { enabled = false }

# Formatting preferences with no failure behind them, and php-cs-fixer already
# owns this ground.
no-shorthand-ternary = { enabled = false }
no-else-clause = { enabled = false }
prefer-early-continue = { enabled = false }
no-boolean-flag-parameter = { enabled = false }

# No baseline: the analyser is clean, and it stays that way because CI runs it.
# The linter has one, for the Psl conversion the lint-baseline.toml header
# explains.
[analyzer]
plugins = ["php-standard-library"]
minimum-fail-level = "note"
ignore = [
    # A value that arrives as mixed and is coerced through Psl\Type at the
    # boundary is still mixed everywhere the analyser looks, because the shape
    # lives in the coercion and not in a signature. These fire on every
    # json_decode and every Type\shape result, which is where our own
    # convention puts them on purpose. The reference project ignores the same
    # family for the same reason.
    "mixed-argument",
    "mixed-array-access",
    "mixed-assignment",
    "mixed-method-access",
    "mixed-operand",
    "mixed-return-statement",

    # A Doctrine column is read by SQL, by a report and by a later migration,
    # none of which the analyser can see. An audit trail's actor columns exist
    # to be queried, not to be called from PHP.
    "write-only-property",

    # preg_match's third argument is assigned by the call. There is no way to
    # declare it beforehand.
    "reference-to-undefined-variable",
]

# Architectural boundaries. docs/architecture/scopes.md says each scope owns its
# facts; until this existed, nothing stopped one reaching into another.
[guard]
mode = "perimeter"

[guard.perimeter.layers]
native = ["@native"]

external = [
    "Anthropic\\**",
    "ApiPlatform\\**",
    "AsyncAws\\**",
    "BaconQrCode\\**",
    "Doctrine\\**",
    "Elao\\**",
    "Lcobucci\\**",
    "Lexik\\**",
    "libphonenumber\\**",
    "Monolog\\**",
    "OTPHP\\**",
    "PHPUnit\\**",
    "Psl\\**",
    "Psr\\**",
    "Symfony\\**",
]

# The vocabulary every module reads. Entities are the persisted shape and enums
# are the closed sets; both are shared on purpose.
shared = ["App\\Entity\\**", "App\\Enum\\**", "App\\Http\\**"]

# Product scopes. docs/architecture/scopes.md owns the list; each is its own
# layer so one reaching into another has to be declared rather than happen.
domain_user = ["App\\Domain\\User\\**"]
domain_organisation = ["App\\Domain\\Organisation\\**"]
domain_event = ["App\\Domain\\Event\\**"]
domain_messaging = ["App\\Domain\\Messaging\\**"]
domain_seating = ["App\\Domain\\Seating\\**"]
domain_guest = ["App\\Domain\\Guest\\**"]
domain_staff = ["App\\Domain\\Staff\\**"]
domain_menu = ["App\\Domain\\Menu\\**"]
domain_service = ["App\\Domain\\Service\\**"]
domain_run_of_show = ["App\\Domain\\RunOfShow\\**"]
domain_budget = [
    "App\\Domain\\Budget\\*",
    "App\\Domain\\Budget\\Command\\**",
    "App\\Domain\\Budget\\Controller\\**",
    "App\\Domain\\Budget\\Model\\**",
    "App\\Domain\\Budget\\Reminder\\**",
    "App\\Domain\\Budget\\Http\\BudgetSerialiser",
    "App\\Domain\\Budget\\Http\\PayersSerialiser",
    "App\\Domain\\Budget\\Http\\QuoteSerialiser",
    "App\\Domain\\Budget\\Http\\StaffRatesSerialiser",
    "App\\Domain\\Budget\\Http\\VendorDirectory",
    "App\\Domain\\Budget\\Http\\VendorDirectoryProvider",
    "App\\Domain\\Budget\\Http\\VendorSerialiser",
]
# Internal cost and margin leave the server only through MarginSerialiser (sc-92), so it is a
# layer of its own that no other scope gets with domain_budget.
budget_margin = ["App\\Domain\\Budget\\Http\\MarginSerialiser"]
domain_billing = ["App\\Domain\\Billing\\**"]

# Capabilities. Each is its own layer so an edge between two of them has to be
# declared below rather than appearing by accident.
ai = ["App\\AI\\**"]
address = ["App\\Address\\**"]
audit = ["App\\Audit\\**"]
deletion = ["App\\Deletion\\**"]
doctrine = ["App\\Doctrine\\**"]
health = ["App\\Health\\**"]
app_version = ["App\\AppVersion\\**"]
locale = ["App\\Locale\\**"]
storage = ["App\\Storage\\**"]
pdf = ["App\\Pdf\\**"]
realtime = ["App\\Realtime\\**"]
translation = ["App\\Translation\\**"]
repository = ["App\\Repository\\**"]
webauthn = ["App\\WebAuthn\\**"]

integrations = ["App\\Integrations\\**"]
oidc = ["App\\Integrations\\OpenIdConnect\\**"]
tests = ["App\\Tests\\**"]

# ── Capabilities ────────────────────────────────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\AI\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:ai", "@layer:audit", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Address\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:address", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Audit\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:audit"]

# One deletion model for whatever support can restore (sc-68, sc-3592): the window,
# the typed name, the restore and the purge. Each scope keeps its own deleter.
[[guard.perimeter.rules]]
namespace = "App\\Deletion\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:deletion", "@layer:audit", "@layer:doctrine"]

[[guard.perimeter.rules]]
namespace = "App\\Doctrine\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:doctrine"]

# The PDF maker (sc-3911): HTML in, a tagged PDF out, by WeasyPrint on the image (sc-5821).
[[guard.perimeter.rules]]
namespace = "App\\Pdf\\"
permit = ["@layer:native", "@layer:external", "@layer:pdf"]

[[guard.perimeter.rules]]
namespace = "App\\AppVersion\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:app_version"]

[[guard.perimeter.rules]]
namespace = "App\\Health\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:health", "@layer:storage"]

[[guard.perimeter.rules]]
namespace = "App\\Locale\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:locale"]

[[guard.perimeter.rules]]
namespace = "App\\Realtime\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:realtime"]

[[guard.perimeter.rules]]
namespace = "App\\Storage\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:storage"]

# Passkey ceremonies (sc-86885): bytes in, a checked credential or assertion out.
[[guard.perimeter.rules]]
namespace = "App\\WebAuthn\\"
permit = ["@layer:native", "@layer:external", "@layer:webauthn"]

[[guard.perimeter.rules]]
namespace = "App\\Translation\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:translation", "@layer:locale"]

# A repository answers questions about one scope's data, so it may use that
# scope's vocabulary — UserRepository asks EmailAddressNormaliser what "the same address"
# means rather than keeping a second copy of the rule. The edge is one way:
# nothing in Domain reaches back into Repository except through its own
# constructor injection.
[[guard.perimeter.rules]]
namespace = "App\\Repository\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:repository", "@layer:domain_user"]

# ── Product scopes ──────────────────────────────────────────────────────────────

# The details screen founds the account's organisation (sc-57), through the
# organisation scope's own step rather than by writing its tables. The account's
# language is one of SupportedLocales (sc-852), as AI's and Address's are. Every account
# and security email is queued on the notification path (sc-4332), through UserMailer.
# A staff link's sign-in holds its job's level (sc-4235): the account lists it, and a
# browser session ends with it, read from StaffLinkGrants alone, as OutsideEvent.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\User\\"
permit = [
    "App\\Domain\\Staff\\Link\\StaffLinkGrants",
    "App\\Domain\\Staff\\Link\\OutsideEvent",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_user",
    "@layer:domain_organisation",
    "@layer:domain_messaging",
    "@layer:repository",
    "@layer:audit",
    "@layer:locale",
    "@layer:webauthn",
]

# Organisations read the user scope's vocabulary (EmailAddressNormaliser for a
# contact address); the user scope does not reach back. A role's changes go to the
# audit trail (sc-66), as an account's do. A custom role's name is checked against
# the seeded labels in every one of SupportedLocales (sc-2301). Its deletion uses the
# shared restore window and typed-name check (sc-3592). Members reads
# whether an invitation's email could not be delivered from its delivery record and the
# suppression list (sc-46109); messaging does not reach back. Export all data keeps
# its archive in the private bucket, and writes its CSV files as the guest export
# does (CsvFile, sc-612); neither reaches back. An account a staff link signed in
# holds its job's level on the event, from StaffLinkGrants (sc-4235), as OutsideEvent.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Organisation\\"
permit = [
    "App\\Domain\\Staff\\Link\\StaffLinkGrants",
    "App\\Domain\\Staff\\Link\\OutsideEvent",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_organisation",
    "@layer:domain_user",
    "@layer:domain_messaging",
    "@layer:domain_guest",
    "@layer:domain_billing",
    "@layer:repository",
    "@layer:audit",
    "@layer:deletion",
    "@layer:locale",
    "@layer:storage",
]

# Plans & billing (sc-3927): the subscription, who pays for it, and the one
# entitlement answer. The organisation scope founds a subscription and asks for
# the answer; billing never reaches back. Staff actions on the plan catalogue
# are audited (sc-3928), and its unit-cost countries are checked against the one
# country list (Regions), not the scope around it. A purge takes a billing account
# nothing is paid for by any more. The meter's usage reaches an open billing page
# through the one realtime publisher (sc-3929). Storage is measured from the
# sizes the object store reports for an organisation's kept files (sc-90252).
# A use past 80% or 100% of an included amount is a Money notice scheduled and sent
# through messaging, its sizes and percent written in the reader's locale (sc-3931).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Billing\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_billing", "@layer:domain_messaging", "@layer:locale", "@layer:repository", "@layer:deletion", "@layer:audit", "@layer:realtime", "@layer:storage", "App\\Domain\\Organisation\\Regions"]

# Events check their zone and currency as an organisation's are checked (Regions,
# AccountTimeZone), and each create goes to the audit trail (sc-1486). A venue's
# address is picked through the address lookup (sc-3589). Its deletion uses the
# shared window and typed name (sc-3592). A new date, time or zone re-schedules
# what the one clock counts from it (sc-104). A duplicate brings the guest list
# through the guests' scope when asked (sc-3656). Search folds a member's name by the
# shared rule (NameNormaliser) to match and rank it (sc-39534). A new event, and a
# duplicate, starts with the suggested jobs through the staff scope (sc-3908).
# Making one live, and a copy's guest list, are held to the plan's hard limits (sc-3930).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Event\\"
permit = [
    "App\\Domain\\Billing\\Interfaces\\HardLimitsInterface",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_event",
    "@layer:domain_organisation",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:storage",
    "@layer:address",
    "@layer:domain_messaging",
    "@layer:deletion",
    "@layer:domain_seating",
    "@layer:domain_guest",
    "@layer:domain_staff",
    "@layer:locale",
]

# Venue & seating: an event's one plan, its room and its sections (sc-3998). Each
# change goes to the audit trail and out on the plan's topic. A duplicated event
# copies its plan through this scope (EventDuplicator). Share by adds its milestone to
# the event's timeline (sc-4022). It reads the headcount's Coming for the room in
# numbers (sc-103); Budget reads those numbers.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Seating\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_seating",
    "@layer:domain_event",
    "@layer:domain_guest",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Guests: an event's list and adding to it (sc-1468). A mobile number is checked by the
# account's parser, a name folded by the shared rule; each add is audited and published.
# A guest's own page shows the event's cover as the event's page serialises it (sc-1526),
# and the items the hosts show to guests as the running order works them out (sc-3899),
# and their table once the hosts share the tables (sc-4022), and the meal picks for
# each person coming (sc-3907). A reply, a guest's own needs and a flagged link tell the
# event's members through messaging's Guest replies (sc-4331). A guest added, or a
# companion place given, is held to the plan's people per event and the ceiling (sc-3930).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Guest\\"
permit = [
    "App\\Domain\\Billing\\Interfaces\\HardLimitsInterface",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_guest",
    "@layer:domain_event",
    "@layer:domain_menu",
    "@layer:domain_messaging",
    "@layer:domain_run_of_show",
    "@layer:domain_seating",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Staffing: an event's roster, the people working it without being members (sc-3906). A
# mobile number is checked by the account's parser; each change is audited and published.
# A shift's wall-clock times are read in the event's zone as the event's own are (sc-3908).
# Stations give each course's items, as the menu lists them, the place that dishes them (sc-3910).
# A change to a briefed person's shifts is told to them through messaging (sc-4333).
# Hours worked are corrected only by a member who manages staff, read from the member's grants (sc-234).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Staff\\"
permit = [
    "App\\Domain\\Organisation\\MembershipDirectory",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_event",
    "@layer:domain_menu",
    "@layer:domain_messaging",
    "@layer:domain_staff",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Service floor: every guest's plate on its way to them (sc-4005). Orders are made from the
# guests' picks and needs, items are dished where Stations put them, a table is reached
# through Staff's ServiceTables (sc-4002), and every change is a patch on its topic. A late
# arrival reaches it through Guest's port.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Service\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_guest",
    "@layer:domain_menu",
    "@layer:domain_service",
    "@layer:domain_staff",
    "@layer:repository",
    "@layer:realtime",
    "@layer:locale",
]

# Menu: the organisation's dish library (sc-3901) and each event's menu (sc-3902). A
# last price's currency is one of the organisation's offered currencies; each change is
# audited. An event's menu is published whole on its topic, and an allergen added to a
# picked dish is counted against the allergies its pickers have recorded (sc-3777).
# A variant's or a folded dish's cost holds the event's currency (sc-3903). Who has not
# chosen a meal is told to the guest summary through Messaging's port (sc-80901).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Menu\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_menu",
    "@layer:domain_messaging",
    "@layer:domain_event",
    "@layer:domain_organisation",
    "@layer:domain_guest",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
    "@layer:pdf",
]

# Budget & costs: the organisation's vendors (sc-82). A vendor's number is checked by
# the account's parser, as a guest's is.
# Budget & costs: an event's cost lines (sc-83). A line's quantity is read from what the
# event already knows, accepted guests (sc-99), tables in the seating plan and the event's
# days, so it reads the guest headcount and the event's day count; a price is parsed and
# written at the currency's minor unit by Locale's Money, as the menu's costs are
# (sc-68066). A line holds the event's currency (sc-98); each change is audited and
# published. The margin is published only to an organisation whose plan unlocks it,
# asked of billing's one entitlement answer (sc-92). A payment falling due is a message
# scheduled and sent through messaging (sc-95). Staff rates price the scheduled hours
# of Staffing's shifts, read on the event's clock through Staff's ShiftClock (sc-101).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Budget\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_budget",
    "@layer:budget_margin",
    "@layer:domain_billing",
    "@layer:domain_event",
    "@layer:domain_guest",
    "@layer:domain_seating",
    "@layer:domain_messaging",
    "@layer:domain_staff",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Only Budget's controllers and its top-level classes (MarginController, BudgetPublisher)
# reach MarginSerialiser; its commands, models and other serialisers do not.
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Budget\\Command\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_budget",
    "@layer:domain_billing",
    "@layer:domain_event",
    "@layer:domain_guest",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

[[guard.perimeter.rules]]
namespace = "App\\Domain\\Budget\\Http\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_budget",
    "@layer:domain_billing",
    "@layer:domain_event",
    "@layer:domain_guest",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

[[guard.perimeter.rules]]
namespace = "App\\Domain\\Budget\\Model\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_budget",
    "@layer:domain_billing",
    "@layer:domain_event",
    "@layer:domain_guest",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Run of show: an event's running order, built on the Schedule page (sc-3893). Its
# starts are wall-clock times read with the event's zone (LocalTimeResolver), and it
# adds each day's first item and its fixed-time items to the event's timeline. Each
# change is audited and published, and a press sends its track's card through
# messaging (sc-66580). It answers Menu's port for the item a course is linked to (sc-3898).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\RunOfShow\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_run_of_show",
    "@layer:domain_menu",
    "@layer:domain_event",
    "@layer:domain_messaging",
    "@layer:repository",
    "@layer:audit",
    "@layer:realtime",
    "@layer:locale",
]

# Messaging is the one machine every scope tells people through (sc-104). It reads members as the
# organisation scope keeps them, through the access layer's grants, and a person's language as the
# user scope chooses it (AccountLanguage). The bell publishes its items on a declared topic (sc-3980).
# An event's changes write dates in the house order for each language (SupportedLocales, sc-13214).
# A host's send to guests is in the audit log (sc-3942).
[[guard.perimeter.rules]]
namespace = "App\\Domain\\Messaging\\"
permit = [
    "@layer:audit",
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:domain_messaging",
    "@layer:domain_user",
    "@layer:repository",
    "@layer:realtime",
    "@layer:locale",
]

# ── Integrations ────────────────────────────────────────────────────────────────
#
# An adapter sees the port it implements and nothing else of ours. That is the
# whole point of putting it here: swapping a provider must not be able to touch
# anything beyond the interface it satisfies.

[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Anthropic\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:ai"]

# The breach corpus. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Hibp\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user"]

# The SMS provider. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Twilio\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user"]

# WhatsApp, for phone codes (sc-750). It sees the port it implements, and messaging's
# payment refusal that every WhatsApp sender raises (sc-45470), and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Meta\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user", "@layer:domain_messaging"]

# Push's two providers (sc-3980). Each sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\WebPush\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_messaging", "Minishlink\\**", "GuzzleHttp\\HandlerStack"]

[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Expo\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_messaging"]

# The OpenID providers. It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\OpenIdConnect\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_user", "@layer:oidc"]

# The merchant of record (sc-3933). It sees billing's port and the changer every rail writes through, and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Paddle\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_billing", "@layer:repository", "App\\Integrations\\Paddle\\**"]

# DNS over HTTPS, for proving a domain (sc-6640). It sees the port it implements and nothing else of ours.
[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Dns\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:domain_organisation"]

[[guard.perimeter.rules]]
namespace = "App\\Integrations\\Nominatim\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:address"]

# The one place that is allowed to name a concrete adapter. Which assistant runs
# is an environment variable, and a service id cannot be one, so the choice has
# to be made in PHP by something that can see both implementations. Keeping the
# exception this narrow is what stops it spreading: no other class under
# App\\AI\\ may import from App\\Integrations\\.
[[guard.perimeter.rules]]
namespace = "App\\AI\\Factory\\"
permit = [
    "@layer:native",
    "@layer:external",
    "@layer:shared",
    "@layer:ai",
    "@layer:integrations",
    "@layer:locale",
]

# ── Entities, enums and the Http boundary ───────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\Entity\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:doctrine"]

[[guard.perimeter.rules]]
namespace = "App\\Enum\\"
permit = ["@layer:native", "@layer:external", "@layer:shared"]

[[guard.perimeter.rules]]
namespace = "App\\Http\\"
permit = ["@layer:native", "@layer:external", "@layer:shared", "@layer:locale", "@layer:audit"]

# ── Tests see everything ────────────────────────────────────────────────────────

[[guard.perimeter.rules]]
namespace = "App\\Tests\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "App\\"
permit = ["@layer:native", "@layer:external", "@layer:shared"]

[[guard.perimeter.rules]]
namespace = "DoctrineMigrations\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "Symfony\\"
permit = ["@all"]

[[guard.perimeter.rules]]
namespace = "@global"
permit = ["@all"]
