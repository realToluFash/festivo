# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.refresh_token_ttl: '%env(int:REFRESH_TOKEN_TTL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $appEnv: '%kernel.environment%'
            string $mailFrom: '%env(MAIL_FROM)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Storage\ObjectStore:
        # Public so tests can fetch it. A `when@test` override cannot do this:
        # re-declaring the service there replaces this definition rather than
        # merging with it, and the arguments below are silently lost.
        public: true
        arguments:
            $privateBucket: '%env(STORAGE_BUCKET_PRIVATE)%'
            $publicBucket: '%env(STORAGE_BUCKET_PUBLIC)%'
            $publicEndpoint: '%env(STORAGE_PUBLIC_ENDPOINT)%'

    # Autowires completely, so it needs no arguments — but the compiler removes
    # it as unused until a scope injects it, and a test cannot fetch what is
    # not there.
    App\Audit\Auditor:
        public: true

    # Same reason, and the same trap: this must be declared HERE and not under
    # when@test, because a definition there replaces the autowired one and
    # silently loses all six arguments.
    App\Domain\User\UserRegistrar:
        public: true

    App\Domain\User\Password\PasswordResolver:
        public: true

    # sc-57's details screen is its first caller; until then only tests do.
    App\Domain\Organisation\OrganisationFounder:
        public: true

    App\Integrations\Nominatim\NominatimProvider:
        arguments:
            $endpoint: '%env(ADDRESS_ENDPOINT)%'
            $userAgent: '%env(ADDRESS_USER_AGENT)%'

    # One adapter behind the interface. Switching provider is this line plus a
    # class, and nothing above it learns which one is in use.
    App\Address\Interfaces\AddressProviderInterface: '@App\Integrations\Nominatim\NominatimProvider'

    # One adapter behind the port. Have I Been Pwned is the only corpus worth
    # querying and swapping it is this line plus a class.
    App\Domain\User\Interfaces\BreachedPasswordCheckerInterface: '@App\Integrations\Hibp\HibpBreachedPasswordChecker'

    # One adapter behind the port; in development it reaches the SMS mock.
    App\Integrations\Twilio\TwilioTextMessageSender:
        arguments:
            $apiBase: '%env(SMS_API_BASE)%'
            $accountSid: '%env(SMS_ACCOUNT_SID)%'
            $authToken: '%env(SMS_AUTH_TOKEN)%'
            $from: '%env(SMS_FROM)%'
    App\Domain\User\Interfaces\TextMessageSenderInterface: '@App\Integrations\Twilio\TwilioTextMessageSender'

    # The assistant's adapter is chosen by ASSISTANT_PROVIDER rather than by a
    # line here, because a service id cannot be an environment variable and
    # pointing this at the local stand-in should not be a code change.
    App\AI\Interfaces\AssistantInterface:
        factory: ['@App\AI\Factory\AssistantFactory', 'create']

    App\Http\Access\Interfaces\MembershipDirectoryInterface: '@App\Domain\Organisation\MembershipDirectory'

    # Until events exist no event resolves, so every event route is not found.
    App\Http\Access\Interfaces\EventDirectoryInterface: '@App\Http\Access\Directory\NoEvents'

when@test:
    services:
        # Routes that exist only in the suite, to prove the access layer before
        # any real organisation or event route uses it.
        App\Tests\Fixtures\Access\:
            resource: '../tests/Fixtures/Access/'
            autowire: true
            autoconfigure: true

        # The suite can never reach a real provider, whatever ASSISTANT_PROVIDER
        # happens to say on this machine. Every assisted path — the gate, the
        # validation, the proxy, the record — runs here, and none of it is
        # billable or dependent on somebody having an account.
        App\AI\Interfaces\AssistantInterface: '@App\AI\ScriptedAssistant'

        # No test reaches Have I Been Pwned. The stand-in's list is what makes
        # "this password is in a breach" assertable at all: the real corpus is
        # somebody else's data and could answer differently tomorrow.
        App\Domain\User\Interfaces\BreachedPasswordCheckerInterface: '@App\Domain\User\Password\ScriptedBreachedPasswordChecker'

        # No test sends a text; what would have been sent is kept for the test to read.
        App\Domain\User\Verification\RecordingTextMessageSender:
            public: true
        App\Domain\User\Interfaces\TextMessageSenderInterface: '@App\Domain\User\Verification\RecordingTextMessageSender'

        # Re-declared in full, not merged: a `when@test` definition REPLACES the
        # autowired one, so every argument has to be named or it is lost. Pinned
        # rather than read from the environment so the gate is open in the suite
        # even on a machine configured for the real provider with no key.
        App\AI\Availability:
            arguments:
                $provider: !php/const App\AI\Availability::STAND_IN
                $apiKey: ''
                $enabled: true
