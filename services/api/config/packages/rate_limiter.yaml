framework:
    rate_limiter:
        address_lookup:
            # Per IP. An autocomplete field fires on keystrokes, so the budget is
            # generous — but a budget that cannot be exhausted is a provider bill
            # somebody else gets to set.
            policy: token_bucket
            limit: 60
            rate: { interval: '1 minute', amount: 30 }

        assistant_chat:
            # Lower than the geocoder's and burstier than it looks: one thing an
            # organiser asks for is several turns of an agent loop, each a
            # request, so the burst has to cover a loop while the sustained rate
            # does not cover a script. Per IP until there are accounts.
            policy: token_bucket
            limit: 20
            rate: { interval: '1 minute', amount: 10 }

        registration:
            # Per IP, which is the only thing available: the endpoint exists
            # because there is no account yet. Low, because a person registers
            # once and a script registers in bulk. Sliding window rather than a
            # bucket so a burst cannot be saved up and spent at once.
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        sign_in_ip:
            # Per IP, and generous, because one network is a whole office. It is
            # the per-account budget below that stops a password being guessed;
            # this one stops a script walking a list of addresses.
            policy: sliding_window
            limit: 30
            interval: '15 minutes'

        sign_in_account:
            # Per address, and tight, because this is the one that matters: a
            # password is guessed by trying many against one account, not one
            # against many. Keyed on the address rather than the account, so a
            # miss on an address nobody has registered costs the same as a hit
            # and the endpoint cannot be used to tell them apart.
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
