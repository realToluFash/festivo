# Stands in for the providers the stacks would otherwise call: SMS, WhatsApp, DNS, push and addresses.
#
# Each answers in its provider's own shape, so the API's client parses a real response rather
# than a simplified one that hides a mapping bug until production. Where two mocks match a
# request, the one further down the file answers.
#
# Reload after editing:  docker compose up smocker-init

# The SMS provider: a 201 for every message.
- request:
    method: POST
    path:
      matcher: ShouldMatch
      value: '/2010-04-01/Accounts/.*/Messages\.json'
  response:
    status: 201
    headers:
      Content-Type: [application/json]
    body: >
      {
        "sid": "SM00000000000000000000000000000000",
        "account_sid": "ACdevelopment00000000000000000000",
        "status": "queued",
        "direction": "outbound-api",
        "num_segments": "1",
        "error_code": null,
        "error_message": null
      }

# An unroutable number, so the failure path can be exercised deliberately.
- request:
    method: POST
    path:
      matcher: ShouldMatch
      value: '/2010-04-01/Accounts/.*/Messages\.json'
    body:
      matcher: ShouldContainSubstring
      value: '%2B15005550000'
  response:
    status: 400
    headers:
      Content-Type: [application/json]
    body: >
      {
        "code": 21211,
        "message": "The 'To' number is not a valid phone number.",
        "status": 400
      }

# The provider failing outright (sc-36468): an SMS to a number starting +23480399 answers 500, so
# "Text it to me instead" can be seen to fail after WhatsApp hands the code to a text.
- request:
    method: POST
    path:
      matcher: ShouldMatch
      value: '/2010-04-01/Accounts/.*/Messages\.json'
    body:
      matcher: ShouldContainSubstring
      value: '%2B23480399'
  response:
    status: 500
    headers:
      Content-Type: [application/json]
    body: >
      {
        "code": 20500,
        "message": "Internal Server Error",
        "status": 500
      }

# Stands in for Meta's WhatsApp Cloud API (sc-750): accepts the code template and answers with a
# message id as Meta does. Delivery reports are Meta's webhook, which nothing sends in development,
# so a code here falls back to SMS after 30 seconds unless the screen is closed first.
- request:
    method: POST
    path:
      matcher: ShouldMatch
      value: '/whatsapp/v21\.0/.*/messages'
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: >
      {
        "messaging_product": "whatsapp",
        "contacts": [{ "input": "+2348035550142", "wa_id": "2348035550142" }],
        "messages": [{ "id": "wamid.development", "message_status": "accepted" }]
      }

# Meta refusing every message for the account's payment (sc-45470): a code to a number starting
# +23480397 answers 131042, so the API's critical log line can be seen, and the code goes by SMS.
- request:
    method: POST
    path:
      matcher: ShouldMatch
      value: '/whatsapp/v21\.0/.*/messages'
    body:
      matcher: ShouldContainSubstring
      value: '"to":"+23480397'
  response:
    status: 400
    headers:
      Content-Type: [application/json]
    body: >
      {
        "error": {
          "message": "(#131042) Business eligibility payment issue",
          "type": "OAuthException",
          "code": 131042,
          "error_data": { "messaging_product": "whatsapp", "details": "Message failed to send because there were one or more errors related to your payment method." },
          "fbtrace_id": "development"
        }
      }

# Stands in for DNS over HTTPS (sc-6640): every name answers "no record", in the JSON form Cloudflare
# uses. To publish one, add a mock for GET /dns-query whose query `name` is the record's name, answering
# {"Status":0,"Answer":[{"name":"_soirely-verify.<domain>","type":16,"TTL":300,"data":"\"<value>\""}]}.
- request:
    method: GET
    path: /dns-query
  response:
    status: 200
    headers:
      Content-Type: [application/dns-json]
    body: >
      {"Status": 0, "Answer": []}

# Stands in for the Expo push service (sc-3980), one ticket per message as Expo answers.
- request:
    method: POST
    path: /expo/--/api/v2/push/send
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: >
      {"data": [{"status": "ok", "id": "00000000-0000-0000-0000-000000000000"}]}

# Stands in for OpenStreetMap's Nominatim (sc-80880), at ADDRESS_ENDPOINT=http://smocker:8080/nominatim,
# answering in its jsonv2 shape: osm_id a number, lat and lon strings. A query or an id it has no answer
# for gets an empty list, so the field offers nothing and the address is saved as typed. To offer more,
# add a /nominatim/search mock matching `q` below these, and a /nominatim/lookup one for each `osm_ids`.
- request:
    method: GET
    path: /nominatim/search
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: '[]'

- request:
    method: GET
    path: /nominatim/lookup
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: '[]'

# sc-15545: six answers, two pairs of which read the same, so the field lists four.
- request:
    method: GET
    path: /nominatim/search
    query_params:
      q:
        matcher: ShouldMatch
        value: '(?i)pra[cç]a do com[eé]rcio'
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: >
      [
        {"osm_type": "way", "osm_id": 25414350, "lat": "38.7075287", "lon": "-9.1364438",
         "display_name": "Praça do Comércio, Baixa, Santa Maria Maior, Lisboa, 1100-148, Portugal"},
        {"osm_type": "way", "osm_id": 25414351, "lat": "38.7076120", "lon": "-9.1362210",
         "display_name": "Praça do Comércio, Baixa, Santa Maria Maior, Lisboa, 1100-148, Portugal"},
        {"osm_type": "node", "osm_id": 4511023977, "lat": "38.7079102", "lon": "-9.1366730",
         "display_name": "Praça do Comércio, Rua Augusta, Santa Maria Maior, Lisboa, 1100-053, Portugal"},
        {"osm_type": "node", "osm_id": 2617833104, "lat": "38.7072015", "lon": "-9.1359800",
         "display_name": "Terminal Fluvial do Terreiro do Paço, Praça do Comércio, Lisboa, 1100-148, Portugal"},
        {"osm_type": "node", "osm_id": 2617833105, "lat": "38.7072020", "lon": "-9.1359810",
         "display_name": "Terminal Fluvial do Terreiro do Paço, Praça do Comércio, Lisboa, 1100-148, Portugal"},
        {"osm_type": "node", "osm_id": 5120934871, "lat": "38.7081455", "lon": "-9.1371009",
         "display_name": "Arco da Rua Augusta, Praça do Comércio, Lisboa, 1100-053, Portugal"}
      ]

- request:
    method: GET
    path: /nominatim/lookup
    query_params:
      osm_ids: W25414350
  response:
    status: 200
    headers:
      Content-Type: [application/json]
    body: >
      [
        {"osm_type": "way", "osm_id": 25414350, "lat": "38.7075287", "lon": "-9.1364438",
         "display_name": "Praça do Comércio, Baixa, Santa Maria Maior, Lisboa, 1100-148, Portugal",
         "address": {"road": "Praça do Comércio", "neighbourhood": "Baixa", "suburb": "Santa Maria Maior",
                     "city": "Lisboa", "state": "Lisboa", "postcode": "1100-148", "country": "Portugal",
                     "country_code": "pt"}}
      ]

